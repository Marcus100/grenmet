# GrenMet — Deploy Stack (staging AND production)
# Used by: .github/workflows/deploy.yml
#
# One compose file for both environments (Phase 4 single-source-of-truth).
# Environment differences live in the committed env files:
#   staging.env / production.env   — non-secret config (domains, DB names,
#                                    volume/network names, router suffix, profiles)
# plus a runtime-only runtime/.env.local written by the deploy workflow (secrets +
# image tags + DB URLs) and deleted afterwards. Invocation:
#   docker compose --env-file <env>.env --env-file runtime/.env.local \
#     -f docker-compose.deploy.yml -p <project> ...
#
# IMPORTANT: the explicit `name:` fields on volumes/networks pin the exact
# Docker object names that already exist on the droplets (they predate this
# merged file and embed the old per-env compose keys). Changing them would
# detach the stack from its data — especially PGDATA_VOLUME.
#
# adminer is staging-only: it sits behind `profiles: ["staging"]`, activated by
# COMPOSE_PROFILES=staging in staging.env.

# Bound disk consumption while keeping JSON logs compatible with existing readers.
x-logging: &bounded-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ── Database ────────────────────────────────────────────────────────────────
  db:
    logging: *bounded-logging
    image: ${CORE_POSTGRES_IMAGE:?Set the reviewed immutable PostgreSQL 17 image}
    ports:
      - "${CORE_PRIVATE_IP:?Set the core host private IP}:5432:5432"
    restart: always
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
      - ../postgres/grant-api-runtime.sh:/opt/grenmet/grant-api-runtime.sh:ro
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      WXWATCH_DB_NAME: ${WXWATCH_DB_NAME}
      WXWATCH_DB_USER: ${WXWATCH_DB_USER}
      WXWATCH_DB_PASSWORD: ${WXWATCH_DB_PASSWORD}
      WXPRODUCTS_DB_NAME: ${WXPRODUCTS_DB_NAME}
      WXPRODUCTS_DB_USER: ${WXPRODUCTS_DB_USER}
      WXPRODUCTS_DB_PASSWORD: ${WXPRODUCTS_DB_PASSWORD}
      EREGISTER_DB_NAME: ${EREGISTER_DB_NAME}
      EREGISTER_DB_USER: ${EREGISTER_DB_USER}
      EREGISTER_DB_PASSWORD: ${EREGISTER_DB_PASSWORD:?EREGISTER_DB_PASSWORD required}
      JANITORIAL_DB_NAME: ${JANITORIAL_DB_NAME}
      JANITORIAL_DB_USER: ${JANITORIAL_DB_USER}
      JANITORIAL_DB_PASSWORD: ${JANITORIAL_DB_PASSWORD}
      TRANSPORT_DB_NAME: ${TRANSPORT_DB_NAME}
      TRANSPORT_DB_USER: ${TRANSPORT_DB_USER}
      TRANSPORT_DB_PASSWORD: ${TRANSPORT_DB_PASSWORD}
      CMS_DB_NAME: ${CMS_DB_NAME:?CMS_DB_NAME required}
      CMS_DB_USER: ${CMS_DB_USER:?CMS_DB_USER required}
      CMS_DB_PASSWORD: ${CMS_DB_PASSWORD:?CMS_DB_PASSWORD required}
      FASTAPI_DB_USER: ${FASTAPI_DB_USER:?FASTAPI_DB_USER required}
      FASTAPI_DB_PASSWORD: ${FASTAPI_DB_PASSWORD:?FASTAPI_DB_PASSWORD required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: ${DB_HEALTH_START_PERIOD:-30s}
      timeout: 10s
    networks:
      - grenmet

  # ── FastAPI ─────────────────────────────────────────────────────────────────
  prestart:
    logging: *bounded-logging
    image: ${REGISTRY}/${IMAGE_NAME}:${TAG}
    restart: "no"
    command: bash scripts/prestart.sh
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy
    environment:
      WXPRODUCTS_DATABASE_URL: ${WXPRODUCTS_DB_URL:?WXPRODUCTS_DB_URL required}
      WXWATCH_DATABASE_URL: ${WXWATCH_DB_URL:?WXWATCH_DB_URL required}
      EREGISTER_DATABASE_URL: ${EREGISTER_DATABASE_URL:?EREGISTER_DATABASE_URL required}
      JANITORIAL_DATABASE_URL: ${JANITORIAL_DB_URL:?JANITORIAL_DB_URL required}
      TRANSPORT_DATABASE_URL: ${TRANSPORT_DB_URL:?TRANSPORT_DB_URL required}
      EREGISTER_DB_NAME: ${EREGISTER_DB_NAME:-eregister}
      WXPRODUCTS_DB_NAME: ${WXPRODUCTS_DB_NAME:-wxproducts}
      POSTGRES_SERVER: db
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SECRET_KEY: ${SECRET_KEY}
      AUTH_PRIVILEGED_MFA_MODE: ${AUTH_PRIVILEGED_MFA_MODE:-disabled}
      AUTH_TOTP_ENCRYPTION_KEYS: ${AUTH_TOTP_ENCRYPTION_KEYS:-[]}
      ORG_SECRET_ENCRYPTION_KEYS: ${ORG_SECRET_ENCRYPTION_KEYS:-[]}
      FIRST_SUPERUSER: ${FIRST_SUPERUSER}
      FIRST_SUPERUSER_PASSWORD: ${FIRST_SUPERUSER_PASSWORD}
      ENVIRONMENT: ${ENVIRONMENT}
      PROJECT_NAME: ${PROJECT_NAME}
      # Used by the email-hash data migration (a later, separately authorized step).
      EMAIL_HASH_PEPPER: ${EMAIL_HASH_PEPPER:-}
    networks:
      - grenmet

  api:
    logging: *bounded-logging
    image: ${REGISTRY}/${IMAGE_NAME}:${TAG}
    restart: always
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8000/api/v1/utils/ready/"]
      interval: 30s
      timeout: 10s
      # Sized when cold starts ran under ddtrace (about 3 minutes on staging,
      # 16 October 2026). ddtrace is gone; the margin stays until cold starts
      # are re-measured. core.sh waits up to 300s for healthy.
      start_period: 180s
      retries: 5
    depends_on:
      prestart:
        condition: service_completed_successfully
    volumes:
      - nhc-archive:/app/nhc-archive:ro
    environment:
      WXWATCH_LOCAL_ASSET_ROOTS: '{"nhc-local":"/app/nhc-archive"}'
      WXWATCH_INGEST_TOKEN: ${WXWATCH_INGEST_TOKEN:-}
      WXPRODUCTS_DATABASE_URL: ${WXPRODUCTS_DB_URL:?WXPRODUCTS_DB_URL required}
      WXWATCH_DATABASE_URL: ${WXWATCH_DB_URL:?WXWATCH_DB_URL required}
      EREGISTER_DATABASE_URL: ${EREGISTER_DATABASE_URL:?EREGISTER_DATABASE_URL required}
      JANITORIAL_DATABASE_URL: ${JANITORIAL_DB_URL:?JANITORIAL_DB_URL required}
      TRANSPORT_DATABASE_URL: ${TRANSPORT_DB_URL:?TRANSPORT_DB_URL required}
      EREGISTER_DB_NAME: ${EREGISTER_DB_NAME:-eregister}
      WXPRODUCTS_DB_NAME: ${WXPRODUCTS_DB_NAME:-wxproducts}
      POSTGRES_SERVER: db
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${FASTAPI_DB_USER:?FASTAPI_DB_USER required}
      POSTGRES_PASSWORD: ${FASTAPI_DB_PASSWORD:?FASTAPI_DB_PASSWORD required}
      SECRET_KEY: ${SECRET_KEY}
      AUTH_PRIVILEGED_MFA_MODE: ${AUTH_PRIVILEGED_MFA_MODE:-disabled}
      AUTH_TOTP_ENCRYPTION_KEYS: ${AUTH_TOTP_ENCRYPTION_KEYS:-[]}
      ORG_SECRET_ENCRYPTION_KEYS: ${ORG_SECRET_ENCRYPTION_KEYS:-[]}
      FIRST_SUPERUSER: ${FIRST_SUPERUSER}
      FIRST_SUPERUSER_PASSWORD: ${FIRST_SUPERUSER_PASSWORD}
      ENVIRONMENT: ${ENVIRONMENT}
      DOMAIN: ${DOMAIN}
      SENTRY_DSN: ${SENTRY_DSN_API:-}
      API_BASE_URL: https://api.${BASE_DOMAIN}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      BILLING_STRIPE_SECRET_KEY: ${BILLING_STRIPE_SECRET_KEY:-}
      BILLING_STRIPE_WEBHOOK_SECRET: ${BILLING_STRIPE_WEBHOOK_SECRET:-}
      BILLING_STRIPE_PRICE_ID: ${BILLING_STRIPE_PRICE_ID:-}
      BILLING_CHECKOUT_SUCCESS_URL: ${BILLING_CHECKOUT_SUCCESS_URL:-}
      BILLING_CHECKOUT_CANCEL_URL: ${BILLING_CHECKOUT_CANCEL_URL:-}
      RESEND_WEBHOOK_SECRET: ${RESEND_WEBHOOK_SECRET:-}
      EMAIL_RENDER_URL: ${EMAIL_RENDER_URL:-}
      EMAIL_RENDER_SECRET: ${EMAIL_RENDER_SECRET:-}
      NOTIFICATIONS_WEB_BASE_URL: https://gms.${BASE_DOMAIN}
      NOTIFICATIONS_EMAIL_ALLOWED_DOMAINS: ${NOTIFICATIONS_EMAIL_ALLOWED_DOMAINS?Render notification policy before deployment}
      CAP_SIGNING_CERT: ${CAP_SIGNING_CERT:-}
      CAP_SIGNING_KEY: ${CAP_SIGNING_KEY:-}
      CAP_SIGNING_KEY_REF: ${CAP_SIGNING_KEY_REF:-}
      PROJECT_NAME: ${PROJECT_NAME}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS}
      # Single sign-on (ADR-0017): each app's URL and the secret its server
      # presents to redeem codes. Events is optional; staff apps are required.
      # Shared with the web hosts that forward the visitor address (web-events,
      # web-gms, web-bookings),
      # so rate limits key on the visitor, not the web container (src/rate_limit.py).
      TRUSTED_WEB_SECRET: ${TRUSTED_WEB_SECRET:?TRUSTED_WEB_SECRET required}
      # Browser calls straight to api.*: proxies appending to X-Forwarded-For in
      # front of the API (1: Traefik; 2: Cloudflare then Traefik). Set by
      # render-env.py from CLOUDFLARE_PROXY_ENABLED.
      VISITOR_IP_PROXY_HOPS: ${VISITOR_IP_PROXY_HOPS:-1}
      EVENTS_APP_URL: https://events.${BASE_DOMAIN}
      EVENTS_SSO_CLIENT_SECRET: ${EVENTS_SSO_CLIENT_SECRET:-}
      GMSDASH_APP_URL: https://gmsdash.${BASE_DOMAIN}
      GMSDASH_SSO_CLIENT_SECRET: ${GMSDASH_SSO_CLIENT_SECRET:-}
      BOOKINGS_APP_URL: https://bookings.${BASE_DOMAIN}
      BOOKINGS_SSO_CLIENT_SECRET: ${BOOKINGS_SSO_CLIENT_SECRET:-}
      GAA_ADMIN_APP_URL: https://gms.${BASE_DOMAIN}
      GAA_ADMIN_SSO_CLIENT_SECRET: ${GAA_ADMIN_SSO_CLIENT_SECRET:?GAA_ADMIN_SSO_CLIENT_SECRET required}
      # Barrels staff console (apps/web/admin, registry key barrels-admin,
      # superusers only). Empty secret keeps its sign-in off.
      BARRELS_ADMIN_APP_URL: https://admin.${BASE_DOMAIN}
      BARRELS_ADMIN_SSO_CLIENT_SECRET: ${BARRELS_ADMIN_SSO_CLIENT_SECRET:-}
      CMS_APP_URL: https://cms.${BASE_DOMAIN}
      CMS_SSO_CLIENT_SECRET: ${CMS_SSO_CLIENT_SECRET:?CMS_SSO_CLIENT_SECRET required}
      # Public sites with "Sign in" (optional; empty keeps it off per site).
      WEATHER_APP_URL: https://weather.${BASE_DOMAIN}
      WEATHER_SSO_CLIENT_SECRET: ${WEATHER_SSO_CLIENT_SECRET:-}
      MBIA_APP_URL: https://mbia.${BASE_DOMAIN}
      MBIA_SSO_CLIENT_SECRET: ${MBIA_SSO_CLIENT_SECRET:-}
      SIGNAL_APP_URL: https://signal.${BASE_DOMAIN}
      SIGNAL_SSO_CLIENT_SECRET: ${SIGNAL_SSO_CLIENT_SECRET:-}
      DOCS_APP_URL: https://docs.${BASE_DOMAIN}
      DOCS_SSO_CLIENT_SECRET: ${DOCS_SSO_CLIENT_SECRET:-}
      # Elections is hosted on Vercel; its secret is set there and here.
      ELECTIONS_APP_URL: https://elections.${BASE_DOMAIN}
      ELECTIONS_SSO_CLIENT_SECRET: ${ELECTIONS_SSO_CLIENT_SECRET:-}
      RESEND_API_KEY: ${RESEND_API_KEY}
      # Optional integrations (2026-10-18); empty values fall back to defaults.
      MBIA_CONTACT_RECIPIENT: ${MBIA_CONTACT_RECIPIENT:-}
      BARRELS_CONTACT_RECIPIENT: ${BARRELS_CONTACT_RECIPIENT:-}
      GMS_DATA_REQUEST_RECIPIENT: ${GMS_DATA_REQUEST_RECIPIENT:-}
      TURNSTILE_ENABLED: ${TURNSTILE_ENABLED:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      EMAIL_HASH_PEPPER: ${EMAIL_HASH_PEPPER:-}
      EREGISTER_OBS_RECIPIENTS: ${EREGISTER_OBS_RECIPIENTS:-}
      EREGISTER_SEND_REQUIRE_ACCEPTED: ${EREGISTER_SEND_REQUIRE_ACCEPTED:-}
      WIS2BOX_S3_ENDPOINT_URL: ${WIS2BOX_S3_ENDPOINT_URL:-}
      WIS2BOX_S3_BUCKET: ${WIS2BOX_S3_BUCKET:-}
      WIS2BOX_TOPIC_HIERARCHY: ${WIS2BOX_TOPIC_HIERARCHY:-}
      FLIGHTS_OPENSKY_ENABLED: ${FLIGHTS_OPENSKY_ENABLED:-}
      WIS2BOX_S3_ACCESS_KEY_ID: ${WIS2BOX_S3_ACCESS_KEY_ID:-}
      WIS2BOX_S3_SECRET_ACCESS_KEY: ${WIS2BOX_S3_SECRET_ACCESS_KEY:-}
      OPENSKY_CLIENT_ID: ${OPENSKY_CLIENT_ID:-}
      OPENSKY_CLIENT_SECRET: ${OPENSKY_CLIENT_SECRET:-}
      COPERNICUSMARINE_SERVICE_USERNAME: ${COPERNICUSMARINE_SERVICE_USERNAME:-}
      COPERNICUSMARINE_SERVICE_PASSWORD: ${COPERNICUSMARINE_SERVICE_PASSWORD:-}
      CDSAPI_URL: ${CDSAPI_URL:-}
      CDSAPI_KEY: ${CDSAPI_KEY:-}
      WEBPUSH_VAPID_PUBLIC_KEY: ${WEBPUSH_VAPID_PUBLIC_KEY:-}
      WEBPUSH_VAPID_PRIVATE_KEY: ${WEBPUSH_VAPID_PRIVATE_KEY:-}
      WEBPUSH_CONTACT: ${WEBPUSH_CONTACT:-}
      PAYMENTS_STRIPE_SECRET_KEY: ${PAYMENTS_STRIPE_SECRET_KEY:-}
      PAYMENTS_STRIPE_WEBHOOK_SECRET: ${PAYMENTS_STRIPE_WEBHOOK_SECRET:-}
      PAYMENTS_STRIPE_SUCCESS_URL: ${PAYMENTS_STRIPE_SUCCESS_URL:-}
      PAYMENTS_STRIPE_CANCEL_URL: ${PAYMENTS_STRIPE_CANCEL_URL:-}
      SOCIAL_LINK_HOSTS: ${SOCIAL_LINK_HOSTS:-}
      SOCIAL_IMAGE_HOSTS: ${SOCIAL_IMAGE_HOSTS:-}
      CMS_DISTRIBUTION_SECRET: ${CMS_DISTRIBUTION_SECRET:-}
      PAYSLIP_HMAC_KEYS: ${PAYSLIP_HMAC_KEYS:-}
      SUBSCRIPTIONS_SITE_URLS: ${SUBSCRIPTIONS_SITE_URLS:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: https://auth.${BASE_DOMAIN}/google/callback
      AUTH_FRONTEND_URL: https://auth.${BASE_DOMAIN}
      EMAILS_FROM_EMAIL: ${EMAILS_FROM_EMAIL}
      FRONTEND_HOST: ${FRONTEND_HOST:-}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      TELEMETRY_ENABLED: ${TELEMETRY_ENABLED:-false}
      TELEMETRY_ENVIRONMENT: ${ENVIRONMENT}
      TELEMETRY_REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      STORAGE_ENDPOINT_URL: ${STORAGE_ENDPOINT_URL:-}
      STORAGE_REGION: ${STORAGE_REGION:-}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-}
      STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID:-}
      STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY:-}
      STORAGE_PUBLIC_BASE_URL: ${STORAGE_PUBLIC_BASE_URL:-}
    labels:
      - "traefik.enable=true"
      # ${*_EXTRA_HOSTS_RULE} vars are the weather.gd coexistence hook: unset (the
      # default) they add nothing; production.env sets them at DNS cutover to append
      # `|| Host(...)` aliases. Staging never sets them. See docs/weather-gd-golive.md.
      - "traefik.http.routers.grenmet-api${ROUTER_SUFFIX}.rule=Host(`api.${BASE_DOMAIN}`)${API_EXTRA_HOSTS_RULE:-}"
      - "traefik.http.routers.grenmet-api${ROUTER_SUFFIX}.entrypoints=websecure"
      - "traefik.http.routers.grenmet-api${ROUTER_SUFFIX}.middlewares=edge-api${ROUTER_SUFFIX}"
      - "traefik.http.routers.grenmet-api${ROUTER_SUFFIX}.tls.certresolver=letsencrypt"
      - "traefik.http.services.grenmet-api${ROUTER_SUFFIX}.loadbalancer.server.port=8000"
      - "traefik.http.services.grenmet-api${ROUTER_SUFFIX}.loadbalancer.healthcheck.path=/api/v1/utils/ready/"
    networks:
      - grenmet

  # ── Redis + Background worker (CAP outbox) ───────────────────────────────────
  redis:
    logging: *bounded-logging
    image: ${CORE_REDIS_IMAGE:?Set the reviewed immutable Redis 7 image}
    restart: always
    command: redis-server --appendonly yes --appendfsync everysec --save 60 1 --loglevel warning
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - grenmet

  worker:
    logging: *bounded-logging
    image: ${REGISTRY}/${IMAGE_NAME}:${TAG}
    restart: always
    depends_on:
      prestart:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    command: arq src.worker.main.WorkerSettings
    # The worker has no HTTP server; override the API image's inherited probe.
    # A release restarts every service at once on a shared host, and the staging
    # deploy of 956a8c24 failed because probes timed out for the first two minutes
    # while images were pulled; the worker itself ran fine. Match the NHC worker's
    # start window and give the probe more time so a busy host is not a failed deploy.
    healthcheck:
      test: ["CMD", "arq", "--check", "src.worker.main.WorkerSettings"]
      interval: 30s
      timeout: 30s
      retries: 3
      start_period: 180s
    environment:
      POSTGRES_SERVER: db
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${FASTAPI_DB_USER:?FASTAPI_DB_USER required}
      POSTGRES_PASSWORD: ${FASTAPI_DB_PASSWORD:?FASTAPI_DB_PASSWORD required}
      SECRET_KEY: ${SECRET_KEY}
      AUTH_PRIVILEGED_MFA_MODE: ${AUTH_PRIVILEGED_MFA_MODE:-disabled}
      AUTH_TOTP_ENCRYPTION_KEYS: ${AUTH_TOTP_ENCRYPTION_KEYS:-[]}
      ORG_SECRET_ENCRYPTION_KEYS: ${ORG_SECRET_ENCRYPTION_KEYS:-[]}
      FIRST_SUPERUSER: ${FIRST_SUPERUSER}
      FIRST_SUPERUSER_PASSWORD: ${FIRST_SUPERUSER_PASSWORD}
      ENVIRONMENT: ${ENVIRONMENT}
      SENTRY_DSN: ${SENTRY_DSN_WORKER:-}
      API_BASE_URL: https://api.${BASE_DOMAIN}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      TELEMETRY_WORKER_HEARTBEAT_URL: ${TELEMETRY_WORKER_HEARTBEAT_URL:-}
      CAP_SIGNING_CERT: ${CAP_SIGNING_CERT:-}
      CAP_SIGNING_KEY: ${CAP_SIGNING_KEY:-}
      CAP_SIGNING_KEY_REF: ${CAP_SIGNING_KEY_REF:-cap-signing-key}
      PROJECT_NAME: ${PROJECT_NAME}
      RESEND_API_KEY: ${RESEND_API_KEY}
      EMAIL_HASH_PEPPER: ${EMAIL_HASH_PEPPER:-}
      # Optional integrations (2026-10-18); empty values fall back to defaults.
      MBIA_CONTACT_RECIPIENT: ${MBIA_CONTACT_RECIPIENT:-}
      BARRELS_CONTACT_RECIPIENT: ${BARRELS_CONTACT_RECIPIENT:-}
      GMS_DATA_REQUEST_RECIPIENT: ${GMS_DATA_REQUEST_RECIPIENT:-}
      EREGISTER_OBS_RECIPIENTS: ${EREGISTER_OBS_RECIPIENTS:-}
      EREGISTER_SEND_REQUIRE_ACCEPTED: ${EREGISTER_SEND_REQUIRE_ACCEPTED:-}
      WIS2BOX_S3_ENDPOINT_URL: ${WIS2BOX_S3_ENDPOINT_URL:-}
      WIS2BOX_S3_BUCKET: ${WIS2BOX_S3_BUCKET:-}
      WIS2BOX_TOPIC_HIERARCHY: ${WIS2BOX_TOPIC_HIERARCHY:-}
      FLIGHTS_OPENSKY_ENABLED: ${FLIGHTS_OPENSKY_ENABLED:-}
      WIS2BOX_S3_ACCESS_KEY_ID: ${WIS2BOX_S3_ACCESS_KEY_ID:-}
      WIS2BOX_S3_SECRET_ACCESS_KEY: ${WIS2BOX_S3_SECRET_ACCESS_KEY:-}
      OPENSKY_CLIENT_ID: ${OPENSKY_CLIENT_ID:-}
      OPENSKY_CLIENT_SECRET: ${OPENSKY_CLIENT_SECRET:-}
      COPERNICUSMARINE_SERVICE_USERNAME: ${COPERNICUSMARINE_SERVICE_USERNAME:-}
      COPERNICUSMARINE_SERVICE_PASSWORD: ${COPERNICUSMARINE_SERVICE_PASSWORD:-}
      CDSAPI_URL: ${CDSAPI_URL:-}
      CDSAPI_KEY: ${CDSAPI_KEY:-}
      WEBPUSH_VAPID_PUBLIC_KEY: ${WEBPUSH_VAPID_PUBLIC_KEY:-}
      WEBPUSH_VAPID_PRIVATE_KEY: ${WEBPUSH_VAPID_PRIVATE_KEY:-}
      WEBPUSH_CONTACT: ${WEBPUSH_CONTACT:-}
      PAYMENTS_STRIPE_SECRET_KEY: ${PAYMENTS_STRIPE_SECRET_KEY:-}
      PAYMENTS_STRIPE_WEBHOOK_SECRET: ${PAYMENTS_STRIPE_WEBHOOK_SECRET:-}
      PAYMENTS_STRIPE_SUCCESS_URL: ${PAYMENTS_STRIPE_SUCCESS_URL:-}
      PAYMENTS_STRIPE_CANCEL_URL: ${PAYMENTS_STRIPE_CANCEL_URL:-}
      META_PAGE_ID: ${META_PAGE_ID:-}
      META_INSTAGRAM_ACCOUNT_ID: ${META_INSTAGRAM_ACCOUNT_ID:-}
      META_PAGE_ACCESS_TOKEN: ${META_PAGE_ACCESS_TOKEN:-}
      SUBSCRIPTIONS_SITE_URLS: ${SUBSCRIPTIONS_SITE_URLS:-}
      EMAILS_FROM_EMAIL: ${EMAILS_FROM_EMAIL}
      EMAIL_RENDER_URL: ${EMAIL_RENDER_URL:-}
      EMAIL_RENDER_SECRET: ${EMAIL_RENDER_SECRET:-}
      NOTIFICATIONS_WEB_BASE_URL: https://gms.${BASE_DOMAIN}
      NOTIFICATIONS_EMAIL_ALLOWED_DOMAINS: ${NOTIFICATIONS_EMAIL_ALLOWED_DOMAINS?Render notification policy before deployment}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      TELEMETRY_ENABLED: ${TELEMETRY_ENABLED:-false}
      TELEMETRY_ENVIRONMENT: ${ENVIRONMENT}
      TELEMETRY_REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      STORAGE_ENDPOINT_URL: ${STORAGE_ENDPOINT_URL:-}
      STORAGE_REGION: ${STORAGE_REGION:-}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-}
      STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID:-}
      STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY:-}
      STORAGE_PUBLIC_BASE_URL: ${STORAGE_PUBLIC_BASE_URL:-}
    networks:
      - grenmet

  nhc-worker:
    logging: *bounded-logging
    image: ${REGISTRY}/${IMAGE_NAME}:${TAG}
    restart: always
    depends_on:
      prestart:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    command: arq src.worker.nhc.NhcWorkerSettings
    # The worker has no HTTP server; override the API image's inherited probe.
    # Staging cold startup reached its first heartbeat after 167 seconds.
    healthcheck:
      test: ["CMD", "arq", "--check", "src.worker.nhc.NhcWorkerSettings"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 180s
    volumes:
      - nhc-archive:/app/nhc-archive
    environment:
      WXWATCH_NHC_ROOT: /app/nhc-archive
      WXWATCH_DATABASE_URL: ${WXWATCH_DB_URL:?WXWATCH_DB_URL required}
      POSTGRES_SERVER: db
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB}
