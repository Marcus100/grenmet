      - "traefik.http.routers.web-gmsdash${ROUTER_SUFFIX}.rule=Host(`gmsdash.${BASE_DOMAIN}`)"
      - "traefik.http.routers.web-gmsdash${ROUTER_SUFFIX}.entrypoints=websecure"
      - "${STAGING_WEB_MIDDLEWARES:+traefik.http.routers.web-gmsdash${ROUTER_SUFFIX}.middlewares=}${STAGING_WEB_MIDDLEWARES:-gd.barrels.staging-gate=off}"
      - "traefik.http.routers.web-gmsdash${ROUTER_SUFFIX}.tls.certresolver=letsencrypt"
      - "traefik.http.services.web-gmsdash${ROUTER_SUFFIX}.loadbalancer.server.port=3013"
    networks:
      - grenmet

  web-bookings:
    logging: *bounded-logging
    image: ghcr.io/${GHCR_OWNER}/barrelsgd-web-bookings:${WEB_TAG}
    restart: always
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3015/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    environment:
      AUTH_API_URL: http://api:8000
      AUTH_API_V1_STR: /api/v1
      AUTH_APP_URL: https://auth.${BASE_DOMAIN}
      # Optional: empty keeps sign-in off (single sign-on, ADR-0017).
      BOOKINGS_SSO_CLIENT_SECRET: ${BOOKINGS_SSO_CLIENT_SECRET:-}
      # Booking and code requests (src/lib/booking-api.ts).
      # Same value as the API: forwards each visitor's address (X-Visitor-IP).
      # Hops: proxies in front of this container that append to x-forwarded-for
      # (Traefik alone: 1; behind Cloudflare with trustedIPs: 2; render-env.py).
      TRUSTED_WEB_SECRET: ${TRUSTED_WEB_SECRET:?TRUSTED_WEB_SECRET required}
      VISITOR_IP_PROXY_HOPS: ${VISITOR_IP_PROXY_HOPS:-1}
      NEXT_PUBLIC_SENTRY_DSN: ${SENTRY_DSN_BOOKINGS:-}
      NEXT_PUBLIC_SENTRY_ENVIRONMENT: ${ENVIRONMENT}
    labels:
      - "traefik.enable=true"
      # Its own router (and so its own certificate): a missing bookings.* DNS
      # record cannot affect any other host.
      - "traefik.http.routers.web-bookings${ROUTER_SUFFIX}.rule=Host(`bookings.${BASE_DOMAIN}`)"
      - "traefik.http.routers.web-bookings${ROUTER_SUFFIX}.entrypoints=websecure"
      - "${STAGING_WEB_MIDDLEWARES:+traefik.http.routers.web-bookings${ROUTER_SUFFIX}.middlewares=}${STAGING_WEB_MIDDLEWARES:-gd.barrels.staging-gate=off}"
      - "traefik.http.routers.web-bookings${ROUTER_SUFFIX}.tls.certresolver=letsencrypt"
      - "traefik.http.services.web-bookings${ROUTER_SUFFIX}.loadbalancer.server.port=3015"
    networks:
      - grenmet


  # ── Database UI (staging only, via COMPOSE_PROFILES=staging) ─────────────────
  adminer:
    logging: *bounded-logging
    image: adminer:6.1.2@sha256:251295c1cd51d3889f1c42ffa4864b24eeab51f0caf395cfe5bf4726c5ec9a2a
    restart: always
    profiles: ["staging"]
    environment:
      ADMINER_DESIGN: pepa-linha-dark
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.adminer${ROUTER_SUFFIX}.rule=Host(`adminer.${BASE_DOMAIN}`)"
      - "traefik.http.routers.adminer${ROUTER_SUFFIX}.entrypoints=websecure"
      - "traefik.http.routers.adminer${ROUTER_SUFFIX}.tls.certresolver=letsencrypt"
      - "traefik.http.services.adminer${ROUTER_SUFFIX}.loadbalancer.server.port=8080"
      # Own credentials (not the dashboard's); render-env.py requires them on staging.
      # Upload-class body limit so SQL imports still fit; noindex like all staging.
      - "traefik.http.routers.adminer${ROUTER_SUFFIX}.middlewares=adminer-auth${ROUTER_SUFFIX},body-upload${ROUTER_SUFFIX},staging-noindex${ROUTER_SUFFIX}"
      - "traefik.http.middlewares.adminer-auth${ROUTER_SUFFIX}.basicauth.users=${ADMINER_BASIC_AUTH_USERS:-}"
      - "traefik.http.middlewares.adminer-auth${ROUTER_SUFFIX}.basicauth.removeheader=true"
    depends_on:
      - db
    networks:
      - grenmet

  # ── Docker API for Traefik (read-only, allow-listed) ─────────────────────────
  # The only service that mounts the Docker socket. HAProxy allows GET on the
  # container, event, version and ping endpoints; every other endpoint and every
  # POST/PUT/DELETE is denied (image defaults are deny, set explicitly here).
  traefik-socket-proxy:
    logging: *bounded-logging
    image: tecnativa/docker-socket-proxy:v0.5.0@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    restart: always
    environment:
      CONTAINERS: 1
      EVENTS: 1
      PING: 1
      VERSION: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:2375/_ping || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - docker-api

  # ── Reverse proxy ────────────────────────────────────────────────────────────
  proxy:
    logging: *bounded-logging
    image: traefik:v3.7@sha256:1336e85aaed293bd63d005086e0dd013b04078b26aaeb1c18b26a2f928af7e65
    restart: always
    depends_on:
      - traefik-socket-proxy
    ports:
      - "80:80"
      - "443:443"
      # Dashboard + ping, host loopback only. Reach it over SSH:
      #   ssh -L 8080:127.0.0.1:8080 <host>  →  http://localhost:8080/dashboard/
      - "127.0.0.1:8080:8080"
    volumes:
      - traefik-certificates:/certificates
    # Least privilege: only binding :80/:443 needs a capability. acme.json stays
    # writable on its volume; /tmp holds buffered request/response bodies.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    command:
      - --providers.docker
      - --providers.docker.endpoint=tcp://traefik-socket-proxy:2375
      - --providers.docker.exposedbydefault=false
      # Internal entrypoint for the dashboard and ping (published on 127.0.0.1
      # only). Stays on :8080 so `traefik healthcheck --ping` keeps working.
      - --entrypoints.traefik.address=:8080
      - --entrypoints.web.address=:80
      # Entrypoint-level HTTP→HTTPS redirect (idiomatic Traefik v3; replaces the
      # old http-catchall router labels).
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.web.http.redirections.entrypoint.permanent=true
      - --entrypoints.websecure.address=:443
      # Forwarded headers (X-Forwarded-For and friends): trusted from nobody
      # (Traefik's default, spelled out) unless CLOUDFLARE_PROXY_ENABLED, when
      # render-env.py sets `trustedIPs=<Cloudflare ranges>` from
      # infra/cloudflare/ip-ranges.txt. docs/operations/cloudflare-proxy.md.
      - --entrypoints.websecure.forwardedHeaders.${TRAEFIK_FORWARDED_HEADERS:-insecure=false}
      # Read 60s = Traefik's default (a 25 MiB HR upload at ~3.5 Mbit/s); write
      # 120s covers upload + synchronous PDF rendering + buffered response; idle
      # 180s = Traefik's default keep-alive.
      - --entrypoints.websecure.transport.respondingtimeouts.readtimeout=60s
      - --entrypoints.websecure.transport.respondingtimeouts.writetimeout=120s
      - --entrypoints.websecure.transport.respondingtimeouts.idletimeout=180s
      # Security headers, the per-client concurrency cap and removal of the
      # Cloudflare origin secret on every HTTPS request (middlewares defined in
      # labels below).
      - --entrypoints.websecure.http.middlewares=secure-headers${ROUTER_SUFFIX}@docker,inflight-per-ip${ROUTER_SUFFIX}@docker,strip-origin-secret${ROUTER_SUFFIX}@docker
      - --certificatesresolvers.letsencrypt.acme.email=${EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/certificates/acme.json
      # TLS-ALPN challenge by default. Behind Cloudflare's proxy Cloudflare ends
      # TLS, so render-env.py switches to the HTTP challenge on :80
      # (`httpchallenge.entrypoint=web`); it wins over the entrypoint redirect.
      - --certificatesresolvers.letsencrypt.acme.${TRAEFIK_ACME_CHALLENGE:-tlschallenge=true}
      # JSON to stdout; request headers and query strings (tokens, emails) dropped.
      - --accesslog
      - --accesslog.format=json
      - --accesslog.fields.headers.defaultmode=drop
      - --accesslog.fields.queryparameters.defaultmode=drop
      - --log
      - --api
      # Dashboard only through the router on the internal entrypoint below; never
      # --api.insecure.
      - --api.dashboard=true
      - --ping
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - "traefik.enable=true"
      # Dashboard: internal entrypoint only (no public host, no certificate). Basic
      # auth stays as a second factor behind the SSH tunnel.
      - "traefik.http.routers.traefik-dashboard${ROUTER_SUFFIX}.rule=PathPrefix(`/api`) || PathPrefix(`/dashboard`)"
      - "traefik.http.routers.traefik-dashboard${ROUTER_SUFFIX}.entrypoints=traefik"
      - "traefik.http.routers.traefik-dashboard${ROUTER_SUFFIX}.service=api@internal"
      - "traefik.http.routers.traefik-dashboard${ROUTER_SUFFIX}.middlewares=dashboard-auth${ROUTER_SUFFIX}"
      - "traefik.http.middlewares.dashboard-auth${ROUTER_SUFFIX}.basicauth.users=${USERNAME}:${HASHED_PASSWORD}"
      # Global security headers. HSTS starts at 30 days (raise once proven);
      # SAMEORIGIN (not DENY) so apps can iframe their own pages (print previews).
      # No app uses camera, microphone, geolocation, Payment Request or WebUSB.
      # COOP keeps OAuth/print popups working while isolating the opener.
      - "traefik.http.middlewares.secure-headers${ROUTER_SUFFIX}.headers.stsSeconds=2592000"
      - "traefik.http.middlewares.secure-headers${ROUTER_SUFFIX}.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.secure-headers${ROUTER_SUFFIX}.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.secure-headers${ROUTER_SUFFIX}.headers.customFrameOptionsValue=SAMEORIGIN"
      - "traefik.http.middlewares.secure-headers${ROUTER_SUFFIX}.headers.referrerPolicy=strict-origin-when-cross-origin"
      - "traefik.http.middlewares.secure-headers${ROUTER_SUFFIX}.headers.permissionsPolicy=camera=(), microphone=(), geolocation=(), payment=(), usb=()"
      - "traefik.http.middlewares.secure-headers${ROUTER_SUFFIX}.headers.customResponseHeaders.Cross-Origin-Opener-Policy=same-origin-allow-popups"
      # At most 100 concurrent requests per client IP. Depth 0 (DNS-only
      # Cloudflare): the remote address is the client. Depth 1 (Cloudflare
      # proxy, render-env.py): the right-most X-Forwarded-For entry, which
      # Cloudflare wrote, because the remote address is a Cloudflare edge.
      # Without ipStrategy Traefik would group by Host header instead.
      - "traefik.http.middlewares.inflight-per-ip${ROUTER_SUFFIX}.inflightreq.amount=100"
      - "traefik.http.middlewares.inflight-per-ip${ROUTER_SUFFIX}.inflightreq.sourceCriterion.ipStrategy.depth=${TRAEFIK_CLIENT_IP_DEPTH:-0}"
      # Origin gate (docs/operations/cloudflare-proxy.md). With
      # CLOUDFLARE_PROXY_ENABLED, render-env.py sets the rule: a connection from a
      # Cloudflare address WITHOUT the zone's secret X-Barrels-Origin header (added
      # by a Cloudflare Transform Rule) gets 403 before any other router, so
      # another Cloudflare customer's Worker cannot reach the apps or pick its own
      # X-Forwarded-For. Off, the rule matches nothing (no TCP client has the
      # broadcast address). The header is removed before any app sees it.
      - "traefik.http.routers.origin-gate${ROUTER_SUFFIX}.rule=${TRAEFIK_ORIGIN_GATE_RULE:-ClientIP(`255.255.255.255/32`)}"
      - "traefik.http.routers.origin-gate${ROUTER_SUFFIX}.entrypoints=websecure"
      - "traefik.http.routers.origin-gate${ROUTER_SUFFIX}.priority=1000000"
      - "traefik.http.routers.origin-gate${ROUTER_SUFFIX}.tls=true"
      - "traefik.http.routers.origin-gate${ROUTER_SUFFIX}.middlewares=origin-deny${ROUTER_SUFFIX}"
      - "traefik.http.routers.origin-gate${ROUTER_SUFFIX}.service=noop@internal"
      - "traefik.http.middlewares.origin-deny${ROUTER_SUFFIX}.ipallowlist.sourcerange=127.0.0.1/32"
      - "traefik.http.middlewares.strip-origin-secret${ROUTER_SUFFIX}.headers.customrequestheaders.X-Barrels-Origin="
      # Request body limit for the routers that accept uploads (API, CMS, Adminer;
      # 413 above it). Largest API upload: an HR document (25 MiB,
      # src/hr/documents/service.py); event images go straight to object storage
      # via presigned PUT; CMS = Payload media.
      # Traefik's buffering middleware also buffers responses (in memory up to
      # 1 MiB, then /tmp) and that cannot be disabled from labels, so the Next.js
      # web routers deliberately have NO buffering: it would kill streaming and
      # loading states. Next 16 already caps server-action bodies at 1 MB and no
      # web route accepts files.
      - "traefik.http.middlewares.body-upload${ROUTER_SUFFIX}.buffering.maxRequestBodyBytes=31457280"
      # Upload-class chains. STAGING_*_MIDDLEWARES are set in staging.env only, so
      # production chains hold just the body limit. Web routers reference
      # STAGING_WEB_MIDDLEWARES directly; in production that label is replaced by
      # the inert `gd.barrels.staging-gate=off`, so they carry no middlewares.
      - "traefik.http.middlewares.edge-api${ROUTER_SUFFIX}.chain.middlewares=body-upload${ROUTER_SUFFIX}${STAGING_API_MIDDLEWARES:+,}${STAGING_API_MIDDLEWARES:-}"
      - "traefik.http.middlewares.edge-cms${ROUTER_SUFFIX}.chain.middlewares=body-upload${ROUTER_SUFFIX}${STAGING_WEB_MIDDLEWARES:+,}${STAGING_WEB_MIDDLEWARES:-}"
      # Staging protection (referenced only through STAGING_*_MIDDLEWARES; unused
      # and unbuilt in production). Web hosts: basic auth + noindex. The API gets
      # noindex only: browser apps call it cross-origin.
      - "traefik.http.middlewares.staging-auth${ROUTER_SUFFIX}.basicauth.users=${STAGING_BASIC_AUTH_USERS:-}"
      - "traefik.http.middlewares.staging-auth${ROUTER_SUFFIX}.basicauth.realm=GrenMet staging"
      - "traefik.http.middlewares.staging-auth${ROUTER_SUFFIX}.basicauth.removeheader=true"
      - "traefik.http.middlewares.staging-noindex${ROUTER_SUFFIX}.headers.customResponseHeaders.X-Robots-Tag=noindex, nofollow"
    networks:
      - grenmet
      - docker-api

networks:
  # Not name-pinned: compose validates the com.docker.compose.network label, so
  # adopting a network created under a different key is impossible. Networks are
  # wiring, not data — compose creates <project>_grenmet and moves services onto
  # it in one `up`. (Prod's existing network already used the key `grenmet`, so
  # nothing changes there; staging's old *_grenmet-staging network is orphaned
  # after the first deploy and can be pruned.)
  grenmet:
    driver: bridge
    # Pinned so uvicorn (--forwarded-allow-ips in apps/api/fastapi/Dockerfile.prod)
    # can trust X-Forwarded-* from this subnet only. Keep the two in sync;
    # scripts/production/forwarded-allow-ips.test.mjs enforces it. The last
    # /16 of Docker's default 172.x pool range is the least likely to collide.
    ipam:
      config:
        - subnet: 172.31.250.0/24
  # Docker API only: traefik-socket-proxy and proxy. No routing, no egress.
  docker-api:
    driver: bridge
    internal: true

volumes:
  nhc-archive:
  # Persistent CMS uploads; distinct for each Compose project/environment.
  cms-media:
  # DATA-CRITICAL: external + name pins the exact existing volumes on each
  # droplet, bypassing compose's created-by-me label check — and if a volume is
  # missing (fresh droplet), the deploy FAILS instead of silently starting an
  # empty database. Bootstrap for a new droplet:
  #   docker volume create <value of PGDATA_VOLUME/CERTS_VOLUME/REDIS_VOLUME>
  pgdata:
    external: true
    name: ${PGDATA_VOLUME}
  traefik-certificates:
    external: true
    name: ${CERTS_VOLUME}
  redis-data:
    external: true
    name: ${REDIS_VOLUME}
