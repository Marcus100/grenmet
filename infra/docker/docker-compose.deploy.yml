  # ── Web Apps ─────────────────────────────────────────────────────────────────
  web-auth:
    logging: *bounded-logging
    image: ghcr.io/${GHCR_OWNER}/barrelsgd-web-auth:${WEB_TAG}
    restart: always
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    environment:
      NEXT_PUBLIC_SENTRY_DSN: ${SENTRY_DSN_AUTH:-}
      NEXT_PUBLIC_SENTRY_ENVIRONMENT: ${ENVIRONMENT}
      EMAIL_RENDER_SECRET: ${EMAIL_RENDER_SECRET:-}
      AUTH_APP_URL: https://auth.${BASE_DOMAIN}
      AUTH_API_URL: http://api:8000
      ADMIN_APP_URL: https://gms.${BASE_DOMAIN}
      BARRELS_ADMIN_APP_URL: https://admin.${BASE_DOMAIN}
      DOCS_APP_URL: https://docs.${BASE_DOMAIN}
      GMS_APP_URL: https://weather.${BASE_DOMAIN}
      SIGNAL_APP_URL: https://signal.${BASE_DOMAIN}
      MBIA_APP_URL: https://mbia.${BASE_DOMAIN}
      EVENTS_APP_URL: https://events.${BASE_DOMAIN}
      AUTH_API_V1_STR: /api/v1
      # Sign-in returns only to exact origins (ADR-0043 decision 5); a leading-dot
      # entry such as ".${BASE_DOMAIN}" is ignored. The *_APP_URL values above are
      # honoured as they are; every other app that signs in here is named, so a user
      # lands back in it instead of on this app's home page. Each one must match its
      # entry in the api service. scripts/production/auth-return-origins.test.mjs
      # checks the two lists agree. EXTRA_RETURN_HOSTS, if set, must start with a comma.
      AUTH_ALLOWED_RETURN_HOSTS: https://admin.${BASE_DOMAIN},https://bookings.${BASE_DOMAIN},https://cms.${BASE_DOMAIN},https://elections.${BASE_DOMAIN},https://gmsdash.${BASE_DOMAIN}${EXTRA_RETURN_HOSTS:-}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.web-auth${ROUTER_SUFFIX}.rule=Host(`auth.${BASE_DOMAIN}`)"
      - "traefik.http.routers.web-auth${ROUTER_SUFFIX}.entrypoints=websecure"
      - "${STAGING_WEB_MIDDLEWARES:+traefik.http.routers.web-auth${ROUTER_SUFFIX}.middlewares=}${STAGING_WEB_MIDDLEWARES:-gd.barrels.staging-gate=off}"
      - "traefik.http.routers.web-auth${ROUTER_SUFFIX}.tls.certresolver=letsencrypt"
      - "traefik.http.services.web-auth${ROUTER_SUFFIX}.loadbalancer.server.port=3000"
    networks:
      - grenmet

  # Router and service labels use new names (web-barrels-admin, web-gms-portal)
  # that no earlier container defines, so the first rolling deploy never has two
  # containers defining one router differently (the old web-admin was gaa-admin).
  # Barrels staff / superuser control plane (apps/web/admin, ADR-0039) at
  # admin.${BASE_DOMAIN}. Calls FastAPI only; no database credentials.
