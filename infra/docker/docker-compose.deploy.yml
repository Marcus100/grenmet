    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.web-barrels-admin${ROUTER_SUFFIX}.rule=Host(`admin.${BASE_DOMAIN}`)"
      - "traefik.http.routers.web-barrels-admin${ROUTER_SUFFIX}.entrypoints=websecure"
      - "${STAGING_WEB_MIDDLEWARES:+traefik.http.routers.web-barrels-admin${ROUTER_SUFFIX}.middlewares=}${STAGING_WEB_MIDDLEWARES:-gd.barrels.staging-gate=off}"
      - "traefik.http.routers.web-barrels-admin${ROUTER_SUFFIX}.tls.certresolver=letsencrypt"
      - "traefik.http.services.web-barrels-admin${ROUTER_SUFFIX}.loadbalancer.server.port=3012"
      - "traefik.http.services.web-barrels-admin${ROUTER_SUFFIX}.loadbalancer.healthcheck.path=/api/health"
    networks:
      - grenmet

  # GMS/GAA staff portal (apps/web/gaa-admin) for the Met office, served at
  # gms.${BASE_DOMAIN} (hostname only: apps/web/gms is the public weather site).
  web-gmsadmin:
    logging: *bounded-logging
    image: ghcr.io/${GHCR_OWNER}/barrelsgd-web-gaa-admin:${WEB_TAG}
    restart: always
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      # The readiness check queries FastAPI and both weather-product
      # services. Give migrations and API startup time to complete before probing.
      start_period: 120s
    environment:
      NEXT_PUBLIC_SENTRY_DSN: ${SENTRY_DSN_GAA_ADMIN:-}
      NEXT_PUBLIC_SENTRY_ENVIRONMENT: ${ENVIRONMENT}
      AUTH_APP_URL: https://auth.${BASE_DOMAIN}
      # Server-side readiness and API calls use the internal FastAPI service.
      AUTH_API_URL: http://api:8000
      AUTH_API_V1_STR: /api/v1
      GAA_ADMIN_SSO_CLIENT_SECRET: ${GAA_ADMIN_SSO_CLIENT_SECRET:?GAA_ADMIN_SSO_CLIENT_SECRET required}
      RESEND_API_KEY: ${RESEND_API_KEY}
      # Browser calls still use the public API hostname.
      NEXT_PUBLIC_API_URL: https://api.${BASE_DOMAIN}
      # Consolidated apps' dedicated Postgres databases.
      ENVIRONMENT: ${ENVIRONMENT}
      WXPRODUCTS_DB_NAME: ${WXPRODUCTS_DB_NAME}
      CAP_API_URL: http://api:8000
    labels:
      - "traefik.enable=true"
      # Hostname gms.* is the Met office portal; the public weather site is the
      # separate web-gms service at weather.*.
      - "traefik.http.routers.web-gms-portal${ROUTER_SUFFIX}.rule=Host(`gms.${BASE_DOMAIN}`)"
      - "traefik.http.routers.web-gms-portal${ROUTER_SUFFIX}.entrypoints=websecure"
      - "${STAGING_WEB_MIDDLEWARES:+traefik.http.routers.web-gms-portal${ROUTER_SUFFIX}.middlewares=}${STAGING_WEB_MIDDLEWARES:-gd.barrels.staging-gate=off}"
      - "traefik.http.routers.web-gms-portal${ROUTER_SUFFIX}.tls.certresolver=letsencrypt"
      - "traefik.http.routers.web-gms-portal${ROUTER_SUFFIX}.service=web-gms-portal${ROUTER_SUFFIX}"
      - "traefik.http.services.web-gms-portal${ROUTER_SUFFIX}.loadbalancer.server.port=3001"
      - "traefik.http.services.web-gms-portal${ROUTER_SUFFIX}.loadbalancer.healthcheck.path=/api/ready"
    networks:
