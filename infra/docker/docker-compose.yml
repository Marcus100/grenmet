# Grenmet Monorepo - Shared Infrastructure
# From repo root:
#   pnpm start   - Start infra (tools profile) + FastAPI
#   pnpm stop    - Stop FastAPI and infra
#   pnpm status  - Show container status
#   pnpm reset   - Tear down infra with volumes, then start Postgres only
services:
  postgres:
    image: postgis/postgis:17-3.5@sha256:01a6a70e41e6c4467c8f55f6063555ed72db2d6662cd0d571040d42eadaeb6f6
    container_name: grenmet-postgres
    restart: "no"
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../postgres/init-databases.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
      - ../postgres/init-cms.sh:/docker-entrypoint-initdb.d/02-cms.sh:ro
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changethis}
      CMS_DB_NAME: ${CMS_DB_NAME:-gms_cms}
      CMS_DB_USER: ${CMS_DB_USER:-gms_cms}
      CMS_DB_PASSWORD: ${CMS_DB_PASSWORD:-changethis}
      APP_DB_NAME: ${APP_DB_NAME:-}
      APP_DB_USER: ${APP_DB_USER:-}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-}
      WXWATCH_DB_NAME: ${WXWATCH_DB_NAME:-wxwatch}
      WXWATCH_DB_USER: ${WXWATCH_DB_USER:-wxwatch}
      WXWATCH_DB_PASSWORD: ${WXWATCH_DB_PASSWORD:-changethis}
      WXPRODUCTS_DB_NAME: ${WXPRODUCTS_DB_NAME:-wxproducts}
      WXPRODUCTS_DB_USER: ${WXPRODUCTS_DB_USER:-wxproducts}
      WXPRODUCTS_DB_PASSWORD: ${WXPRODUCTS_DB_PASSWORD:-changethis}
      JANITORIAL_DB_NAME: ${JANITORIAL_DB_NAME:-janitorial}
      JANITORIAL_DB_USER: ${JANITORIAL_DB_USER:-janitorial}
      JANITORIAL_DB_PASSWORD: ${JANITORIAL_DB_PASSWORD:-changethis}
      TRANSPORT_DB_NAME: ${TRANSPORT_DB_NAME:-transport}
      TRANSPORT_DB_USER: ${TRANSPORT_DB_USER:-transport}
      TRANSPORT_DB_PASSWORD: ${TRANSPORT_DB_PASSWORD:-changethis}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-app}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    networks:
      - grenmet

  adminer:
    image: adminer:6.0.1@sha256:f742dcf1b6ca95733b54c4e020488ce78f3e774d73543a6ded9b4eaea8974f3d
    container_name: grenmet-adminer
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      ADMINER_DESIGN: ${ADMINER_DESIGN:-pepa-linha-dark}
    profiles: [tools]
    networks:
      - grenmet

  mailcatcher:
    image: axllent/mailpit:v1.30.5@sha256:b868afa176bfd6cce2323ea316cd99ccad77915e51e595748f6d786700ecf109
    container_name: grenmet-mailcatcher
    restart: "no"
    ports:
      - "1080:8025"
      - "1025:1025"
    profiles: [tools]
    networks:
      - grenmet

networks:
  grenmet:
    name: grenmet
    driver: bridge

volumes:
  pgdata:
