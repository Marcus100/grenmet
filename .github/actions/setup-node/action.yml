name: Setup Node.js with pnpm
description: Install pnpm, set up Node.js with cache, and install dependencies

inputs:
  node-version:
    description: Node.js version to use
    default: "24"
  strict-peer-dependencies:
    description: Fail if peer dependency conflicts are detected
    default: "false"
  turbo-cache:
    description: Restore and save Turborepo's local task cache (.turbo/cache)
    default: "true"
  turbo-remote-cache:
    description: >-
      Log in to Vercel Remote Cache with a short-lived OIDC token (ADR-0052).
      Only on trusted events (never pull_request); the calling job must grant
      id-token: write. Never fails the job: without a token Turborepo uses the
      local cache.
    default: "false"

runs:
  using: composite
  steps:
    # Corepack comes with Node 24. Bootstrap pnpm before enabling setup-node's
    # pnpm cache, which needs the executable to determine the store location.
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: ${{ inputs.node-version }}
    - name: Bootstrap pinned pnpm with bounded retries
      shell: bash
      run: bash "${{ github.action_path }}/bootstrap-pnpm.sh"
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm

    - run: pnpm install --frozen-lockfile ${{ inputs.strict-peer-dependencies == 'true' && '--strict-peer-dependencies' || '' }}
      shell: bash

    # Per-job key so type-check and test caches don't evict each other; the SHA suffix
    # makes every run save a fresh entry while restore-keys picks up the latest one.
    - if: inputs.turbo-cache == 'true'
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: .turbo/cache
        key: turbo-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
        restore-keys: turbo-${{ runner.os }}-${{ github.job }}-

    # Trusted events only: a Vercel policy per branch (dev, staging) decides who
    # may exchange a GitHub OIDC token for a cache-only access token, so a
    # pull-request run cannot obtain one even if its workflow asks.
    - if: inputs.turbo-remote-cache == 'true' && github.event_name != 'pull_request' && vars.TURBO_TEAM != ''
      continue-on-error: true
      uses: vercel/setup-turborepo-remote-cache-action@49d7b1b46ba4c9251e1977986bfe18336feabc8f # v1.1.0
      with:
        team: ${{ vars.TURBO_TEAM }}
