name: Secret Scan

# gitleaks over only the commits a change adds: a pull request's base..head, or a
# dev push's before..after (dev takes direct pushes, so PR-only scanning would miss
# most commits). Existing history is not rescanned. The binary is a GitHub release
# download verified against a pinned SHA-256; bump GITLEAKS_VERSION and
# GITLEAKS_SHA256 together from the release's checksums file.
on:
  pull_request:
    branches: [main, staging, dev]
  push:
    branches: [dev]

concurrency:
  group: secret-scan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  gitleaks:
    name: Gitleaks (new commits)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.3.1
        with:
          fetch-depth: 0
          # Full history for the range, but no historic blobs (the repo carries
          # ~2 GB of old images); blobs in the scanned range are fetched lazily.
          filter: blob:none

      - name: Install gitleaks (checksum verified)
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/gitleaks" gitleaks
          "$RUNNER_TEMP/gitleaks/gitleaks" version

      - name: Resolve commit range
        id: range
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            range="${PR_BASE}..${PR_HEAD}"
          elif [ -n "$PUSH_BEFORE" ] && ! [[ "$PUSH_BEFORE" =~ ^0+$ ]] \
            && git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
            range="${PUSH_BEFORE}..${PUSH_AFTER}"
          else
            # New branch or rewritten history: scan the pushed head commit only.
            range="${PUSH_AFTER}~1..${PUSH_AFTER}"
          fi
          echo "Scanning $range"
          echo "range=$range" >> "$GITHUB_OUTPUT"

      - name: Scan new commits
        env:
          RANGE: ${{ steps.range.outputs.range }}
        run: |
          "$RUNNER_TEMP/gitleaks/gitleaks" git \
            --no-banner --redact --verbose \
            --config .gitleaks.toml \
            --log-opts="$RANGE" \
            .
