name: Database Backup
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backup:
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        environment: [staging, production]
    runs-on: [self-hosted, "${{ matrix.environment }}", core]
    timeout-minutes: 45
    concurrency:
      group: core-${{ matrix.environment }}
      cancel-in-progress: false
    environment: ${{ matrix.environment }}
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.DO_SPACES_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.DO_SPACES_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.DO_SPACES_REGION }}
      AWS_EC2_METADATA_DISABLED: "true"
      DO_SPACES_BUCKET: ${{ secrets.DO_SPACES_BUCKET }}
      DO_SPACES_ENDPOINT: ${{ secrets.DO_SPACES_ENDPOINT }}
      STORAGE_ACCESS_KEY_ID: ${{ secrets.STORAGE_ACCESS_KEY_ID }}
      STORAGE_SECRET_ACCESS_KEY: ${{ secrets.STORAGE_SECRET_ACCESS_KEY }}
      STORAGE_BUCKET: ${{ secrets.STORAGE_BUCKET }}
      STORAGE_ENDPOINT_URL: ${{ secrets.STORAGE_ENDPOINT_URL }}
      DEPLOY_ENV: ${{ matrix.environment }}
      COMPOSE_PROJECT: ${{ matrix.environment == 'production' && 'grenmet' || 'grenmet-staging' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          clean: false
      - name: Back up all authoritative core databases off-host
        run: bash scripts/production/core.sh backup
