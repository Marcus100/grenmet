name: API Client Generation

on:
  pull_request:
    branches: [ main, staging, dev ]
  # No staging push trigger: pipeline-staging calls this workflow on staging
  # pushes (Phase 3c cutover), so a standalone run would be a duplicate.
  push:
    branches:
      - dev
  workflow_call:

# Hardcoded per-file prefix: inside a workflow_call child, github.workflow is the
# CALLER's name, so a ${{ github.workflow }} group makes sibling children cancel
# each other. PR runs dedupe per PR; dev pushes and deployment children stay unique.
concurrency:
  # Pull requests cancel their superseded runs. A dev push never cancels an earlier
  # dev run: api-client is a required check that promotion reads on earlier dev
  # commits (#1227), so each dev push gets its own group.
  group: ci-api-client-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A promotion PR (into staging or main) whose tree passed every required check
  # on dev reuses that result (#1239). Anything else, including a failure here,
  # runs the full job below.
  promotion:
    name: Reuse dev checks
    if: github.event_name == 'pull_request' && github.base_ref != 'dev'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      checks: read
    outputs:
      verified: ${{ steps.verify.outputs.verified }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.3.1
        with:
          fetch-depth: 0
          filter: blob:none
      - id: verify
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/promotion-verified.mjs

  api-client:
    needs: [promotion]
    # Skipped (reported as passed) only on a verified promotion PR.
    if: ${{ !cancelled() && needs.promotion.outputs.verified != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.3.1

      - name: Setup Node.js with pnpm
        uses: ./.github/actions/setup-node
        with:
          turbo-cache: "false"

      - name: Test API drift and breaking-change checkers
        run: node --test scripts/api/check-api-drift.test.mjs scripts/api/check-api-breaking.test.mjs

      - name: Ensure generated client is committed
        run: pnpm check:drift

      - name: Type-check API client package
        run: pnpm --filter @barrelsgd/api-client run type-check

      - name: Build API client package
        run: pnpm --filter @barrelsgd/api-client run build

      - name: Type-check admin consumer
        run: pnpm --filter @barrelsgd/web-gaa-admin run type-check
