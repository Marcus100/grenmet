name: API Client Generation

on:
  pull_request:
    branches: [ main, staging, dev ]
  # No staging push trigger: pipeline-staging calls this workflow on staging
  # pushes (Phase 3c cutover), so a standalone run would be a duplicate.
  push:
    branches:
      - main
      - dev
  workflow_call:

# Hardcoded per-file prefix: inside a workflow_call child, github.workflow is the
# CALLER's name, so a ${{ github.workflow }} group makes sibling children cancel
# each other. PR runs dedupe per PR, dev pushes per branch; deployment children stay unique.
concurrency:
  group: ci-api-client-${{ github.event.pull_request.number || (github.ref == 'refs/heads/dev' && github.ref) || github.run_id }}
  cancel-in-progress: true

jobs:
  api-client:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.3.1

      - name: Setup Node.js with pnpm
        uses: ./.github/actions/setup-node
        with:
          turbo-cache: "false"

      - name: Test API drift and breaking-change checkers
        run: node --test scripts/api/check-api-drift.test.mjs scripts/api/check-api-breaking.test.mjs

      - name: Ensure generated client is committed
        run: pnpm check:drift

      - name: Type-check API client package
        run: pnpm --filter @barrelsgd/api-client run type-check

      - name: Build API client package
        run: pnpm --filter @barrelsgd/api-client run build

      - name: Type-check admin consumer
        run: pnpm --filter @barrelsgd/web-gaa-admin run type-check
