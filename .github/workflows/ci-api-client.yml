name: API Client Generation

on:
  pull_request:
    branches: [ main, staging, dev ]
  # No staging push trigger: pipeline-staging calls this workflow on staging
  # pushes (Phase 3c cutover), so a standalone run would be a duplicate.
  push:
    branches:
      - main
      - dev
  workflow_call:

# Hardcoded per-file prefix: inside a workflow_call child, github.workflow is the
# CALLER's name, so a ${{ github.workflow }} group makes sibling children cancel
# each other. PR runs dedupe per PR; push/called runs are unique per run.
concurrency:
  group: ci-api-client-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  api-client:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.3.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate API client
        run: pnpm generate:api-client

      - name: Ensure generated client is committed
        run: git diff --exit-code -- packages/api-client/src/gen

      - name: Type-check API client package
        run: pnpm --filter @barrelsgd/api-client run type-check

      - name: Build API client package
        run: pnpm --filter @barrelsgd/api-client run build

      - name: Type-check admin consumer
        run: pnpm --filter @barrelsgd/web-admin run type-check
