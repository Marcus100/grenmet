name: Deploy to Production

# Compatibility entry point; all deployments use the canonical Compose layout.
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag built by the release pipeline"
        type: string
        required: true

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      image_tag: ${{ inputs.image_tag }}
    secrets: inherit
