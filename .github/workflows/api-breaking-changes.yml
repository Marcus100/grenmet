# API breaking-change gate
# Compares the PR's apps/api/fastapi/openapi.json with its merge base and fails
# on changes that break existing clients. Label the PR `breaking-change` to
# accept them (every consumer must then be updated in the same PR).
# Two checks run: the hand-written check-api-breaking.mjs, then oasdiff's full
# rule set (enum, required/optional, parameter location, security, bounds),
# tuned by scripts/api/oasdiff.yaml. The label lets both pass; findings still print.
# Not path-filtered on purpose: the script exits fast when the spec is unchanged,
# and a path-skipped check cannot be marked required without deadlocking PRs.

name: API breaking changes

on:
  pull_request:
    branches:
      - dev
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: api-breaking-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Whether this change can touch the API contract (docs/operations/release-runbook.md, pull-request check selection).
  # Narrows only pull requests into dev; every other event selects everything
  # (scripts/ci/select-checks.mjs). It never fails the run: an error there
  # selects every check, and the job below also runs when this one did not succeed.
  changes:
    name: Select checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      apiContract: ${{ steps.select.outputs.apiContract }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.3.1
        with:
          fetch-depth: 0
          filter: blob:none
      - id: select
        env:
          # off | shadow | on; unset means shadow (docs/operations/release-runbook.md).
          CI_PATH_SELECTION: ${{ vars.CI_PATH_SELECTION }}
        run: node scripts/ci/select-checks.mjs

  breaking:
    name: API breaking changes
    needs: [changes]
    # Fail open: also runs when the selection job did not succeed.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.apiContract == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.3.1
        with:
          fetch-depth: 0
          filter: blob:none
      - name: Check openapi.json against the base branch
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ALLOW_BREAKING: ${{ contains(github.event.pull_request.labels.*.name, 'breaking-change') }}
        run: |
          flags=()
          if [ "$ALLOW_BREAKING" = "true" ]; then flags+=(--allow-breaking); fi
          # The script compares with the merge base of the base branch and the PR head.
          node scripts/api/check-api-breaking.mjs --base "origin/${BASE_REF}" --head "$HEAD_SHA" "${flags[@]}"
      # The merge base is what the PR changes; the branch tip would report
      # operations other PRs added after this branch was cut as removed.
      - name: Write the merge base openapi.json for oasdiff
        if: ${{ !cancelled() }}
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          base="$(git merge-base "origin/${BASE_REF}" "$HEAD_SHA" || echo "origin/${BASE_REF}")"
          git show "${base}:apps/api/fastapi/openapi.json" > .oasdiff-base-openapi.json
      # Docker action: paths are relative to the workspace. review/github-token
      # are off so no spec is uploaded to oasdiff.com and no PR comment is posted.
      - name: Check openapi.json with oasdiff
        if: ${{ !cancelled() }}
        continue-on-error: ${{ contains(github.event.pull_request.labels.*.name, 'breaking-change') }}
        uses: oasdiff/oasdiff-action/breaking@0546e2ebdc9d3589d594cfcef445c61ca02cabf1 # v0.2.0
        env:
          OASDIFF_CONFIG: scripts/api/oasdiff.yaml
        with:
          base: .oasdiff-base-openapi.json
          revision: apps/api/fastapi/openapi.json
          fail-on: ERR
          review: "false"
          github-token: ""
