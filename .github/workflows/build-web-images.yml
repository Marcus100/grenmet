name: Build Web App Images

# Phase 3c/3d cutover: no standalone triggers except manual dispatch. Staging
# builds run as workflow_call children of pipeline-staging; release builds as
# children of pipeline-prod (which passes the release tag).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (staging or latest)"
        required: true
        type: choice
        options:
          - staging
          - latest
  # Callable from pipeline workflows (Phase 3 restructure). When called, the
  # caller's event context drives tag resolution; `tag` overrides it explicitly.
  workflow_call:
    inputs:
      tag:
        description: "Image tag override (staging or latest)"
        required: false
        type: string

jobs:
  image-selection:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.select.outputs.web }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - id: select
        env:
          IMAGE_BUILD_MODE: full
        run: node scripts/ci/select-images.mjs

  build:
    needs: image-selection
    environment: ${{ (inputs.tag == 'staging' || (inputs.tag == '' && github.ref_name == 'staging')) && github.event_name != 'release' && 'staging' || 'production' }}
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-latest
    # push = called from pipeline-staging on a staging push (caller's event).
    if: |
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'release'
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.image-selection.outputs.web) }}

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.3.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve environment context
        id: ctx
        env:
          BUILD_TAG: ${{ inputs.tag }}
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          EVENT="$GITHUB_EVENT_NAME"
          # inputs.tag covers both workflow_dispatch and workflow_call callers.
          if [ -n "$BUILD_TAG" ]; then
            BRANCH="$BUILD_TAG"
          elif [ "$EVENT" == "workflow_run" ]; then
            BRANCH="$GITHUB_REF_NAME"
          else
            BRANCH="$GITHUB_REF_NAME"
          fi

          if [ "$BRANCH" == "staging" ] && [ "$EVENT" != "release" ]; then
            echo "environment=staging" >> $GITHUB_OUTPUT
            echo "api_url=https://api.staging.barrels.gd" >> $GITHUB_OUTPUT
            echo "sentry_project=grenmet-staging" >> $GITHUB_OUTPUT
          else
            echo "environment=production" >> $GITHUB_OUTPUT
            echo "api_url=https://api.barrels.gd" >> $GITHUB_OUTPUT
            echo "sentry_project=grenmet-production" >> $GITHUB_OUTPUT
          fi

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ghcr.io/${{ steps.ctx.outputs.owner }}/barrelsgd-${{ matrix.image }}
          labels: |
            gd.barrels.environment=${{ steps.ctx.outputs.environment }}
          tags: |
            type=raw,value=${{ steps.ctx.outputs.environment }}-sha-${{ github.sha }}
            type=raw,value=staging,enable=${{ steps.ctx.outputs.environment == 'staging' }}
            type=raw,value=latest,enable=${{ steps.ctx.outputs.environment == 'production' }}
            type=raw,value=${{ github.event.release.tag_name }},enable=${{ github.event_name == 'release' }}

      - name: Build image for verification
        id: verify
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: ${{ matrix.path }}/Dockerfile
          target: ${{ matrix.target || 'runner' }}
          push: false
          load: true
          build-args: |
            NEXT_PUBLIC_SITE_URL=https://${{ matrix.app }}.${{ steps.ctx.outputs.environment == 'staging' && 'staging.barrels.gd' || 'barrels.gd' }}
            NEXT_PUBLIC_API_URL=${{ steps.ctx.outputs.api_url }}
            NEXT_PUBLIC_ENVIRONMENT=${{ steps.ctx.outputs.environment }}
            NEXT_PUBLIC_SENTRY_DSN=${{ steps.ctx.outputs.environment == 'staging' && secrets.SENTRY_DSN_STAGING || steps.ctx.outputs.environment == 'production' && secrets.SENTRY_DSN_PRODUCTION || '' }}
            NEXT_PUBLIC_SENTRY_ENVIRONMENT=${{ steps.ctx.outputs.environment }}
            SENTRY_PROJECT=${{ steps.ctx.outputs.sentry_project }}
            NEXT_PUBLIC_GA_MEASUREMENT_ID=${{ matrix.image == 'web-gms' && vars.NEXT_PUBLIC_GA_MEASUREMENT_ID || '' }}
            NEXT_PUBLIC_POSTHOG_KEY=${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
            NEXT_PUBLIC_POSTHOG_HOST=${{ secrets.NEXT_PUBLIC_POSTHOG_HOST || vars.NEXT_PUBLIC_POSTHOG_HOST || 'https://us.i.posthog.com' }}
          secrets: |
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=node-${{ matrix.path }}-${{ matrix.target || 'runner' }}
          platforms: linux/amd64

      - name: Smoke-test image before publishing
        env:
          IMAGE: ghcr.io/${{ steps.ctx.outputs.owner }}/barrelsgd-${{ matrix.image }}:${{ steps.ctx.outputs.environment }}-sha-${{ github.sha }}
          KIND: ${{ matrix.image == 'web-cms-migrate' && 'cms-migrate' || matrix.image == 'web-gaa-admin-migrate' && 'admin-migrate' || matrix.image == 'web-auth' && 'auth' || 'web' }}
          PORT: ${{ matrix.port }}
          HEALTH: ${{ matrix.image == 'api-hono' && '/health' || '/api/health' }}
        run: |
          bash scripts/production/smoke-image.sh "$IMAGE" "$KIND" "$PORT" "$HEALTH"

      - name: Enforce image vulnerability policy before publishing
        uses: ./.github/actions/scan-image
        with:
          image: ghcr.io/${{ steps.ctx.outputs.owner }}/barrelsgd-${{ matrix.image }}:${{ steps.ctx.outputs.environment }}-sha-${{ github.sha }}
          scope: ${{ matrix.path }}/Dockerfile#${{ matrix.target || 'runner' }}
          name: ${{ matrix.image }}

      - name: Publish verified image from builder cache
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: ${{ matrix.path }}/Dockerfile
          target: ${{ matrix.target || 'runner' }}
          push: true
          build-args: |
            NEXT_PUBLIC_SITE_URL=https://${{ matrix.app }}.${{ steps.ctx.outputs.environment == 'staging' && 'staging.barrels.gd' || 'barrels.gd' }}
            NEXT_PUBLIC_API_URL=${{ steps.ctx.outputs.api_url }}
            NEXT_PUBLIC_ENVIRONMENT=${{ steps.ctx.outputs.environment }}
            NEXT_PUBLIC_SENTRY_DSN=${{ steps.ctx.outputs.environment == 'staging' && secrets.SENTRY_DSN_STAGING || steps.ctx.outputs.environment == 'production' && secrets.SENTRY_DSN_PRODUCTION || '' }}
            NEXT_PUBLIC_SENTRY_ENVIRONMENT=${{ steps.ctx.outputs.environment }}
            SENTRY_PROJECT=${{ steps.ctx.outputs.sentry_project }}
            NEXT_PUBLIC_GA_MEASUREMENT_ID=${{ matrix.image == 'web-gms' && vars.NEXT_PUBLIC_GA_MEASUREMENT_ID || '' }}
            NEXT_PUBLIC_POSTHOG_KEY=${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
            NEXT_PUBLIC_POSTHOG_HOST=${{ secrets.NEXT_PUBLIC_POSTHOG_HOST || vars.NEXT_PUBLIC_POSTHOG_HOST || 'https://us.i.posthog.com' }}
          secrets: |
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=node-${{ matrix.path }}-${{ matrix.target || 'runner' }}
          cache-to: type=gha,scope=node-${{ matrix.path }}-${{ matrix.target || 'runner' }},mode=max,ignore-error=true
          platforms: linux/amd64


      - name: Upload Trivy results to GitHub Security tab
        if: always() && hashFiles('trivy-results.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@9e0d7b8d25671d64c341c19c0152d693099fb5ba # v4.35.5
        with:
          sarif_file: trivy-results.sarif
          category: trivy-${{ matrix.image }}

      - name: Summary
        run: echo "Built and pushed ${{ steps.meta.outputs.tags }}"
