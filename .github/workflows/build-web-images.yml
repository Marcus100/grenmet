name: Build Web App Images

# Build once (issue #1019): called only by dev-images.yml. Images are built for a
# dev commit, tagged by git tree, and promoted to staging and production by
# digest (scripts/ci/promote-images.mjs); nothing here is environment-specific.
on:
  workflow_call:
    inputs:
      ref:
        description: "Commit to build (default: the caller's commit)"
        required: false
        default: ""
        type: string
      images:
        description: "JSON list of web images to build (default: every release image)"
        required: false
        default: ""
        type: string

jobs:
  image-selection:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.select.outputs.web }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - id: select
        env:
          IMAGE_BUILD_MODE: full
          IMAGES: ${{ inputs.images }}
        run: |
          if [[ -n "$IMAGES" ]]; then
            printf 'web=%s\n' "$IMAGES" >> "$GITHUB_OUTPUT"
          else
            node scripts/ci/select-images.mjs
          fi

  build:
    needs: image-selection
    # Dev builds use the `build` environment: production's build-time Sentry
    # values without production's approval gate (issue #1019).
    environment: build
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.image-selection.outputs.web) }}

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.3.1
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Log in to Docker Hub for base images
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve build context
        id: ctx
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
          echo "local_tag=dev-sha-$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          # One image for every environment: production's build-time values;
          # source maps go to both Sentry projects.
          echo "environment=production" >> "$GITHUB_OUTPUT"
          echo "sentry_project=grenmet-staging,grenmet-production" >> "$GITHUB_OUTPUT"

      - name: Resolve app-specific telemetry
        id: telemetry
        env:
          APP_PATH: ${{ matrix.path }}
          TELEMETRY_ENVIRONMENT: ${{ steps.ctx.outputs.environment }}
          SENTRY_DSN_STAGING: ${{ secrets.SENTRY_DSN_STAGING }}
          SENTRY_DSN_PRODUCTION: ${{ secrets.SENTRY_DSN_PRODUCTION }}
        run: node scripts/integrations/build-config.mjs "${APP_PATH##*/}" "$TELEMETRY_ENVIRONMENT"

      # A dev image is promoted to production, so an empty DSN would ship
      # without browser error reporting everywhere. Apps the catalogue does not
      # route to Sentry (empty project, such as admin) are skipped on purpose.
      - name: Require the build-time Sentry DSN
        env:
          DSN: ${{ steps.telemetry.outputs.sentry_dsn }}
          PROJECT: ${{ steps.telemetry.outputs.sentry_project }}
        run: |
          [[ -z "$PROJECT" || -n "$DSN" ]] || { echo "::error::No Sentry DSN for ${{ matrix.image }} (project $PROJECT). Add SENTRY_DSN_PRODUCTION (and SENTRY_AUTH_TOKEN, SENTRY_DSN_STAGING) as secrets of the 'build' GitHub environment."; exit 1; }

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ghcr.io/${{ steps.ctx.outputs.owner }}/barrelsgd-${{ matrix.image }}
          # No environment label: staging and production promote the same digest.
          # The revision label is set explicitly because the metadata action
          # would otherwise use the dispatching ref's commit.
          labels: |
            org.opencontainers.image.revision=${{ steps.ctx.outputs.sha }}
            gd.barrels.tree=${{ steps.ctx.outputs.tree }}
            gd.barrels.build-once=true
          tags: |
            type=raw,value=${{ steps.ctx.outputs.local_tag }}
            type=raw,value=tree-${{ steps.ctx.outputs.tree }}
            type=raw,value=dev

      - name: Build image for verification
        id: verify
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.path }}/Dockerfile
          target: ${{ matrix.target || 'runner' }}
          push: false
          load: true
          # The apps read their public settings at run time (issue #1019,
          # packages/ui/src/lib/public-env.ts). These seed only build-time
          # output: pages prerendered at build, the next.config CSP report
          # endpoint and source-map upload.
          build-args: |
            NEXT_PUBLIC_SITE_URL=https://${{ matrix.host || matrix.app }}.barrels.gd
            NEXT_PUBLIC_SENTRY_DSN=${{ steps.telemetry.outputs.sentry_dsn }}
            NEXT_PUBLIC_SENTRY_ENVIRONMENT=${{ steps.ctx.outputs.environment }}
            SENTRY_PROJECT=${{ steps.telemetry.outputs.sentry_project && steps.ctx.outputs.sentry_project || '' }}
            NEXT_PUBLIC_RELEASE=${{ steps.ctx.outputs.sha }}
          secrets: |
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/${{ steps.ctx.outputs.owner }}/barrelsgd-buildcache:${{ matrix.image }}
          # Exported here, not on the publish step: a build that then fails the
          # smoke test or vulnerability gate still leaves its layers cached, so
          # the retry is warm. Registry-backed because the Actions cache is
          # branch-scoped (dev never warms staging) and capped at 10GB.
          cache-to: type=registry,ref=ghcr.io/${{ steps.ctx.outputs.owner }}/barrelsgd-buildcache:${{ matrix.image }},mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true
          platforms: linux/amd64

      - name: Smoke-test image before publishing
        env:
          IMAGE: ghcr.io/${{ steps.ctx.outputs.owner }}/barrelsgd-${{ matrix.image }}:${{ steps.ctx.outputs.local_tag }}
          KIND: ${{ matrix.image == 'web-cms-migrate' && 'cms-migrate' || matrix.image == 'web-auth' && 'auth' || 'web' }}
          PORT: ${{ matrix.port }}
          HEALTH: /api/health
        run: |
          bash scripts/production/smoke-image.sh "$IMAGE" "$KIND" "$PORT" "$HEALTH"

      - name: Enforce image vulnerability policy before publishing
        uses: ./.github/actions/scan-image
        with:
          image: ghcr.io/${{ steps.ctx.outputs.owner }}/barrelsgd-${{ matrix.image }}:${{ steps.ctx.outputs.local_tag }}
          scope: ${{ matrix.path }}/Dockerfile#${{ matrix.target || 'runner' }}
          name: ${{ matrix.image }}

      - name: Publish verified image from builder cache
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.path }}/Dockerfile
          target: ${{ matrix.target || 'runner' }}
          push: true
          # The apps read their public settings at run time (issue #1019,
          # packages/ui/src/lib/public-env.ts). These seed only build-time
          # output: pages prerendered at build, the next.config CSP report
          # endpoint and source-map upload.
          build-args: |
            NEXT_PUBLIC_SITE_URL=https://${{ matrix.host || matrix.app }}.barrels.gd
            NEXT_PUBLIC_SENTRY_DSN=${{ steps.telemetry.outputs.sentry_dsn }}
            NEXT_PUBLIC_SENTRY_ENVIRONMENT=${{ steps.ctx.outputs.environment }}
            SENTRY_PROJECT=${{ steps.telemetry.outputs.sentry_project && steps.ctx.outputs.sentry_project || '' }}
            NEXT_PUBLIC_RELEASE=${{ steps.ctx.outputs.sha }}
          secrets: |
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/${{ steps.ctx.outputs.owner }}/barrelsgd-buildcache:${{ matrix.image }}
          # Build provenance and an SPDX SBOM are attached as attestation manifests
          # in the pushed image index. Build args are recorded in max-mode provenance;
          # they are NEXT_PUBLIC_* values already shipped to browsers, and real
          # secrets go through `secrets:`, which provenance never records.
          provenance: mode=max
          sbom: true
          platforms: linux/amd64


      - name: Upload Trivy results to GitHub Security tab
        if: always() && hashFiles('trivy-results.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy-results.sarif
          category: trivy-${{ matrix.image }}

      - name: Summary
        run: echo "Built and pushed ${{ steps.meta.outputs.tags }}"
