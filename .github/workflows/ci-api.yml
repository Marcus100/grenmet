# Continuous Integration Workflow
# Runs on every push and pull request to ensure code quality

name: CI

on:
  # No paths filter anywhere. Flow is dev → (PR) → staging → (PR) → main. Both
  # promotion PRs are integration gates, so a partial (path-filtered) run would
  # let backend contract/format drift through, and a required check that gets
  # path-skipped deadlocks the PR. Running the full suite on every push and PR
  # to a long-lived branch keeps the gates honest and safe to mark "required".
  # No staging push trigger: pipeline-staging calls this workflow on staging
  # pushes (Phase 3c cutover), so a standalone run would be a duplicate.
  push:
    branches:
      - main
      - dev
  workflow_call:
    inputs:
      deployment-builds:
        description: Deployment pipeline builds and smoke-tests its published images
        type: boolean
        default: false
  pull_request:
    branches:
      - main
      - staging
      - dev

# Cancel in-progress runs when a new workflow on the same PR is triggered
# Hardcoded per-file prefix: inside a workflow_call child, github.workflow is the
# CALLER's name, so a ${{ github.workflow }} group makes sibling children cancel
# each other. PR runs dedupe per PR, dev pushes per branch; deployment children stay unique.
concurrency:
  group: ci-api-${{ github.event.pull_request.number || (github.ref == 'refs/heads/dev' && github.ref) || github.run_id }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.14.7"
  UV_CACHE_DIR: ~/.cache/uv

jobs:
  image-selection:
    name: Select image checks
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.select.outputs.web }}
      weather: ${{ steps.select.outputs.weather }}
      api: ${{ steps.select.outputs.api }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          # Full history for diffs, but no historic blobs (the repo carries ~2 GB of old images).
          filter: blob:none
      - name: Select affected images (full set when comparison is unavailable)
        id: select
        env:
          IMAGE_BUILD_MODE: ${{ inputs.deployment-builds && 'deployment' || ((github.event_name == 'push' && github.ref == 'refs/heads/dev' || github.event_name == 'pull_request' && github.base_ref == 'dev') && 'affected' || 'full') }}
        run: node scripts/ci/select-images.mjs

  # Job 1: Code Quality Checks
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/api/fastapi

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.3.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-local-path: ~/.cache/uv

      - name: Verify workspace lockfile is current
        run: uv lock --check

      - name: Install dependencies
        # --frozen installs exactly what's in the lockfile after the explicit
        # freshness check above. Include the worker's existing collector package,
        # and preserve the combined environment during the following checks.
        run: uv sync --frozen --package fast-back --package gms-ingest

      - name: Run Ruff (Linter)
        run: uv run --no-sync --package fast-back ruff check src scripts

      - name: Run Ruff (Formatter Check)
        run: uv run --no-sync --package fast-back ruff format src scripts --check

      - name: Run mypy (Type Checker)
        run: uv run --no-sync --package fast-back mypy src

  # Job 2: Security Checks
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.3.1

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "apps/api/fastapi"
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1

        if: always()
        with:
          sarif_file: "trivy-results.sarif"

  # Job 3: Tests, sharded across parallel jobs. Three file-aligned slices of the
  # suite (tests/sharding.py) and the Schemathesis fuzz suite (-m fuzz, deselected
  # by default in pyproject) each run on their own runner with their own Postgres
  # service. Every test still runs on every push; only the wall time shrinks.
  # Each entry writes a coverage data file; `coverage` below combines them.
  test-shard:
    name: API Tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: shard-1, name: "shard 1/3", pytest: "-m 'not fuzz' --shard 1/3" }
          - { id: shard-2, name: "shard 2/3", pytest: "-m 'not fuzz' --shard 2/3" }
          - { id: shard-3, name: "shard 3/3", pytest: "-m 'not fuzz' --shard 3/3" }
          - { id: fuzz, name: "fuzz", pytest: "-m fuzz" }
    env:
      POSTGRES_SERVER: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: app
      POSTGRES_PASSWORD: changethis
      POSTGRES_DB: app
      FIRST_SUPERUSER: admin@example.com
      FIRST_SUPERUSER_PASSWORD: changethis
      SECRET_KEY: test-secret-key-min-32-characters-long
      ENVIRONMENT: local
      PROJECT_NAME: FastAPI Backend (Test)
      EMAILS_FROM_EMAIL: test@example.com
      SMTP_HOST: smtp.example.invalid
      COVERAGE_DATA_ONLY: "1"
      COVERAGE_FILE: reports/coverage-${{ matrix.id }}.data
    defaults:
      run:
        working-directory: apps/api/fastapi

    services:
      postgres:
        image: postgres:17
        credentials:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: changethis
          POSTGRES_DB: app
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.3.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-local-path: ~/.cache/uv

      - name: Install PDF system libraries
        # WeasyPrint (forecast PDFs) needs Pango/HarfBuzz/fontconfig; mirrors the API images.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b libfontconfig1

      - name: Install dependencies
        # Lockfile freshness is enforced by the lint job; --frozen keeps this
        # job on that exact resolution.
        run: uv sync --frozen --package fast-back

      - name: Test database isolation contract
        if: matrix.id == 'shard-1'
        run: uv run --frozen --package fast-back python -m unittest tests.test_database_target

      - name: Run migrations
        # Migration smoke checks are independent of the sharded pytest slices, so
        # one job runs them rather than all four.
        if: matrix.id == 'shard-1'
        run: uv run --frozen --package fast-back alembic upgrade head

      - name: Verify CMS media migration rollback
        if: matrix.id == 'shard-1'
        env:
          CMS_MIGRATION_TEST_DSN: postgresql://app:changethis@localhost:5432/app
        run: uv run --frozen --package fast-back python -m unittest discover -s ../../../scripts/production -p test_cms_migrations.py

      - name: Run tests with coverage
        # pytest-cov rather than `coverage run -m pytest`: it is xdist-aware and
        # combines the per-worker data files. The shared script uses --dist load
        # to distribute tests across two workers by default. Each worker
        # gets its own database — see the bootstrap in tests/conftest.py.
        # COVERAGE_DATA_ONLY defers reports to the combining job.
        run: bash ../../../scripts/verification/backend.sh ${{ matrix.pytest }}

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-test-results-${{ matrix.id }}
          path: apps/api/fastapi/reports/pytest.xml

      - name: Upload coverage data
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: api-coverage-data-${{ matrix.id }}
          path: apps/api/fastapi/reports/coverage-${{ matrix.id }}.data
          retention-days: 1

  # Combines the shards' coverage data into one report and enforces the floor,
  # which therefore measures the same whole-suite coverage as the unsharded job did.
  coverage:
    name: API Coverage Floor
    needs: [test-shard]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/api/fastapi

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.3.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-local-path: ~/.cache/uv

      - name: Install dependencies
        run: uv sync --frozen --package fast-back

      - name: Download coverage data
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: api-coverage-data-*
          path: apps/api/fastapi/reports/shards
          merge-multiple: true

      - name: Combine coverage and build reports
        # Every shard ran src from the same checkout path, so the data combines
        # without path remapping. The HTML report keeps per-test contexts.
        run: |
          set -euo pipefail
          test "$(ls reports/shards/*.data | wc -l)" -eq 4
          export COVERAGE_FILE=reports/coverage.combined
          uv run --frozen --package fast-back coverage combine reports/shards/*.data
          uv run --frozen --package fast-back coverage report --skip-covered
          uv run --frozen --package fast-back coverage xml -o coverage.xml
          uv run --frozen --package fast-back coverage html

      - name: Check API coverage floor
        # Floors only rise (scripts/guardrails/coverage-baseline.json); this fails
        # when line or branch coverage drops below the committed floor.
        run: node ../../../scripts/guardrails/check-coverage.mjs --only api

      - name: Upload coverage HTML
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-html
          path: apps/api/fastapi/htmlcov/
          retention-days: 30

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: apps/api/fastapi/coverage.xml
          fail_ci_if_error: false

  # Stable required gate. The check name "Run Tests" and the job id `test` are
  # kept so branch protection and ci-success keep resolving after the split.
  test:
    name: Run Tests
    needs: [test-shard, coverage]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every shard, the fuzz suite and the coverage floor
        run: |
          echo "Test shards (incl. fuzz): ${{ needs.test-shard.result }}"
          echo "Coverage floor: ${{ needs.coverage.result }}"
          if [ "${{ needs.test-shard.result }}" != "success" ] ||
             [ "${{ needs.coverage.result }}" != "success" ]; then
            echo "ERROR A test shard, the fuzz suite or the coverage floor did not pass"
            exit 1
          fi

  collectors:
    name: Operational Collector Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          enable-cache: true
          cache-local-path: ~/.cache/uv
      - name: Run collector fixture suites
        # Frozen eccodeslib, pyproj and netcdf4 wheels supply decoder libraries.
        # No geonetcast/GDAL installation or external service credentials needed.
        run: bash scripts/verification/collectors.sh

  # Job 4: Docker Build Test
  docker:
    needs: [image-selection]
    if: needs.image-selection.outputs.api == 'true'
    name: Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # packages: read only — see the matching note in ci-web.yml: this job builds
    # untrusted pull-request code and must not be able to write the shared cache.
    permissions:
      contents: read
      packages: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.3.1

      - name: Log in to Docker Hub for base images
        # Fork and Dependabot PRs cannot access repository Actions secrets.
        if: github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Resolve registry owner
        id: ctx
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - name: Log in to GitHub Container Registry (build cache is read-only here)
        # Best-effort: without credentials the build simply runs cache-cold
        # rather than failing the check.
        continue-on-error: true
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image (test)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0

        with:
          context: .
          file: apps/api/fastapi/Dockerfile.prod
          push: false
          tags: test-image:latest
          cache-from: type=registry,ref=ghcr.io/${{ steps.ctx.outputs.owner }}/barrelsgd-buildcache:api
          outputs: type=docker,dest=/tmp/test-image.tar

      - name: Load Docker image for scanning
        run: |
          echo "Loading Docker image for vulnerability scanning..."
          docker load -i /tmp/test-image.tar
          echo "SUCCESS Image loaded successfully"

      - name: Smoke test production imports
        run: bash scripts/production/smoke-image.sh test-image:latest api

      - name: Enforce image vulnerability policy
        uses: ./.github/actions/scan-image
        with:
          image: test-image:latest
          scope: apps/api/fastapi/Dockerfile.prod#runtime
          name: api

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1

        if: always()
        with:
          sarif_file: "trivy-results.sarif"

      - name: Validate Docker image
        run: |
          echo "Validating Docker image functionality..."
          # Test that the image can be created and basic commands work
          echo "INFO Testing image creation..."
          CONTAINER_ID=$(docker create test-image:latest)
          echo "SUCCESS Container created successfully: $CONTAINER_ID"

          # Test basic image properties
          echo "INFO Image information:"
          docker inspect test-image:latest --format='{{.Config.WorkingDir}}' || true
          docker inspect test-image:latest --format='{{.Config.ExposedPorts}}' || true

          # Clean up
          docker rm $CONTAINER_ID
          docker rmi test-image:latest
          echo "SUCCESS Docker image validation completed"

  # Job 5: API Documentation Check
  # Note: no database service needed — app.openapi() reads route definitions only
  docs:
    name: API Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      POSTGRES_SERVER: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: app
      POSTGRES_PASSWORD: changethis
      POSTGRES_DB: app
      FIRST_SUPERUSER: admin@example.com
      FIRST_SUPERUSER_PASSWORD: changethis
      SECRET_KEY: test-secret-key-min-32-characters-long
      ENVIRONMENT: local
      PROJECT_NAME: FastAPI Backend (Test)
      EMAILS_FROM_EMAIL: test@example.com
      SMTP_HOST: smtp.example.invalid
    defaults:
      run:
        working-directory: apps/api/fastapi

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.3.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-local-path: ~/.cache/uv

      - name: Install dependencies
        # Lockfile freshness is enforced by the lint job; --frozen keeps this
        # job on that exact resolution.
        run: uv sync --frozen --package fast-back

      - name: Generate OpenAPI schema
        env:
          POSTGRES_SERVER: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: app
          POSTGRES_USER: app
          POSTGRES_PASSWORD: changethis
          SECRET_KEY: test-secret-key-min-32-characters-long
          FIRST_SUPERUSER: admin@example.com
          FIRST_SUPERUSER_PASSWORD: changethis
          # info.title comes from PROJECT_NAME; the committed openapi.json is
          # generated with the real project name, so pin it here or the drift
          # diff below would always trip on the title alone (not a real change).
          PROJECT_NAME: "Barrels Grenada"
        run: |
          uv run --frozen --package fast-back python -c "
          from src.main import app
          import json
          with open('openapi.json', 'w') as f:
              json.dump(app.openapi(), f, indent=2)
          "

      - name: Fail if committed openapi.json is stale
        # The TS api-client is generated from the committed openapi.json. If routes
        # change but openapi.json isn't regenerated, the client gate passes while the
        # contract is stale. Diff the freshly-generated schema against the committed
        # one to close that gap: routes → openapi.json → generated client all gated.
        run: git diff --exit-code -- openapi.json

      - name: Upload OpenAPI schema
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openapi-schema
          path: apps/api/fastapi/openapi.json
          retention-days: 30

  # Final status check
  ci-success:
    name: CI Success
    needs: [image-selection, quality, security, test, collectors, docker, docs]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    if: always()

    steps:
      - name: Check all jobs
        run: |
          echo "Checking Checking CI job results..."
          echo "Quality: ${{ needs.quality.result }}"
          echo "Security: ${{ needs.security.result }}"
          echo "Tests: ${{ needs.test.result }}"
          echo "Collectors: ${{ needs.collectors.result }}"
          echo "Docker: ${{ needs.docker.result }}"
          echo "Docs: ${{ needs.docs.result }}"

          if [ "${{ needs.image-selection.result }}" != "success" ] ||
             [ "${{ needs.quality.result }}" != "success" ] || \
             [ "${{ needs.security.result }}" != "success" ] || \
             [ "${{ needs.test.result }}" != "success" ] || \
             [ "${{ needs.collectors.result }}" != "success" ] || \
             { [ "${{ needs.docker.result }}" != "success" ] &&
               ! { [ "${{ needs.docker.result }}" = "skipped" ] && [ "${{ needs.image-selection.outputs.api }}" = "false" ]; }; } || \
             [ "${{ needs.docs.result }}" != "success" ]; then
            echo "ERROR One or more CI jobs failed"
            echo "🚫 CI pipeline failed - deployment blocked"
            exit 1
          fi
          echo "SUCCESS All CI checks passed!"
          echo "🚀 Ready for deployment"
