name: Legacy deploy wrapper (staging)
on:
  workflow_call:
    inputs:
      image_tag:
        required: true
        type: string
permissions:
  contents: read
  packages: read
jobs:
  deploy:
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      image_tag: ${{ inputs.image_tag }}
    secrets: inherit
