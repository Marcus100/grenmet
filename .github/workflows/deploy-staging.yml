name: Deploy to Staging

# Compatibility entry point; all deployments use the canonical Compose layout.
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag built by the release pipeline"
        type: string
        required: false
        default: staging
  workflow_call:
    inputs:
      image_tag:
        type: string
        required: false
        default: staging

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      image_tag: ${{ inputs.image_tag }}
    secrets: inherit
