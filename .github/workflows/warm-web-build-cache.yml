name: Warm Web Build Cache

# Keeps the shared registry build cache fresh for pull-request container smoke
# builds. Pull-request builds in ci-web.yml only READ the cache (they build
# untrusted code and must never write it). This workflow is the trusted writer:
# it runs only on pushes to dev, after review and merge, and builds with the same
# default build arguments the smoke builds use so their layers match.
#
# It is a standalone workflow, not a job in ci-web.yml, because ci-web.yml is also
# called by the staging and production pipelines with read-only package
# permissions; a write job there would make those callers invalid. Staging and
# release builds warm the same cache from build-web-images.yml.
on:
  push:
    branches: [dev]

concurrency:
  group: warm-web-build-cache
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  image-selection:
    name: Select images to warm
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.select.outputs.web }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.3.1
        with:
          fetch-depth: 0
          filter: blob:none
      - id: select
        env:
          IMAGE_BUILD_MODE: affected
        run: node scripts/ci/select-images.mjs

  warm:
    needs: image-selection
    if: needs.image-selection.outputs.web != '[]'
    name: Warm cache (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # packages: write is the only elevated permission and exists solely to
    # export build cache layers of already-merged code.
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.image-selection.outputs.web) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.3.1
      - name: Log in to Docker Hub for base images
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Resolve registry owner
        id: ctx
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and export cache only
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.path }}/Dockerfile
          target: ${{ matrix.target || 'runner' }}
          outputs: type=cacheonly
          cache-from: type=registry,ref=ghcr.io/${{ steps.ctx.outputs.owner }}/barrelsgd-buildcache:${{ matrix.image }}
          cache-to: type=registry,ref=ghcr.io/${{ steps.ctx.outputs.owner }}/barrelsgd-buildcache:${{ matrix.image }},mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true
