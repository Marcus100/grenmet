name: Production Pipeline

# Phase 3d: publishing a vN.M release builds ALL images at that tag and then
# deploys production — one `needs:` chain, no GHCR manifest-polling (the old
# deploy-prod race guard), no workflow_run indirection. Release events execute
# the workflow file from the TAGGED commit, so this behaves like the staging
# pipeline: what you tagged is what runs.
#
# Re-deploying an EXISTING release (rollback or retry) does not need builds:
# use the "Deploy" workflow's manual dispatch with environment=production and
# the release tag instead.

on:
  release:
    types: [published]

concurrency:
  group: prod-pipeline
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci-api:
    uses: ./.github/workflows/ci-api.yml
    with:
      deployment-builds: true
    secrets: inherit
    permissions:
      contents: read
      security-events: write
  ci-web:
    uses: ./.github/workflows/ci-web.yml
    with:
      deployment-builds: true
    secrets: inherit
  api-client:
    uses: ./.github/workflows/ci-api-client.yml
    secrets: inherit

  build-api:
    name: Build API image
    uses: ./.github/workflows/build-api-image.yml
    with:
      tag: ${{ github.event.release.tag_name }}
    secrets: inherit
    permissions:
      contents: read
      packages: write
      security-events: write

  build-web:
    name: Build web images
    uses: ./.github/workflows/build-web-images.yml
    with:
      tag: ${{ github.event.release.tag_name }}
    secrets: inherit
    permissions:
      contents: read
      packages: write
      security-events: write

  build-weather:
    if: ${{ vars.WEATHER_PRODUCTION_ENABLED == 'true' }}
    uses: ./.github/workflows/build-weather-images.yml
    permissions:
      contents: read
      packages: write

  deploy:
    name: Deploy
    # Checks and smoke-tested artifacts must all succeed before deployment.
    needs: [ci-api, ci-web, api-client, build-api, build-web]
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      image_tag: sha-${{ github.sha }}
    secrets: inherit
    permissions:
      contents: read
      packages: read

  deploy-weather:
    needs: [build-weather, deploy]
    if: ${{ vars.WEATHER_PRODUCTION_ENABLED == 'true' }}
    uses: ./.github/workflows/deploy-weather.yml
    with:
      environment: production
    secrets: inherit
    permissions:
      contents: read
      packages: read

  weather-configuration-status:
    runs-on: ubuntu-latest
    steps:
      - name: Report integration state
        env:
          ENABLED: ${{ vars.WEATHER_PRODUCTION_ENABLED }}
        run: |
          if [[ "$ENABLED" != true ]]; then
            echo "Weather integration UNCONFIGURED: provision and validate its dedicated host before enabling delivery." >> "$GITHUB_STEP_SUMMARY"
          fi
