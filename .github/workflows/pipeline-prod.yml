name: Production Pipeline

# Phase 3d: publishing a vN.M release builds ALL images at that tag and then
# deploys production — one `needs:` chain, no GHCR manifest-polling (the old
# deploy-prod race guard), no workflow_run indirection. Release events execute
# the workflow file from the TAGGED commit, so this behaves like the staging
# pipeline: what you tagged is what runs.
#
# Re-deploying an EXISTING release (rollback or retry) does not need builds:
# use the "Deploy" workflow's manual dispatch with environment=production and
# the release tag instead.

on:
  release:
    types: [published]

concurrency:
  group: prod-pipeline
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-scope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Validate and report release scope
        env:
          WEATHER_STAGING_ENABLED: ${{ vars.WEATHER_STAGING_ENABLED }}
          WEATHER_PRODUCTION_ENABLED: ${{ vars.WEATHER_PRODUCTION_ENABLED }}
        run: node scripts/ci/check-release-scope.mjs

  ci-api:
    uses: ./.github/workflows/ci-api.yml
    with:
      deployment-builds: true
    secrets: inherit
    permissions:
      packages: read
      contents: read
      security-events: write
  ci-web:
    uses: ./.github/workflows/ci-web.yml
    with:
      deployment-builds: true
    secrets: inherit
    permissions:
      contents: read
      packages: read

  api-client:
    uses: ./.github/workflows/ci-api-client.yml
    secrets: inherit

  build-api:
    name: Build API image
    uses: ./.github/workflows/build-api-image.yml
    with:
      tag: ${{ github.event.release.tag_name }}
    secrets: inherit
    permissions:
      contents: read
      packages: write
      security-events: write

  build-web:
    name: Build web images
    uses: ./.github/workflows/build-web-images.yml
    with:
      tag: ${{ github.event.release.tag_name }}
    secrets: inherit
    permissions:
      contents: read
      packages: write
      security-events: write

  deploy:
    name: Deploy
    # Checks and smoke-tested artifacts must all succeed before deployment.
    needs: [release-scope, ci-api, ci-web, api-client, build-api, build-web]
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      image_tag: sha-${{ github.sha }}
    secrets: inherit
    permissions:
      contents: read
      packages: read
