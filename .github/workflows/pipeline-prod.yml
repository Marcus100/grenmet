name: Production Pipeline

# Build once, promote by digest (issue #1019). Publishing a vN.M release deploys
# the exact image digests staging deployed and accepted for the same git tree
# (`staging-verified-tree-<tree>`, set by pipeline-staging.yml). Nothing is
# rebuilt or re-tested: the required checks already ran on the dev commit
# (verified again here) and on the staging → main pull request. Release events
# execute the workflow file from the TAGGED commit.
#
# Re-deploying an EXISTING release (rollback or retry) does not need this
# pipeline: use the "Deploy" workflow's manual dispatch with environment=production
# and the release tag instead (docs/operations/release-runbook.md).

on:
  release:
    types: [published]

concurrency:
  group: prod-pipeline
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-scope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Validate and report release scope
        env:
          WEATHER_STAGING_ENABLED: ${{ vars.WEATHER_STAGING_ENABLED }}
          WEATHER_PRODUCTION_ENABLED: ${{ vars.WEATHER_PRODUCTION_ENABLED }}
        run: node scripts/ci/check-release-scope.mjs

  promote:
    name: Promote staging-verified images
    runs-on: ubuntu-latest
    # Only a published release on a v* tag (vX.Y.Z) can move production tags.
    if: github.event_name == 'release' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
      checks: read
    outputs:
      digests: ${{ steps.promote.outputs.digests }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.3.1
        with:
          fetch-depth: 0
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: promote
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/promote-images.mjs promote production
      - name: Require promoted digests
        env:
          DIGESTS: ${{ steps.promote.outputs.digests }}
        run: |
          [[ -n "${DIGESTS//[[:space:]]/}" ]] || { echo "::error::Promotion produced no image digests"; exit 1; }

  deploy:
    name: Deploy
    needs: [release-scope, promote]
    if: ${{ needs.promote.outputs.digests != '' }}
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      image_tag: sha-${{ github.sha }}
      image_digests: ${{ needs.promote.outputs.digests }}
    secrets: inherit
    permissions:
      contents: read
      packages: read

  # `latest` and the release tag move only after production accepted the release.
  publish-tags:
    name: Tag released images
    needs: [promote, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.3.1
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          DEPLOY_IMAGE_DIGESTS: ${{ needs.promote.outputs.digests }}
        run: node scripts/ci/promote-images.mjs publish-release
