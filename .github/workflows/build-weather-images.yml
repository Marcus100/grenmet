name: Build Weather Images
on:
  workflow_call:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: surface
            dockerfile: surface/Dockerfile.deploy
            target: ""
          - name: wxwatch
            dockerfile: infra/weather/Dockerfile.collectors
            target: wxwatch
          - name: gms-ingest
            dockerfile: infra/weather/Dockerfile.collectors
            target: gms-ingest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve lowercase owner
        id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - name: Build image for security verification
        id: verify
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: false
          load: true
          platforms: linux/amd64
          tags: ghcr.io/${{ steps.owner.outputs.name }}/barrelsgd-${{ matrix.name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=weather-${{ matrix.name }}
      - name: Enforce weather image vulnerability policy before publishing
        uses: ./.github/actions/scan-image
        with:
          image: ghcr.io/${{ steps.owner.outputs.name }}/barrelsgd-${{ matrix.name }}:sha-${{ github.sha }}
          scope: ${{ matrix.dockerfile }}#${{ matrix.target || 'runner' }}
          name: ${{ matrix.name }}
      - name: Build immutable commit image
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: true
          platforms: linux/amd64
          tags: ghcr.io/${{ steps.owner.outputs.name }}/barrelsgd-${{ matrix.name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=weather-${{ matrix.name }}
          cache-to: type=gha,scope=weather-${{ matrix.name }},mode=max,ignore-error=true
      - name: Record artifact
        env:
          IMAGE: ghcr.io/${{ steps.owner.outputs.name }}/barrelsgd-${{ matrix.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: printf '%s@%s\n' "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
