name: Deploy

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      image_tag:
        description: "sha-<full commit SHA> matching the workflow ref"
        required: false
        default: ""
        type: string
      backup_gate_override:
        description: "Emergency only: reason to proceed past an enforced backup gate; recorded in the run summary"
        required: false
        default: ""
        type: string
  workflow_dispatch:
    inputs:
      environment:
        required: true
        type: choice
        options: [staging, production]
      image_tag:
        description: "sha-<full commit SHA> matching the selected branch or release tag"
        required: true
        type: string
      backup_gate_override:
        description: "Emergency only: reason to proceed past an enforced backup gate (DEPLOY_BACKUP_GATE=enforce); recorded in the run summary"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  validate-ref:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Validate release scope
        env:
          WEATHER_STAGING_ENABLED: ${{ vars.WEATHER_STAGING_ENABLED }}
          WEATHER_PRODUCTION_ENABLED: ${{ vars.WEATHER_PRODUCTION_ENABLED }}
        run: node scripts/ci/check-release-scope.mjs
      - name: Validate trusted release reference
        env:
          DEPLOY_ENV: ${{ inputs.environment }}
          INPUT_TAG: ${{ inputs.image_tag }}
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/production/validate-ref.sh

  deploy:
    if: >-
      ${{ (inputs.environment == 'staging' && github.ref == 'refs/heads/staging' ||
           inputs.environment == 'production' && startsWith(github.ref, 'refs/tags/v')) &&
          github.event_name != 'pull_request' && github.event_name != 'pull_request_target' }}
    needs: validate-ref
    name: Deploy ${{ inputs.environment }} core
    runs-on: [self-hosted, "${{ inputs.environment }}", core]
    timeout-minutes: 45
    concurrency:
      group: ${{ inputs.environment == 'production' && 'prod-droplet' || 'core-staging' }}
      cancel-in-progress: false
    environment:
      name: ${{ inputs.environment }}
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        working-directory: infra/docker
    env:
      DEPLOY_ENV: ${{ inputs.environment }}
      DEPLOY_IMAGE_TAG: sha-${{ github.sha }}
      COMPOSE_PROJECT: ${{ inputs.environment == 'production' && 'grenmet' || 'grenmet-staging' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          clean: false
      - name: Run serialized core delivery
        env:
          SENTRY_DSN_STAGING: ${{ secrets.SENTRY_DSN_STAGING }}
          SENTRY_DSN_PRODUCTION: ${{ secrets.SENTRY_DSN_PRODUCTION }}
          TELEMETRY_ENABLED: ${{ vars.TELEMETRY_ENABLED }}
          TELEMETRY_WORKER_HEARTBEAT_URL: ${{ secrets.WORKER_HEARTBEAT_URL }}
          CORE_REDIS_IMAGE: ${{ vars.CORE_REDIS_IMAGE }}
          CORE_POSTGRES_IMAGE: ${{ vars.CORE_POSTGRES_IMAGE }}
          CORE_PRIVATE_IP: ${{ vars.CORE_PRIVATE_IP }}
          POSTGIS_RESTORE_VERIFIED: ${{ vars.POSTGIS_RESTORE_VERIFIED }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          AUTH_PRIVILEGED_MFA_MODE: ${{ vars.AUTH_PRIVILEGED_MFA_MODE }}
          AUTH_TOTP_ENCRYPTION_KEYS: ${{ secrets.AUTH_TOTP_ENCRYPTION_KEYS }}
          ORG_SECRET_ENCRYPTION_KEYS: ${{ secrets.ORG_SECRET_ENCRYPTION_KEYS }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          FASTAPI_DB_PASSWORD: ${{ secrets.FASTAPI_DB_PASSWORD }}
          FIRST_SUPERUSER: ${{ secrets.FIRST_SUPERUSER }}
          FIRST_SUPERUSER_PASSWORD: ${{ secrets.FIRST_SUPERUSER_PASSWORD }}
          WXWATCH_INGEST_TOKEN: ${{ secrets.WXWATCH_INGEST_TOKEN }}
          WXWATCH_DB_PASSWORD: ${{ secrets.WXWATCH_DB_PASSWORD }}
          WXPRODUCTS_DB_PASSWORD: ${{ secrets.WXPRODUCTS_DB_PASSWORD }}
          EREGISTER_DB_PASSWORD: ${{ secrets.EREGISTER_DB_PASSWORD }}
          JANITORIAL_DB_PASSWORD: ${{ secrets.JANITORIAL_DB_PASSWORD }}
          TRANSPORT_DB_PASSWORD: ${{ secrets.TRANSPORT_DB_PASSWORD }}
          CMS_DB_PASSWORD: ${{ secrets.CMS_DB_PASSWORD }}
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          EVENTS_SSO_CLIENT_SECRET: ${{ secrets.EVENTS_SSO_CLIENT_SECRET }}
          TRUSTED_WEB_SECRET: ${{ secrets.TRUSTED_WEB_SECRET }}
          GAA_ADMIN_SSO_CLIENT_SECRET: ${{ secrets.GAA_ADMIN_SSO_CLIENT_SECRET }}
          BARRELS_ADMIN_SSO_CLIENT_SECRET: ${{ secrets.BARRELS_ADMIN_SSO_CLIENT_SECRET }}
          CMS_SSO_CLIENT_SECRET: ${{ secrets.CMS_SSO_CLIENT_SECRET }}
          WEATHER_SSO_CLIENT_SECRET: ${{ secrets.WEATHER_SSO_CLIENT_SECRET }}
          MBIA_SSO_CLIENT_SECRET: ${{ secrets.MBIA_SSO_CLIENT_SECRET }}
          SIGNAL_SSO_CLIENT_SECRET: ${{ secrets.SIGNAL_SSO_CLIENT_SECRET }}
          DOCS_SSO_CLIENT_SECRET: ${{ secrets.DOCS_SSO_CLIENT_SECRET }}
          ELECTIONS_SSO_CLIENT_SECRET: ${{ secrets.ELECTIONS_SSO_CLIENT_SECRET }}
          GMSDASH_SSO_CLIENT_SECRET: ${{ secrets.GMSDASH_SSO_CLIENT_SECRET }}
          BOOKINGS_SSO_CLIENT_SECRET: ${{ secrets.BOOKINGS_SSO_CLIENT_SECRET }}
          EMAIL: ${{ secrets.EMAIL }}
          USERNAME: ${{ secrets.USERNAME }}
          HASHED_PASSWORD: ${{ secrets.HASHED_PASSWORD }}
          # Staging-only Traefik basic auth (htpasswd bcrypt lines); render-env.py
          # requires them on staging. Never exported on production (Compose would
          # otherwise read them from the shell).
          STAGING_BASIC_AUTH_USERS: ${{ inputs.environment == 'staging' && secrets.STAGING_BASIC_AUTH_USERS || '' }}
          ADMINER_BASIC_AUTH_USERS: ${{ inputs.environment == 'staging' && secrets.ADMINER_BASIC_AUTH_USERS || '' }}
          # user:password of one STAGING_BASIC_AUTH_USERS entry, so the post-deploy
          # smoke can pass the staging gate. Unset on production.
          STAGING_PROBE_CREDENTIALS: ${{ inputs.environment == 'staging' && secrets.STAGING_PROBE_CREDENTIALS || '' }}
          STORAGE_ENDPOINT_URL: ${{ secrets.STORAGE_ENDPOINT_URL || secrets.DO_SPACES_ENDPOINT }}
          STORAGE_REGION: ${{ secrets.STORAGE_REGION || secrets.DO_SPACES_REGION }}
          STORAGE_BUCKET: ${{ secrets.STORAGE_BUCKET || secrets.DO_SPACES_BUCKET }}
          STORAGE_ACCESS_KEY_ID: ${{ secrets.STORAGE_ACCESS_KEY_ID || secrets.DO_SPACES_ACCESS_KEY_ID }}
          STORAGE_SECRET_ACCESS_KEY: ${{ secrets.STORAGE_SECRET_ACCESS_KEY || secrets.DO_SPACES_SECRET_ACCESS_KEY }}
          STORAGE_PUBLIC_BASE_URL: ${{ secrets.STORAGE_PUBLIC_BASE_URL }}
          BILLING_STRIPE_SECRET_KEY: ${{ secrets.BILLING_STRIPE_SECRET_KEY }}
          BILLING_STRIPE_WEBHOOK_SECRET: ${{ secrets.BILLING_STRIPE_WEBHOOK_SECRET }}
          BILLING_STRIPE_PRICE_ID: ${{ secrets.BILLING_STRIPE_PRICE_ID || vars.BILLING_STRIPE_PRICE_ID }}
          BILLING_CHECKOUT_SUCCESS_URL: ${{ secrets.BILLING_CHECKOUT_SUCCESS_URL || vars.BILLING_CHECKOUT_SUCCESS_URL }}
          BILLING_CHECKOUT_CANCEL_URL: ${{ secrets.BILLING_CHECKOUT_CANCEL_URL || vars.BILLING_CHECKOUT_CANCEL_URL }}
          RESEND_WEBHOOK_SECRET: ${{ secrets.RESEND_WEBHOOK_SECRET }}
          EMAIL_RENDER_SECRET: ${{ secrets.EMAIL_RENDER_SECRET }}
          NOTIFICATIONS_EMAIL_ALLOWED_DOMAINS: ${{ vars.NOTIFICATIONS_EMAIL_ALLOWED_DOMAINS }}
          CAP_SIGNING_CERT: ${{ secrets.CAP_SIGNING_CERT }}
          CAP_SIGNING_KEY: ${{ secrets.CAP_SIGNING_KEY }}
          CAP_SIGNING_KEY_REF: ${{ vars.CAP_SIGNING_KEY_REF || 'cap-signing-key' }}
          MBIA_CONTACT_RECIPIENT: ${{ vars.MBIA_CONTACT_RECIPIENT }}
          BARRELS_CONTACT_RECIPIENT: ${{ vars.BARRELS_CONTACT_RECIPIENT }}
          GMS_DATA_REQUEST_RECIPIENT: ${{ vars.GMS_DATA_REQUEST_RECIPIENT }}
          TURNSTILE_ENABLED: ${{ vars.TURNSTILE_ENABLED }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          EMAIL_HASH_PEPPER: ${{ secrets.EMAIL_HASH_PEPPER }}
          EREGISTER_OBS_RECIPIENTS: ${{ vars.EREGISTER_OBS_RECIPIENTS }}
          EREGISTER_SEND_REQUIRE_ACCEPTED: ${{ vars.EREGISTER_SEND_REQUIRE_ACCEPTED }}
          WIS2BOX_S3_ENDPOINT_URL: ${{ vars.WIS2BOX_S3_ENDPOINT_URL }}
          WIS2BOX_S3_BUCKET: ${{ vars.WIS2BOX_S3_BUCKET }}
          WIS2BOX_TOPIC_HIERARCHY: ${{ vars.WIS2BOX_TOPIC_HIERARCHY }}
          FLIGHTS_OPENSKY_ENABLED: ${{ vars.FLIGHTS_OPENSKY_ENABLED }}
          WIS2BOX_S3_ACCESS_KEY_ID: ${{ secrets.WIS2BOX_S3_ACCESS_KEY_ID }}
          WIS2BOX_S3_SECRET_ACCESS_KEY: ${{ secrets.WIS2BOX_S3_SECRET_ACCESS_KEY }}
          OPENSKY_CLIENT_ID: ${{ secrets.OPENSKY_CLIENT_ID }}
          OPENSKY_CLIENT_SECRET: ${{ secrets.OPENSKY_CLIENT_SECRET }}
          COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
          COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_SERVICE_PASSWORD }}
          CDSAPI_URL: ${{ vars.CDSAPI_URL }}
          CDSAPI_KEY: ${{ secrets.CDSAPI_KEY }}
          WEBPUSH_VAPID_PUBLIC_KEY: ${{ vars.WEBPUSH_VAPID_PUBLIC_KEY }}
          WEBPUSH_CONTACT: ${{ vars.WEBPUSH_CONTACT }}
          WEBPUSH_VAPID_PRIVATE_KEY: ${{ secrets.WEBPUSH_VAPID_PRIVATE_KEY }}
          PAYMENTS_STRIPE_SECRET_KEY: ${{ secrets.PAYMENTS_STRIPE_SECRET_KEY }}
          PAYMENTS_STRIPE_WEBHOOK_SECRET: ${{ secrets.PAYMENTS_STRIPE_WEBHOOK_SECRET }}
          PAYMENTS_STRIPE_SUCCESS_URL: ${{ vars.PAYMENTS_STRIPE_SUCCESS_URL }}
          PAYMENTS_STRIPE_CANCEL_URL: ${{ vars.PAYMENTS_STRIPE_CANCEL_URL }}
          # Live social posting (Facebook Page and Instagram). Empty until the owner sets
          # them; the worker then keeps dry-running posts. Live posting also needs the
          # social-live-posting feature flag on. See docs/operations/social-live-posting.md.
          META_PAGE_ID: ${{ vars.META_PAGE_ID }}
          META_INSTAGRAM_ACCOUNT_ID: ${{ vars.META_INSTAGRAM_ACCOUNT_ID }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pre-migration backup gate (release runbook, "Backup gate"). Mode defaults to
          # warn in core.sh when the variable is unset; nothing here enables enforce.
          DEPLOY_BACKUP_GATE: ${{ vars.DEPLOY_BACKUP_GATE }}
          DEPLOY_BACKUP_MAX_AGE_HOURS: ${{ vars.DEPLOY_BACKUP_MAX_AGE_HOURS }}
          DEPLOY_BACKUP_GATE_OVERRIDE: ${{ inputs.backup_gate_override }}
          # List-only access to the backup bucket: the read-only key, never the write key.
          BACKUP_GATE_BUCKET: ${{ secrets.DO_SPACES_BUCKET }}
          BACKUP_GATE_ENDPOINT: ${{ secrets.DO_SPACES_ENDPOINT }}
          BACKUP_GATE_REGION: ${{ secrets.DO_SPACES_REGION }}
          BACKUP_GATE_ACCESS_KEY_ID: ${{ secrets.DO_SPACES_READ_ACCESS_KEY_ID }}
          BACKUP_GATE_SECRET_ACCESS_KEY: ${{ secrets.DO_SPACES_READ_SECRET_ACCESS_KEY }}
          # Set to 1 on a GitHub environment to replace routed services without a gap.
          ROLLING_DEPLOY: ${{ vars.ROLLING_DEPLOY }}
        run: bash ../../scripts/production/core.sh deploy
      - name: Install declared monitoring after application acceptance
        if: vars.MONITORING_DEPLOY_ENABLED == 'true'
        env:
          PROBE_HEARTBEAT_URL: ${{ secrets.PROBE_HEARTBEAT_URL }}
          BETTERSTACK_API_TOKEN: ${{ secrets.BETTERSTACK_API_TOKEN }}
          PROBE_INCIDENTS_ENABLED: ${{ vars.PROBE_INCIDENTS_ENABLED }}
          PROBE_MAINTENANCE: ${{ vars.PROBE_MAINTENANCE }}
          STAGING_PROBE_CREDENTIALS: ${{ inputs.environment == 'staging' && secrets.STAGING_PROBE_CREDENTIALS || '' }}
        run: |
          set -euo pipefail
          sudo --preserve-env=DEPLOY_ENV,GITHUB_SHA,PROBE_HEARTBEAT_URL,BETTERSTACK_API_TOKEN,PROBE_INCIDENTS_ENABLED,PROBE_MAINTENANCE,STAGING_PROBE_CREDENTIALS bash ../../scripts/monitoring/install.sh
      # Marks the release deployed in Sentry so issues show "first seen in" and
      # regressions per deploy. Release = commit SHA, matching SENTRY_RELEASE
      # (render-env.py) and NEXT_PUBLIC_RELEASE (build-web-images.yml). Optional:
      # skipped without the token, and a Sentry failure never fails the deploy.
      - name: Mark Sentry release deployed
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG || 'grenmet' }}
          SENTRY_PROJECT: grenmet-${{ inputs.environment }}
          RELEASE: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ -z "$SENTRY_AUTH_TOKEN" ]]; then
            echo "SENTRY_AUTH_TOKEN not set; skipping Sentry deploy marker." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          base="https://sentry.io/api/0/organizations/${SENTRY_ORG}/releases"
          sentry() {
            # The token goes through stdin, never the process list or the log.
            printf 'header = "Authorization: Bearer %s"\n' "$SENTRY_AUTH_TOKEN" |
              curl --config - --fail-with-body --silent --show-error --max-time 20 \
                -H 'Content-Type: application/json' -o /dev/null -w '%{http_code}\n' \
                -X POST "$1" --data "$2"
          }
          # Creating an existing release is idempotent (200/208).
          sentry "$base/" "{\"version\":\"$RELEASE\",\"projects\":[\"$SENTRY_PROJECT\"]}"
          sentry "$base/$RELEASE/deploys/" "{\"environment\":\"$DEPLOY_ENV\",\"name\":\"$DEPLOY_IMAGE_TAG\"}"
          echo "Sentry release $RELEASE marked deployed to $DEPLOY_ENV ($SENTRY_PROJECT)." >> "$GITHUB_STEP_SUMMARY"
      - name: Service state on failure
        if: failure()
        run: docker ps -a --filter "label=com.docker.compose.project=$COMPOSE_PROJECT" --format 'table {{.Names}}\t{{.Status}}'
      - name: Remove runtime secrets
        if: always()
        run: bash ../../scripts/production/core.sh cleanup
