name: Deploy

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      image_tag:
        description: "sha-<full commit SHA> matching the workflow ref"
        required: false
        default: ""
        type: string
  workflow_dispatch:
    inputs:
      environment:
        required: true
        type: choice
        options: [staging, production]
      image_tag:
        description: "sha-<full commit SHA> matching the selected branch or release tag"
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate-ref:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Validate trusted release reference
        env:
          DEPLOY_ENV: ${{ inputs.environment }}
          INPUT_TAG: ${{ inputs.image_tag }}
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/production/validate-ref.sh

  deploy:
    if: >-
      ${{ (inputs.environment == 'staging' && github.ref == 'refs/heads/staging' ||
           inputs.environment == 'production' && startsWith(github.ref, 'refs/tags/v')) &&
          github.event_name != 'pull_request' && github.event_name != 'pull_request_target' }}
    needs: validate-ref
    name: Deploy ${{ inputs.environment }} core
    runs-on: [self-hosted, "${{ inputs.environment }}", core]
    timeout-minutes: 45
    concurrency:
      group: core-${{ inputs.environment }}
      cancel-in-progress: false
    environment:
      name: ${{ inputs.environment }}
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        working-directory: infra/docker
    env:
      DEPLOY_ENV: ${{ inputs.environment }}
      DEPLOY_IMAGE_TAG: sha-${{ github.sha }}
      COMPOSE_PROJECT: ${{ inputs.environment == 'production' && 'grenmet' || 'grenmet-staging' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          clean: false
      - name: Run serialized core delivery
        env:
          CORE_REDIS_IMAGE: ${{ vars.CORE_REDIS_IMAGE }}
          CORE_POSTGRES_IMAGE: ${{ vars.CORE_POSTGRES_IMAGE }}
          CORE_PRIVATE_IP: ${{ vars.CORE_PRIVATE_IP }}
          POSTGIS_RESTORE_VERIFIED: ${{ vars.POSTGIS_RESTORE_VERIFIED }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          FASTAPI_DB_PASSWORD: ${{ secrets.FASTAPI_DB_PASSWORD }}
          FIRST_SUPERUSER: ${{ secrets.FIRST_SUPERUSER }}
          FIRST_SUPERUSER_PASSWORD: ${{ secrets.FIRST_SUPERUSER_PASSWORD }}
          WXWATCH_DB_PASSWORD: ${{ secrets.WXWATCH_DB_PASSWORD }}
          WXPRODUCTS_DB_PASSWORD: ${{ secrets.WXPRODUCTS_DB_PASSWORD }}
          JANITORIAL_DB_PASSWORD: ${{ secrets.JANITORIAL_DB_PASSWORD }}
          TRANSPORT_DB_PASSWORD: ${{ secrets.TRANSPORT_DB_PASSWORD }}
          CMS_DB_PASSWORD: ${{ secrets.CMS_DB_PASSWORD }}
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
          SESSION_COOKIE_NAME: ${{ secrets.SESSION_COOKIE_NAME }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          EMAIL: ${{ secrets.EMAIL }}
          USERNAME: ${{ secrets.USERNAME }}
          HASHED_PASSWORD: ${{ secrets.HASHED_PASSWORD }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          STORAGE_ENDPOINT_URL: ${{ secrets.STORAGE_ENDPOINT_URL }}
          STORAGE_REGION: ${{ secrets.STORAGE_REGION }}
          STORAGE_BUCKET: ${{ secrets.STORAGE_BUCKET }}
          STORAGE_ACCESS_KEY_ID: ${{ secrets.STORAGE_ACCESS_KEY_ID }}
          STORAGE_SECRET_ACCESS_KEY: ${{ secrets.STORAGE_SECRET_ACCESS_KEY }}
          STORAGE_PUBLIC_BASE_URL: ${{ secrets.STORAGE_PUBLIC_BASE_URL }}
          BOOTSTRAP_CMS: ${{ vars.BOOTSTRAP_CMS }}
          AWS_ACCESS_KEY_ID: ${{ secrets.DO_SPACES_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DO_SPACES_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.DO_SPACES_REGION }}
          AWS_EC2_METADATA_DISABLED: "true"
          DO_SPACES_BUCKET: ${{ secrets.DO_SPACES_BUCKET }}
          DO_SPACES_ENDPOINT: ${{ secrets.DO_SPACES_ENDPOINT }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash ../../scripts/production/core.sh deploy
      - name: Service state on failure
        if: failure()
        run: docker ps -a --filter "label=com.docker.compose.project=$COMPOSE_PROJECT" --format 'table {{.Names}}\t{{.Status}}'
      - name: Remove runtime secrets
        if: always()
        run: bash ../../scripts/production/core.sh cleanup
