name: Staging Pipeline

# Build once, promote by digest (issue #1019). Nothing is built or re-tested
# here: the images were built when the change landed on dev (dev-images.yml),
# and the required checks already ran on that dev commit and on the
# dev → staging pull request. This pipeline finds the dev commit with the same
# git tree, verifies its required checks passed, retags those exact digests for
# staging, deploys them, and after a successful deploy records them as the
# digests production may promote.
on:
  push:
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: staging-pipeline
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-scope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Validate and report release scope
        env:
          WEATHER_STAGING_ENABLED: ${{ vars.WEATHER_STAGING_ENABLED }}
          WEATHER_PRODUCTION_ENABLED: ${{ vars.WEATHER_PRODUCTION_ENABLED }}
        run: node scripts/ci/check-release-scope.mjs

  promote:
    name: Promote dev images
    runs-on: ubuntu-latest
    # A manual dispatch from another branch must never move the staging tags.
    if: github.ref == 'refs/heads/staging'
    permissions:
      contents: read
      packages: write
      checks: read
      actions: write # dispatches dev-images.yml when the dev images are missing
    outputs:
      tree: ${{ steps.promote.outputs.tree }}
      digests: ${{ steps.promote.outputs.digests }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.3.1
        with:
          fetch-depth: 0
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: promote
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/promote-images.mjs promote staging
      - name: Require promoted digests
        env:
          DIGESTS: ${{ steps.promote.outputs.digests }}
        run: |
          [[ -n "${DIGESTS//[[:space:]]/}" ]] || { echo "::error::Promotion produced no image digests"; exit 1; }

  deploy:
    name: Deploy
    needs: [release-scope, promote]
    if: ${{ needs.promote.outputs.digests != '' }}
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      image_tag: sha-${{ github.sha }}
      image_digests: ${{ needs.promote.outputs.digests }}
    secrets: inherit
    permissions:
      contents: read
      packages: read

  # Only digests that staging deployed and accepted (smoke tests included) can
  # reach production.
  mark-verified:
    name: Record staging-verified images
    needs: [promote, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.3.1
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - env:
          TREE: ${{ needs.promote.outputs.tree }}
          DEPLOY_IMAGE_DIGESTS: ${{ needs.promote.outputs.digests }}
        run: node scripts/ci/promote-images.mjs verified
