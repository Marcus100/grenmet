name: Staging Pipeline

# Every staging commit builds a complete matching application/migration image set.
on:
  push:
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: staging-pipeline
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-scope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Validate and report release scope
        env:
          WEATHER_STAGING_ENABLED: ${{ vars.WEATHER_STAGING_ENABLED }}
          WEATHER_PRODUCTION_ENABLED: ${{ vars.WEATHER_PRODUCTION_ENABLED }}
        run: node scripts/ci/check-release-scope.mjs

  ci-api:
    name: CI (API)
    uses: ./.github/workflows/ci-api.yml
    with:
      deployment-builds: true
    secrets: inherit
    permissions:
      contents: read
      security-events: write

  ci-web:
    name: CI (Web)
    uses: ./.github/workflows/ci-web.yml
    with:
      deployment-builds: true
    secrets: inherit
    permissions:
      contents: read

  api-client:
    name: API client drift
    uses: ./.github/workflows/ci-api-client.yml
    secrets: inherit
    permissions:
      contents: read

  build-api:
    name: Build API image
    uses: ./.github/workflows/build-api-image.yml
    with:
      tag: staging
    secrets: inherit
    permissions:
      contents: read
      packages: write
      security-events: write

  build-web:
    name: Build web images
    uses: ./.github/workflows/build-web-images.yml
    with:
      tag: staging
    secrets: inherit
    permissions:
      contents: read
      packages: write
      security-events: write

  deploy:
    name: Deploy
    needs: [release-scope, ci-api, ci-web, api-client, build-api, build-web]
    # CI and every matching artifact must succeed.
    if: >-
      ${{
        !cancelled() &&
        needs.release-scope.result == 'success' &&
        needs.ci-api.result == 'success' &&
        needs.ci-web.result == 'success' &&
        needs.api-client.result == 'success' &&
        needs.build-api.result == 'success' &&
        needs.build-web.result == 'success'
      }}
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      image_tag: sha-${{ github.sha }}
    secrets: inherit
    permissions:
      contents: read
      packages: read
