name: Staging Pipeline

# Every staging commit builds a complete matching application/migration image set.
on:
  push:
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: staging-pipeline
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci-api:
    name: CI (API)
    uses: ./.github/workflows/ci-api.yml
    with:
      deployment-builds: true
    secrets: inherit
    permissions:
      contents: read
      security-events: write

  ci-web:
    name: CI (Web)
    uses: ./.github/workflows/ci-web.yml
    with:
      deployment-builds: true
    secrets: inherit
    permissions:
      contents: read

  api-client:
    name: API client drift
    uses: ./.github/workflows/ci-api-client.yml
    secrets: inherit
    permissions:
      contents: read

  build-api:
    name: Build API image
    uses: ./.github/workflows/build-api-image.yml
    with:
      tag: staging
    secrets: inherit
    permissions:
      contents: read
      packages: write
      security-events: write

  build-web:
    name: Build web images
    uses: ./.github/workflows/build-web-images.yml
    with:
      tag: staging
    secrets: inherit
    permissions:
      contents: read
      packages: write
      security-events: write

  build-weather:
    if: ${{ vars.WEATHER_STAGING_ENABLED == 'true' }}
    uses: ./.github/workflows/build-weather-images.yml
    permissions:
      contents: read
      packages: write

  deploy:
    name: Deploy
    needs: [ci-api, ci-web, api-client, build-api, build-web]
    # CI and every matching artifact must succeed.
    if: >-
      ${{
        !cancelled() &&
        needs.ci-api.result == 'success' &&
        needs.ci-web.result == 'success' &&
        needs.api-client.result == 'success' &&
        needs.build-api.result == 'success' &&
        needs.build-web.result == 'success'
      }}
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      image_tag: sha-${{ github.sha }}
    secrets: inherit
    permissions:
      contents: read
      packages: read

  deploy-weather:
    needs: [build-weather, deploy]
    if: ${{ vars.WEATHER_STAGING_ENABLED == 'true' }}
    uses: ./.github/workflows/deploy-weather.yml
    with:
      environment: staging
    secrets: inherit
    permissions:
      contents: read
      packages: read

  weather-configuration-status:
    runs-on: ubuntu-latest
    steps:
      - name: Report integration state
        env:
          ENABLED: ${{ vars.WEATHER_STAGING_ENABLED }}
        run: |
          if [[ "$ENABLED" != true ]]; then
            echo "Weather integration UNCONFIGURED: provision and validate its dedicated host before enabling delivery." >> "$GITHUB_STEP_SUMMARY"
          fi
