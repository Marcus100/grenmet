name: Restore Drill

# ADR-0021. Proves the latest off-host backups rebuild every core database, match the
# code's migration heads, and restore inside the recovery target. Manual only: add a
# schedule after one human-timed run passes. It reads backups with a read-only
# credential, restores into a tmpfs-backed throwaway PostgreSQL container, and never
# connects to a live database. Recovery time is not proven end to end until the API
# check (ADR-0021 step 4, opt-in via api_check) has also passed on real backups.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Release tag whose migration heads the backup must match (empty = latest published release)"
        required: false
        default: ""
      environment:
        description: "Backup set to restore"
        required: true
        default: production
        type: choice
        options: [production, staging]
      postgres_image:
        description: "PostgreSQL image for the throwaway container (use the reviewed core image)"
        required: false
        default: "postgres:17"
      api_check:
        description: "Also start the release's API image against the restored databases and require health plus authenticated reads (production only; leave off for the first human-timed run)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

# Shares a group with the backup and deploy jobs so the drill never competes with them
# for the production runner.
concurrency:
  group: prod-droplet
  cancel-in-progress: false

jobs:
  heads:
    name: Migration heads of the release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      ref: ${{ steps.pick.outputs.ref }}
    steps:
      - name: Pick the release
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          ref="${INPUT_REF:-$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName')}"
          [[ "$ref" =~ ^v[0-9]+\.[0-9]+$ ]] || { echo "Expected a release tag like v0.27, got: $ref"; exit 1; }
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Checking migration heads of $ref"

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.3.1
        with:
          ref: ${{ steps.pick.outputs.ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Sync API dependencies
        run: uv sync --frozen --package fast-back

      - name: Read the Alembic heads
        run: scripts/agents/api-env.sh bash scripts/production/restore-drill-heads.sh > heads.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: restore-drill-heads
          path: heads.json
          retention-days: 7

  drill:
    name: Restore and verify
    needs: heads
    runs-on: [self-hosted, production]
    timeout-minutes: 150
    environment:
      name: production-backup
    # packages: read lets the optional API check pull the release image from GHCR,
    # the same grant deploy.yml uses. The backup credential is unchanged.
    permissions:
      contents: read
      packages: read
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.DO_SPACES_READ_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.DO_SPACES_READ_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.DO_SPACES_REGION }}
      AWS_EC2_METADATA_DISABLED: "true"
      DO_SPACES_BUCKET: ${{ secrets.DO_SPACES_BUCKET }}
      DO_SPACES_ENDPOINT: ${{ secrets.DO_SPACES_ENDPOINT }}
    steps:
      - name: Require the read-only credential
        run: |
          set -euo pipefail
          # Never fall back to the write credential the backup job uses.
          : "${AWS_ACCESS_KEY_ID:?Add DO_SPACES_READ_ACCESS_KEY_ID to the production-backup environment}"
          : "${AWS_SECRET_ACCESS_KEY:?Add DO_SPACES_READ_SECRET_ACCESS_KEY to the production-backup environment}"

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.3.1
        with:
          ref: ${{ needs.heads.outputs.ref }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: restore-drill-heads

      # Opt-in. Pulls the exact image built for the release under test (tag
      # production-sha-<commit>, as build-api-image.yml names it) and refuses one whose
      # labels do not match that commit. The registry login lives in a temporary Docker
      # config that is deleted afterwards, so the drill itself runs with the runner's
      # normal Docker settings.
      - name: Pull the release API image
        if: ${{ inputs.api_check }}
        env:
          GH_TOKEN: ${{ github.token }}
          DRILL_ENVIRONMENT: ${{ inputs.environment }}
          DOCKER_CONFIG: ${{ runner.temp }}/restore-drill-ghcr
        run: |
          set -euo pipefail
          [[ "$DRILL_ENVIRONMENT" == production ]] || { echo "api_check needs the production backup set and release image"; exit 1; }
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT
          mkdir -p "$DOCKER_CONFIG"
          sha="$(git rev-parse HEAD)"
          image="ghcr.io/${GITHUB_REPOSITORY,,}:production-sha-${sha}"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker pull --quiet "$image" > /dev/null
          [[ "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$image")" == "$sha" ]] || { echo "Image revision does not match the release commit"; exit 1; }
          [[ "$(docker image inspect --format '{{index .Config.Labels "gd.barrels.environment"}}' "$image")" == production ]] || { echo "Image is not a production image"; exit 1; }
          echo "DRILL_API_IMAGE=$image" >> "$GITHUB_ENV"
          echo "API image under test: $image"

      - name: Restore drill
        env:
          DRILL_ENVIRONMENT: ${{ inputs.environment }}
          DRILL_IMAGE: ${{ inputs.postgres_image }}
          DRILL_API_CHECK: ${{ inputs.api_check }}
          TMPDIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          api_flags=()
          if [[ "$DRILL_API_CHECK" == true ]]; then
            api_flags=(--api-check --api-image "$DRILL_API_IMAGE")
          fi
          python3 scripts/production/restore-drill.py "$DRILL_ENVIRONMENT" \
            --heads heads.json \
            --floors docs/operations/restore-drill-floors.json \
            --image "$DRILL_IMAGE" \
            --result-file restore-drill-result.json \
            "${api_flags[@]}"

      # Counts and timings only; the result never contains row contents.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: restore-drill-result
          path: restore-drill-result.json
          if-no-files-found: ignore
          retention-days: 90
