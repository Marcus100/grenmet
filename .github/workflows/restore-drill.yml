name: Restore Drill

# ADR-0021. Proves the latest off-host backups rebuild every core database, match the
# code's migration heads, and restore inside the recovery target. Runs monthly (the 1st,
# 05:30 UTC, after the 02:00 backup and well before the day's traffic) against the
# production backup set and the latest release; a failed scheduled run opens an issue.
# Dispatch it by hand to pick a ref, the staging set or the API check. It reads backups
# with a read-only credential, restores into a tmpfs-backed throwaway PostgreSQL container, and never
# connects to a live database. Recovery time is not proven end to end until the API
# check (ADR-0021 step 4, opt-in via api_check) has also passed on real backups.
on:
  schedule:
    - cron: "30 5 1 * *"
  workflow_dispatch:
    inputs:
      ref:
        description: "Release tag (v1.0.2 or v0.27) whose migration heads the backup must match (empty = latest published release)"
        required: false
        default: ""
      environment:
        description: "Backup set to restore"
        required: true
        default: production
        type: choice
        options: [production, staging]
      postgres_image:
        description: "PostgreSQL image for the throwaway container (use the reviewed core image)"
        required: false
        default: "postgres:18"
      api_check:
        description: "Also start the release's API image against the restored databases and require health plus authenticated reads (production only; leave off for the first human-timed run)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

# Shares a group with the backup and deploy jobs so the drill never competes with them
# for the production runner.
concurrency:
  group: prod-droplet
  cancel-in-progress: false

jobs:
  heads:
    name: Migration heads of the release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      ref: ${{ steps.pick.outputs.ref }}
    steps:
      - name: Pick the release
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          ref="${INPUT_REF:-$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName')}"
          [[ "$ref" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] || { echo "Expected a release tag like v0.27 or v1.0.2, got: $ref"; exit 1; }
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Checking migration heads of $ref"

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.3.1
        with:
          ref: ${{ steps.pick.outputs.ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Sync API dependencies
        run: uv sync --frozen --package fast-back

      - name: Read the Alembic heads
        run: scripts/agents/api-env.sh bash scripts/production/restore-drill-heads.sh > heads.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: restore-drill-heads
          path: heads.json
          retention-days: 7

  drill:
    name: Restore and verify
    needs: heads
    runs-on: [self-hosted, production]
    timeout-minutes: 150
    environment:
      name: production-backup
    # packages: read lets the optional API check pull the release image from GHCR,
    # the same grant deploy.yml uses. The backup credential is unchanged.
    permissions:
      contents: read
      packages: read
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.DO_SPACES_READ_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.DO_SPACES_READ_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.DO_SPACES_REGION }}
      AWS_EC2_METADATA_DISABLED: "true"
      DO_SPACES_BUCKET: ${{ secrets.DO_SPACES_BUCKET }}
      DO_SPACES_ENDPOINT: ${{ secrets.DO_SPACES_ENDPOINT }}
    steps:
      - name: Require the read-only credential
        run: |
          set -euo pipefail
          # Never fall back to the write credential the backup job uses.
          : "${AWS_ACCESS_KEY_ID:?Add DO_SPACES_READ_ACCESS_KEY_ID to the production-backup environment}"
          : "${AWS_SECRET_ACCESS_KEY:?Add DO_SPACES_READ_SECRET_ACCESS_KEY to the production-backup environment}"

      # The release under test: its commit selects the API image for the optional API
      # check. The drill tooling does not come from here (see the next step).
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.3.1
        with:
          ref: ${{ needs.heads.outputs.ref }}

      # The drill script and its floors come from the ref this workflow was dispatched
      # on, not from the release tag. Otherwise a fix to the drill (for example the
      # PostgreSQL 18 start) could not be tried until the next release, and the drill
      # would keep running the old script.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.3.1
        with:
          ref: ${{ github.sha }}
          path: drill-tooling

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: restore-drill-heads

      # Opt-in. Pulls the exact image built for the release under test (tag
      # production-sha-<commit>, as build-api-image.yml names it) and refuses one whose
      # labels do not match that commit. The registry login lives in a temporary Docker
      # config that is deleted afterwards, so the drill itself runs with the runner's
      # normal Docker settings.
      - name: Pull the release API image
        if: ${{ inputs.api_check }}
        env:
          GH_TOKEN: ${{ github.token }}
          DRILL_ENVIRONMENT: ${{ inputs.environment || 'production' }}
          DOCKER_CONFIG: ${{ runner.temp }}/restore-drill-ghcr
        run: |
          set -euo pipefail
          [[ "$DRILL_ENVIRONMENT" == production ]] || { echo "api_check needs the production backup set and release image"; exit 1; }
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT
          mkdir -p "$DOCKER_CONFIG"
          sha="$(git rev-parse HEAD)"
          image="ghcr.io/${GITHUB_REPOSITORY,,}:production-sha-${sha}"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker pull --quiet "$image" > /dev/null
          # Images are built once on dev and promoted by digest (build-api-image.yml),
          # so the label names the dev commit the image was built from, not the
          # release merge commit. Require that commit to be part of the release.
          revision="$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$image")"
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]] || { echo "Image has no revision label"; exit 1; }
          # The production runner has no gh CLI; ask the compare API with curl.
          relation="$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/compare/$revision...$sha" | python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])')"
          [[ "$relation" == ahead || "$relation" == identical ]] || { echo "Image revision $revision is not part of the release commit ($relation)"; exit 1; }
          # Build-once images carry no environment label (staging and production share
          # the digest); the production-sha tag above is set only by promotion.
          build_once="$(docker image inspect --format '{{index .Config.Labels "gd.barrels.build-once"}}' "$image")"
          environment="$(docker image inspect --format '{{index .Config.Labels "gd.barrels.environment"}}' "$image")"
          [[ "$build_once" == true || "$environment" == production ]] || { echo "Image is not a promoted production image"; exit 1; }
          echo "DRILL_API_IMAGE=$image" >> "$GITHUB_ENV"
          echo "API image under test: $image"

      - name: Restore drill
        env:
          # A scheduled run has no inputs: production backups, the reviewed core image,
          # no API check.
          DRILL_ENVIRONMENT: ${{ inputs.environment || 'production' }}
          DRILL_IMAGE: ${{ inputs.postgres_image || 'postgres:18' }}
          DRILL_API_CHECK: ${{ inputs.api_check || false }}
          TMPDIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          api_flags=()
          if [[ "$DRILL_API_CHECK" == true ]]; then
            api_flags=(--api-check --api-image "$DRILL_API_IMAGE")
          fi
          python3 drill-tooling/scripts/production/restore-drill.py "$DRILL_ENVIRONMENT" \
            --heads heads.json \
            --floors drill-tooling/docs/operations/restore-drill-floors.json \
            --image "$DRILL_IMAGE" \
            --result-file restore-drill-result.json \
            "${api_flags[@]}"

      # Counts and timings only; the result never contains row contents.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: restore-drill-result
          path: restore-drill-result.json
          if-no-files-found: ignore
          retention-days: 90

  # Scheduled runs only. Runs on a GitHub-hosted runner, so the production runner
  # holds no issue-writing token. One open issue at a time: a later failure comments.
  report-failure:
    name: Open an issue for a failed scheduled drill
    needs: [heads, drill]
    if: ${{ always() && github.event_name == 'schedule' && (needs.heads.result == 'failure' || needs.drill.result == 'failure' || needs.drill.result == 'cancelled') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open or update the issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="friction: monthly restore drill failed"
          body="> *This was generated by AI during friction capture.*

          The scheduled restore drill (ADR-0021) did not pass: ${RUN_URL}

          Until it passes again, the recovery time and the claim that the latest backups restore are unproven. Open the run, read the failing step, and see docs/operations/restore-drill.md. The result artifact holds counts and timings only."
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label friction --search "\"$title\" in:title" --json number --jq '.[0].number // empty')"
          if [[ -n "$existing" ]]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "Failed again: ${RUN_URL}"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --label friction --label needs-triage --title "$title" --body "$body"
          fi
