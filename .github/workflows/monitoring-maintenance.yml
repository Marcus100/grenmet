name: Monitoring maintenance

on:
  schedule:
    - cron: '17 2 * * *'
    - cron: '17 4 * * 0'
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [staging, production]
        default: staging
        required: true
      operation:
        type: choice
        options: [backup, restore]
        default: backup
        required: true

permissions:
  contents: read

jobs:
  maintenance:
    strategy:
      fail-fast: false
      matrix:
        # Scheduled production is added only after the staging acceptance gate.
        environment: ${{ fromJSON(inputs.environment == 'production' && '["production"]' || '["staging"]') }}
    # Never execute privileged jobs from pull requests or arbitrary dispatch refs.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: [self-hosted, '${{ matrix.environment }}', core]
    environment: ${{ matrix.environment }}
    concurrency:
      group: ${{ matrix.environment == 'production' && 'prod-droplet' || 'core-staging' }}
      cancel-in-progress: false
    timeout-minutes: 60
    steps:
      - name: Select enabled target and immutable deployed revision
        id: target
        env:
          ENABLED: ${{ vars.MONITORING_MAINTENANCE_ENABLED }}
          REVISION: ${{ vars.MONITORING_REVISION }}
          STORAGE_VERIFIED: ${{ vars.MONITORING_STORAGE_VERIFIED }}
          SELECTED: ${{ inputs.environment }}
          TARGET: ${{ matrix.environment }}
        run: |
          set -euo pipefail
          if [[ -z "$SELECTED" && "$ENABLED" != true || -n "$SELECTED" && "$SELECTED" != "$TARGET" ]]; then
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo 'Maintenance intentionally disabled or not selected.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          [[ "$REVISION" =~ ^[0-9a-f]{40}$ ]] || { echo 'Set MONITORING_REVISION to an approved full commit SHA'; exit 1; }
          [[ "$STORAGE_VERIFIED" == true ]] || { echo 'Verify existing storage capacity, lifecycle and cost limits before maintenance'; exit 1; }
          [[ "$(cat /opt/grenmet/monitoring-revision)" == "$REVISION" ]] || { echo 'Revision does not match installed monitoring'; exit 1; }
          rm -f "$RUNNER_TEMP/monitoring-$TARGET.json" "$RUNNER_TEMP/monitoring-$TARGET.md"
          rm -rf "$RUNNER_TEMP/monitoring-owners"
          echo 'enabled=true' >> "$GITHUB_OUTPUT"
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        if: steps.target.outputs.enabled == 'true'
        with:
          ref: ${{ steps.target.outputs.revision }}
          persist-credentials: false
      - name: Run verified core maintenance
        if: steps.target.outputs.enabled == 'true'
        env:
          TARGET: ${{ matrix.environment }}
          OPERATION: ${{ inputs.operation || (github.event.schedule == '17 4 * * 0' && 'restore' || 'backup') }}
          DO_SPACES_BUCKET: ${{ secrets.DO_SPACES_BUCKET }}
          DO_SPACES_ENDPOINT: ${{ secrets.DO_SPACES_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.DO_SPACES_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DO_SPACES_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.DO_SPACES_REGION }}
          BACKUP_HEARTBEAT_URL: ${{ secrets.BACKUP_HEARTBEAT_URL }}
          GITHUB_SHA: ${{ steps.target.outputs.revision }}
        run: |
          set -euo pipefail
          umask 077
          : "${BACKUP_HEARTBEAT_URL:?Configure the environment backup heartbeat before enabling maintenance}"
          export BACKUP_DIR="$RUNNER_TEMP/grenmet-backups"
          trap 'rm -rf -- "$BACKUP_DIR"' EXIT
          exec 9>"/var/lock/grenmet-core-$TARGET.lock"
          flock -w 1800 9
          python3 scripts/monitoring/maintenance.py "$OPERATION" --environment "$TARGET" --report "$RUNNER_TEMP/monitoring-$TARGET.json"
      - name: Remove this run's isolated restore containers even on cancellation
        if: always() && steps.target.outputs.enabled == 'true'
        env:
          TARGET: ${{ matrix.environment }}
        run: |
          set -euo pipefail
          docker ps -aq --filter label=grenmet.restore=true --filter label=grenmet.restore.owner=monitoring-maintenance --filter "label=grenmet.restore.environment=$TARGET" --filter "label=grenmet.restore.run=$GITHUB_RUN_ID" |
            while IFS= read -r container; do
              if [[ -n "$container" ]]; then docker rm -fv "$container" >/dev/null; fi
            done
      - name: Build owner-separated availability reports
        if: always() && steps.target.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          samples="$RUNNER_TEMP/monitoring-probes.jsonl"
          trap 'rm -f "$samples"' EXIT
          if sudo -n -u deploy cat /var/lib/grenmet-monitoring/probes.jsonl > "$samples"; then
            python3 scripts/monitoring/report.py --samples "$samples" --output "$RUNNER_TEMP/monitoring-owners"
          else
            python3 scripts/monitoring/report.py --output "$RUNNER_TEMP/monitoring-owners"
          fi
      - name: Upload sanitized evidence
        if: always() && steps.target.outputs.enabled == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: monitoring-${{ matrix.environment }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/monitoring-${{ matrix.environment }}.*
            ${{ runner.temp }}/monitoring-owners/
          retention-days: 14
          if-no-files-found: warn
      - name: Publish sanitized result
        if: always() && steps.target.outputs.enabled == 'true'
        env:
          TARGET: ${{ matrix.environment }}
        run: |
          if [[ -f "$RUNNER_TEMP/monitoring-$TARGET.json" ]]; then
            cat "$RUNNER_TEMP/monitoring-$TARGET.json" >> "$GITHUB_STEP_SUMMARY"
            rm -f "$RUNNER_TEMP/monitoring-$TARGET.json" "$RUNNER_TEMP/monitoring-$TARGET.md"
          else
            echo 'Maintenance result unknown: job did not produce evidence.' >> "$GITHUB_STEP_SUMMARY"
          fi
