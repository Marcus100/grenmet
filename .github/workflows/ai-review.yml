# Retained as a manual retirement notice so re-enabling this workflow cannot
# restart API billing. Subscription review runs on the trusted local worker.
name: AI review

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    name: API review retired
    runs-on: ubuntu-latest
    steps:
      - name: Subscription review owns the merge decision
        run: echo 'Use scripts/agents/review-worker.mjs; this workflow makes no model calls.'
