name: Build and Push Docker Images

# Build once (issue #1019): called only by dev-images.yml. Images are built for a
# dev commit, tagged by git tree, and promoted to staging and production by
# digest (scripts/ci/promote-images.mjs); nothing here is environment-specific.
on:
  workflow_call:
    inputs:
      ref:
        description: "Commit to build (default: the caller's commit)"
        required: false
        default: ""
        type: string

jobs:
  build-and-push:
    name: Build and Push Images
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.3.1
        with:
          fetch-depth: 1
          ref: ${{ inputs.ref || github.sha }}

      - name: Log in to Docker Hub for base images
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve build context
        id: ctx
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "repository=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
          echo "local_tag=dev-sha-$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ steps.ctx.outputs.repository }}
          # No environment label: staging and production promote the same digest.
          # The revision label is set explicitly because the metadata action
          # would otherwise use the dispatching ref's commit.
          labels: |
            org.opencontainers.image.revision=${{ steps.ctx.outputs.sha }}
            gd.barrels.tree=${{ steps.ctx.outputs.tree }}
            gd.barrels.build-once=true
          tags: |
            type=raw,value=${{ steps.ctx.outputs.local_tag }}
            type=raw,value=tree-${{ steps.ctx.outputs.tree }}
            type=raw,value=dev

      - name: Build image for verification
        id: verify
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/api/fastapi/Dockerfile.prod
          # No `pull:` — every FROM in Dockerfile.prod is digest-pinned, so a
          # forced re-pull only costs registry round-trips.
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/${{ steps.ctx.outputs.owner }}/barrelsgd-buildcache:api
          # Exported here, not on the publish step, so a build that fails the
          # smoke test or vulnerability gate still leaves its layers cached.
          cache-to: type=registry,ref=ghcr.io/${{ steps.ctx.outputs.owner }}/barrelsgd-buildcache:api,mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true
          provenance: false
          platforms: linux/amd64

      - name: Smoke-test image before publishing
        env:
          IMAGE: ghcr.io/${{ steps.ctx.outputs.repository }}:${{ steps.ctx.outputs.local_tag }}
        run: |
          bash scripts/production/smoke-image.sh "$IMAGE" api

      - name: Enforce image vulnerability policy before publishing
        uses: ./.github/actions/scan-image
        with:
          image: ghcr.io/${{ steps.ctx.outputs.repository }}:${{ steps.ctx.outputs.local_tag }}
          scope: apps/api/fastapi/Dockerfile.prod#runtime
          name: api

      - name: Publish verified image from builder cache
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/api/fastapi/Dockerfile.prod
          pull: false
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/${{ steps.ctx.outputs.owner }}/barrelsgd-buildcache:api
          provenance: true
          sbom: true
          platforms: linux/amd64


      - name: Upload image security findings
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066
        with:
          sarif_file: trivy-results.sarif
          category: trivy-api

      - name: Image digest summary
        run: |
          echo "✅ grenmet-api image built and pushed successfully"
          echo "Tags: ${{ steps.meta.outputs.tags }}"
          echo "Image: ghcr.io/${{ steps.ctx.outputs.repository }}@${{ steps.build.outputs.digest }}"
