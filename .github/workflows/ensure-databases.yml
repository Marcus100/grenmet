name: Inspect Databases

# Provisioning belongs to deploy.yml, after the required backup gate.
# Retain this manual entry for read-only operator inventory.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        required: true
        options: [staging, production]

permissions:
  contents: read

jobs:
  inventory:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, "${{ inputs.environment }}", core]
    concurrency:
      group: core-${{ inputs.environment }}
      cancel-in-progress: false
    timeout-minutes: 10
    environment:
      name: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          clean: false
      - name: Inspect configured and running stores without exposing credentials
        run: bash scripts/production/inventory.sh
