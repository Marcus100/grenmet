name: CI — Web Apps

on:
  # No paths filter anywhere. Flow is dev → (PR) → staging → (PR) → main; those
  # promotion PRs are integration gates that must not skip checks (a path-skipped
  # required check also deadlocks the PR). Full suite on every push and PR to a
  # long-lived branch keeps the gates honest and safe to mark "required".
  # No staging push trigger: pipeline-staging calls this workflow on staging
  # pushes (Phase 3c cutover), so a standalone run would be a duplicate.
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, staging, dev]
  workflow_call:

# Hardcoded per-file prefix: inside a workflow_call child, github.workflow is the
# CALLER's name, so a ${{ github.workflow }} group makes sibling children cancel
# each other. PR runs dedupe per PR; push/called runs are unique per run.
concurrency:
  group: ci-web-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Job 1: Biome lint/format check (fast, runs on all web code)
  biome:
    name: Biome Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.3.1

      - name: Setup Node.js with pnpm
        uses: ./.github/actions/setup-node

      - name: Run Biome CI
        run: pnpm check:ci

  # Job 2: TypeScript type-check (all web apps in parallel via Turbo)
  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.3.1

      - name: Setup Node.js with pnpm
        uses: ./.github/actions/setup-node

      - name: Type-check all web apps
        run: pnpm type-check

  # Job 3: Peer dependency audit (strict mode — catches version mismatches)
  peer-check:
    name: Peer Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.3.1

      - name: Setup Node.js with pnpm (strict peers)
        uses: ./.github/actions/setup-node
        with:
          strict-peer-dependencies: "true"

  # Job 4: Repository blast-radius rules across the complete change range
  guardrails:
    name: Repository Guardrails
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.3.1
        with:
          fetch-depth: 0

      - name: Setup Node.js with pnpm
        uses: ./.github/actions/setup-node

      - name: Test delivery guardrails
        run: pnpm test:delivery

      - name: Check Docker workspace dependencies
        run: node scripts/guardrails/check-docker-workspaces.mjs

      - name: Test repository guardrails
        run: pnpm test:guardrails

      - name: Check pull request range
        if: github.event_name == 'pull_request'
        run: |
          base="$(git merge-base "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}")" || {
              echo "Unable to determine the pull request merge base." >&2
              exit 1
            }
          pnpm guardrails --base "$base" --head "${{ github.event.pull_request.head.sha }}"

      - name: Check push range
        if: github.event_name == 'push'
        run: >-
          pnpm guardrails
          --base "${{ github.event.before }}"
          --head "${{ github.sha }}"

      - name: Check manually dispatched range
        if: github.event_name != 'pull_request' && github.event_name != 'push'
        run: |
          base="$(git rev-parse "${GITHUB_SHA}^")" || {
            echo "Unable to determine a base commit for the manual guardrail run." >&2
            exit 1
          }
          pnpm guardrails --base "$base" --head "$GITHUB_SHA"

  # Job 5: Repository documentation and design-system drift
  drift:
    name: Repository Drift
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.3.1

      - name: Setup Node.js with pnpm
        uses: ./.github/actions/setup-node

      - name: Test documentation links
        run: pnpm test:docs

      - name: Check documentation links
        run: pnpm docs:check-links

      - name: Check portfolio coverage
        run: pnpm docs:check-portfolio

      - name: Check design-system drift and contrast
        run: |
          pnpm design-system:check
          pnpm design-system:contrast

  # Job 6: TypeScript unit tests across every workspace package
  tests:
    name: TypeScript Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.3.1

      - name: Setup Node.js with pnpm
        uses: ./.github/actions/setup-node

      - name: Run all TypeScript unit tests
        run: pnpm test

  # Job 7: Build all web apps (validates no build errors)
  build:
    name: Build Web Apps
    needs: [biome, type-check, peer-check, guardrails, drift, tests, container-smoke, storage-integration]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.3.1

      - name: Setup Node.js with pnpm
        uses: ./.github/actions/setup-node

      - name: Build all web apps
        env:
          # admin-gms validates RESEND_API_KEY at build time via @t3-oss/env-nextjs.
          # Its WXWATCH/WXPRODUCTS_DATABASE_URL are optional, so no DB URL is needed here.
          RESEND_API_KEY: re_placeholder
          EMAILS_FROM_EMAIL: cms@example.test
          PAYLOAD_SECRET: ci-build-only-placeholder-not-for-runtime-use
          DATABASE_URL: postgresql://unused:unused@127.0.0.1:1/gms_cms
        run: pnpm build

  container-smoke:
    name: Container smoke (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: auth
            path: apps/web/auth
            port: 3000
            health: /api/health
          - app: admin
            path: apps/web/gaa-admin
            port: 3001
            health: /api/health
          - app: docs
            path: apps/web/docs
            port: 3002
            health: /api/health
          - app: gms
            path: apps/web/gms
            port: 3003
            health: /api/health
          - app: cms
            path: apps/web/cms
            port: 3006
            health: /api/health
          - app: cms-migrate
            path: apps/web/cms
            target: migrate
          - app: admin-migrate
            path: apps/web/gaa-admin
            target: migrate
          - app: signal
            path: apps/web/signal
            port: 3004
            health: /api/health
          - app: mbia
            path: apps/web/mbia
            port: 3005
            health: /api/health
          - app: events
            path: apps/web/events
            port: 3009
            health: /api/health
          - app: hono
            path: apps/api/honoapi
            port: 4000
            health: /health
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.3.1
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build runtime image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: ${{ matrix.path }}/Dockerfile
          target: ${{ matrix.target || 'runner' }}
          load: true
          tags: smoke-${{ matrix.app }}:ci
          cache-from: type=gha,scope=smoke-${{ matrix.app }}
          cache-to: type=gha,scope=smoke-${{ matrix.app }},mode=max,ignore-error=true
      - name: Start image and check health
        if: matrix.target != 'migrate'
        env:
          APP: ${{ matrix.app }}
          PORT: ${{ matrix.port }}
          HEALTH_PATH: ${{ matrix.health }}
        run: |
          set -euo pipefail
          docker run -d --name smoke -p "127.0.0.1:8080:$PORT" \
            -e RESEND_API_KEY=ci-placeholder \
            -e EMAILS_FROM_EMAIL=ci@example.test \
            -e PAYLOAD_SECRET=ci-only-placeholder-not-for-runtime-use \
            -e DATABASE_URL=postgresql://unused:unused@127.0.0.1:1/gms_cms \
            "smoke-$APP:ci"
          for attempt in {1..30}; do
            if curl --fail --silent --max-time 5 "http://127.0.0.1:8080$HEALTH_PATH"; then
              exit 0
            fi
            sleep 2
          done
          docker logs smoke
          exit 1
      - name: Check migration package imports
        if: matrix.target == 'migrate'
        env:
          APP: ${{ matrix.app }}
        run: |
          set -euo pipefail
          if [[ "$APP" == cms-migrate ]]; then
            docker run --rm --network none --entrypoint node "smoke-$APP:ci" \
              --input-type=module -e "await import('payload'); await import('@payloadcms/db-postgres'); import {createRequire} from 'node:module'; createRequire(import.meta.url).resolve('@barrelsgd/tsconfig/tsconfig.nextjs.json')"
          else
            docker run --rm --network none --entrypoint node "smoke-$APP:ci" \
              --input-type=module -e "await import('./apps/web/gaa-admin/scripts/migrate-domain.mjs')"
          fi
      - name: Container logs and cleanup
        if: always()
        run: |
          docker logs smoke || true
          docker rm -f smoke || true

  storage-integration:
    name: Core storage integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgis/postgis:17-3.5@sha256:01a6a70e41e6c4467c8f55f6063555ed72db2d6662cd0d571040d42eadaeb6f6
        env:
          POSTGRES_USER: storage_test
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U storage_test -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: ./.github/actions/setup-node
      - name: Install PostgreSQL client for runtime privilege checks
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Build API client required by CMS migration configuration
        run: pnpm --filter @barrelsgd/api-client build
      - name: Fresh, concurrent and failed migrations; catalogue preservation
        env:
          STORAGE_TEST_POSTGRES_URL: postgresql://storage_test:test-only-password@localhost:5432/postgres
          RUNTIME_ROLE_TEST_REQUIRED: "true"
        run: node --test apps/web/gaa-admin/scripts/storage.integration.test.mjs apps/web/cms/scripts/storage.integration.test.mjs scripts/production/runtime-role.integration.test.mjs

  weather-images:
    name: Weather image build (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: surface
            dockerfile: surface/Dockerfile.deploy
            target: ""
          - name: wxwatch
            dockerfile: infra/weather/Dockerfile.collectors
            target: wxwatch
          - name: gms-ingest
            dockerfile: infra/weather/Dockerfile.collectors
            target: gms-ingest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
      - uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: false
          platforms: linux/amd64
          cache-from: type=gha,scope=weather-${{ matrix.name }}
          cache-to: type=gha,scope=weather-${{ matrix.name }},mode=max,ignore-error=true
