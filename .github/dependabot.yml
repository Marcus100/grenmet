version: 2

# target-branch: dev on every ecosystem — version updates must enter the promotion
# flow (dev → staging → main) like all other work. Without it Dependabot targets the
# default branch, so merged bumps land above staging and leave main permanently
# ahead, which conflicts the next staging → main promotion. Security updates still
# target the default branch by design; those are meant to reach production fast.
updates:
  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    commit-message:
      prefix: ⬆

  # Python uv (root workspace)
  - package-ecosystem: uv
    directory: /
    target-branch: dev
    schedule:
      interval: daily
    commit-message:
      prefix: ⬆

  # Docker (API)
  - package-ecosystem: docker
    directory: /apps/api/fastapi
    target-branch: dev
    schedule:
      interval: weekly
    commit-message:
      prefix: ⬆

  # Docker (Web apps — keeps the pinned node:24-alpine digest fresh)
  - package-ecosystem: docker
    directories:
      - /apps/web/*
    target-branch: dev
    schedule:
      interval: weekly
    commit-message:
      prefix: ⬆

  # Docker Compose (API)
  - package-ecosystem: docker-compose
    directory: /apps/api/fastapi
    target-branch: dev
    schedule:
      interval: weekly
    commit-message:
      prefix: ⬆

  # Docker Compose (infra — postgres, traefik, adminer)
  - package-ecosystem: docker-compose
    directory: /infra/docker
    target-branch: dev
    schedule:
      interval: weekly
    commit-message:
      prefix: ⬆

  # pnpm (monorepo root — covers all workspace packages: apps/web/*, apps/api/honoapi, packages/*)
  # Dependabot uses the "npm" ecosystem for pnpm; it detects pnpm-lock.yaml automatically.
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    commit-message:
      prefix: ⬆
