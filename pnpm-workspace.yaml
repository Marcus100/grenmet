packages:
  # Apps
  - "apps/web/*"
  # Note: fastapi is Python, not managed by pnpm

  # Shared packages
  - "packages/*"

# pnpm 12 reads workspace settings here, including lifecycle-script permissions.
# These exact versions were selected and tested before the pnpm 12 migration.
# Preserve the default release-age policy for all other/future versions.
minimumReleaseAgeExclude:
  - "@gunshi/plugin-dryrun@0.37.2"
  - "@gunshi/plugin@0.37.2"
  - "dompurify@3.4.15"
  - "gunshi@0.37.2"
  - "react-resizable-panels@4.12.4"
  - "simple-icons@16.30.0"
  - "ultracite@7.11.0"
strictPeerDependencies: false
autoInstallPeers: true
# Reject hardcoded versions for catalogued dependencies at `pnpm add` time.
catalogMode: strict
# Host and devcontainer bind-mount the same repo, so they must share one store.
# A relative path resolves to the same physical dir from both, on the same fs as
# node_modules (required for hardlinking). Never set an absolute path here.
storeDir: .pnpm-store
# pnpm 12 otherwise reinstalls before running any script, which wipes the shared
# node_modules mid-command. Install explicitly instead.
verifyDepsBeforeRun: false
publicHoistPattern:
  - tailwindcss
  - "@tailwindcss/*"
allowBuilds:
  "@sentry/cli": true
  esbuild: true
  msw: true
  core-js: false
  sharp: false
  unrs-resolver: false
allowedDeprecatedVersions:
  "@esbuild-kit/core-utils": "3.3.2"
  "@esbuild-kit/esm-loader": "2.6.5"

catalog:
  # GMS editorial CMS (keep Payload packages on the same exact version)
  payload: 3.92.1
  "@payloadcms/next": 3.92.1
  "@payloadcms/db-postgres": 3.92.1
  "@payloadcms/ui": 3.92.1
  "@payloadcms/email-resend": 3.92.1
  "@payloadcms/richtext-lexical": 3.92.1
  # Payload 3.90.2 supports GraphQL 16; revisit when its peer range allows 17.
  graphql: ^16.14.2
  react-markdown: "^10.1.0"

  # Core
  react: ^19.3.1
  react-dom: ^19.3.1
  next: 16.4.4
  babel-plugin-react-compiler: "^1.0.0"
  server-only: "0.0.1"
  typescript: "^7.0.2"


  # Styling
  tailwindcss: "^4.3.3"
  "@tailwindcss/postcss": "^4.3.4"

  # Weather and GIS maps
  "maplibre-gl": ^6.16.0
  "react-map-gl": "^8.1.3"
  "pmtiles": "^4.5.0"
  "@turf/boolean-point-in-polygon": "^7.4.0"

  # Data fetching
  "@tanstack/react-query": ^5.105.3

  # UI
  lucide-react: ^1.67.0

  # Brand marks for the GMS footer social links (CC0). Pinned exactly: the
  # release-age exclusion above names this version.
  simple-icons: 16.36.0
  "@base-ui/react": "^1.9.0"
  class-variance-authority: "^0.7.1"
  cn: ^0.5.2
  tw-animate-css: "^1.4.0"
  cmdk: "^1.1.1"
  sonner: "^2.0.8"
  recharts: "^3.10.1"
  vaul: "^1.1.2"
  react-resizable-panels: "^4.17.0"
  input-otp: "^1.5.0"
  qrcode: "^1.5.4"
  "@types/qrcode": "^1.5.6"
  embla-carousel-react: "^8.6.0"

  # Studio demo dashboards (kanban/invoice drag-drop, logistics map)
  "@fullcalendar/react": "^7.1.3"
  "@types/geojson": "^7946.0.16"

  # Tables — admin-gms (data tables + virtualised lists)
  "@tanstack/react-table": "^9.3.1"

  # Animation — motion (successor to framer-motion); import from "motion/react"
  motion: ^14.7.1

  # Types
  "@types/node": ^26.6.6
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0


  # Validation — used across multiple web apps
  zod: ^4.6.7
  "@t3-oss/env-nextjs": "^0.13.11"

  # Themes
  next-themes: "^0.4.6"

  # State management — @barrelsgd/theme preferences store
  zustand: "^5.0.16"

  # Database (pg) — used in wxwatch and wxproducts
  pg: "^8.23.1"
  "@types/pg": "^8.23.1"

  # API client generator (packages/api-client). Exact pins so `kubb generate`
  # output only changes when these are bumped on purpose. The @kubb plugins
  # version independently of the kubb core, so each keeps its own version.
  kubb: 5.15.3
  "@kubb/adapter-oas": 5.15.3
  "@kubb/parser-ts": 5.15.3
  "@kubb/plugin-fetch": 5.11.0
  "@kubb/plugin-react-query": 5.9.0
  "@kubb/plugin-ts": 5.4.0
  "@kubb/plugin-zod": 5.8.0

  # Repository tooling
  "@biomejs/biome": "~2.6.4"
  turbo: "^2.11.10"
  ultracite: "8.1.1"
  husky: "^9.1.7"
  knip: "^6.44.1"
  lint-staged: ^17.6.0

  # MDX — content-collections stack (docs, signal)
  "@content-collections/core": "^0.15.3"
  "@content-collections/cli": "^0.1.9"
  "@content-collections/mdx": "^0.2.2"
  "@content-collections/next": ^0.2.11
  "@tailwindcss/typography": "^0.5.20"
  mdx-annotations: "^0.1.4"
  remark-gfm: "^4.0.1"

  # TypeScript safety utilities
  "@total-typescript/ts-reset": "^0.6.1"

  # Admin-gms map/date
  "react-day-picker": "^10.0.2"

  # Error tracking
  "@sentry/nextjs": ^11.10.0

  # Analytics
  "posthog-js": ^1.445.1
  "posthog-node": ^5.61.2

  # Testing
  vitest: ^5.1.0
  "@vitest/coverage-v8": ^5.1.0
  msw: "^2.15.0"
  "@testing-library/react": "^16.3.3"
  "@testing-library/user-event": "^14.6.8"
  "@testing-library/jest-dom": "^7.0.1"
  "@testing-library/dom": ^10.4.2
  jsdom: ^30.1.3
  "@playwright/test": "^1.64.1"
  # Accessibility checks in the staging journeys (owner approved, 11 Nov 2026).
  "@axe-core/playwright": "^4.14.0"


# Payload CMS's Postgres adapter depends on drizzle-kit; replace its esbuild
# binaries built with old Go.
overrides:
  "@esbuild-kit/core-utils@3.3.2>esbuild": "0.28.2"
  "drizzle-kit@0.31.7>esbuild": "0.28.2"
  # CVE-2026-19534 / CVE-2026-84961: payload@3.90.2 pins undici 7.29.0.
  # CVE-2026-109869: undici < 6.29.1, < 7.30.1 and < 8.12.2 are affected. The
  # CMS migrate image re-resolves with `pnpm deploy --legacy`, so the pins are
  # global, one per major. Remove once no dependant resolves an affected copy.
  "undici@^6": "6.29.1"
  "undici@^7": "7.30.1"
  "undici@^8": "8.12.2"
  # CVE-2026-115895: happy-dom < 21.0.4 is affected. Only @lexical/headless
  # (a Payload dependency) pulls it in, asking for ^20.9.0, and uses just
  # `Window`. Remove once Lexical depends on a fixed happy-dom.
  "happy-dom": "21.0.4"
  # GHSA-cg2g-xh64-v4q7 (critical) / GHSA-mrv2-3pqr-j5jr (high): dompurify
  # <= 3.4.16 is affected; 3.4.17 is the first fixed release. monaco-editor
  # (a peer of @payloadcms/ui) and posthog-js pin or resolve affected copies,
  # and the CMS migrate image re-resolves them with `pnpm deploy --legacy`,
  # so the override is global. Remove once no dependant resolves an affected
  # release without it.
  dompurify: ">=3.4.17 <4"
  # GHSA-587h-7wmj-h5pm (high): vite 8.3.0 to 8.3.2 is affected (launch-editor
  # existence check bypass on Windows); 8.3.3 is the first fixed release. vite
  # is a direct dependency of vitest, unplugin and unplugin-kubb and a peer of
  # @sentry/cloudflare, so this is mostly a developer machine exposure (the
  # vite dev server). Remove once every resolved vite is >= 8.3.3 on its own.
  "vite@~8.3.0": ">=8.3.3 <9"
  # GHSA seroval advisories (one critical, four high, one medium): seroval
  # < 1.6.10 is affected. solid-js 1.9.15 pins seroval ~1.5; 1.9.18 is the first
  # solid-js that asks for a fixed seroval (~1.6.11). solid-js only arrives
  # through @tanstack/react-query-devtools in gaa-admin, whose production
  # build ships the devtools as a lazy chunk. Remove once the devtools resolve
  # solid-js >= 1.9.18 on their own.
  solid-js: ">=1.9.18 <2"
  # GHSA-68fv-2mgg-jv7q (high): source-map-js 1.2.1 is affected; 1.2.2 is the
  # fix. Build tooling only (postcss, css-tree, @tailwindcss/node, magicast).
  # Remove once every dependant resolves >= 1.2.2 on its own.
  source-map-js: ">=1.2.2 <2"
  # Six toml advisories (high): toml < 5.0.1 is affected. remark-mdx-frontmatter
  # 4.0.0 (under mdx-bundler, under @content-collections/mdx in commit, docs,
  # mbia and signal) asks for ^3.0.0 and only calls `parse`; our content uses
  # YAML front matter. Remove once remark-mdx-frontmatter depends on toml >= 5.0.1.
  "remark-mdx-frontmatter>toml": "5.0.1"
  # uuid < 11.1.1 (medium, buffer bounds in v3/v5/v6): mdx-bundler 10.1.1 asks
  # for ^9.0.1 and only uses v4. Remove once mdx-bundler depends on a fixed uuid.
  "mdx-bundler>uuid": "11.1.1"
  # postcss-selector-parser < 6.1.5 (medium, quadratic parsing):
  # @tailwindcss/typography 0.5.20 pins 6.0.10 exactly. Remove once it moves.
  "@tailwindcss/typography>postcss-selector-parser": "6.1.5"

# Accepted `pnpm audit --prod --audit-level high` findings, so only a NEW
# advisory fails the daily CVE watch (issue #563). Empty: toml and
# source-map-js now resolve fixed versions through the overrides above. Add an
# entry only with its package, reason and a review date.
auditConfig:
  ignoreGhsas: []

# Payload migration tooling expects the JavaScript compiler API. Keep the
# application build/type-check catalog on TypeScript 7.
catalogs:
  cms-migrations:
    typescript: 6.0.3
