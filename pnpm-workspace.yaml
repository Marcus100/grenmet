packages:
  # Apps
  - "apps/web/*"
  # Note: fastapi is Python, not managed by pnpm

  # Shared packages
  - "packages/*"

# pnpm 12 reads workspace settings here, including lifecycle-script permissions.
# These exact versions were selected and tested before the pnpm 12 migration.
# Preserve the default release-age policy for all other/future versions.
minimumReleaseAgeExclude:
  - "@gunshi/plugin-dryrun@0.37.2"
  - "@gunshi/plugin@0.37.2"
  - "dompurify@3.4.15"
  - "gunshi@0.37.2"
  - "react-resizable-panels@4.12.4"
  - "simple-icons@16.30.0"
  - "ultracite@7.11.0"
strictPeerDependencies: false
autoInstallPeers: true
# Reject hardcoded versions for catalogued dependencies at `pnpm add` time.
catalogMode: strict
# Host and devcontainer bind-mount the same repo, so they must share one store.
# A relative path resolves to the same physical dir from both, on the same fs as
# node_modules (required for hardlinking). Never set an absolute path here.
storeDir: .pnpm-store
# pnpm 12 otherwise reinstalls before running any script, which wipes the shared
# node_modules mid-command. Install explicitly instead.
verifyDepsBeforeRun: false
publicHoistPattern:
  - tailwindcss
  - "@tailwindcss/*"
allowBuilds:
  "@sentry/cli": true
  esbuild: true
  msw: true
  core-js: false
  sharp: false
  unrs-resolver: false
allowedDeprecatedVersions:
  "@esbuild-kit/core-utils": "3.3.2"
  "@esbuild-kit/esm-loader": "2.6.5"

catalog:
  # GMS editorial CMS (keep Payload packages on the same exact version)
  payload: 3.90.2
  "@payloadcms/next": 3.90.2
  "@payloadcms/db-postgres": 3.90.2
  "@payloadcms/ui": 3.90.2
  "@payloadcms/email-resend": 3.90.2
  "@payloadcms/richtext-lexical": 3.90.2
  # Payload 3.90.2 supports GraphQL 16; revisit when its peer range allows 17.
  graphql: ^16.14.2
  react-markdown: "^10.1.0"

  # Core
  react: ^19.3.0
  react-dom: ^19.3.0
  next: 16.4.1
  babel-plugin-react-compiler: "^1.0.0"
  server-only: "0.0.1"
  typescript: "^7.0.2"


  # Styling
  tailwindcss: "^4.3.3"
  "@tailwindcss/postcss": "^4.3.3"

  # Weather and GIS maps
  "maplibre-gl": ^6.14.0
  "react-map-gl": "^8.1.3"
  "pmtiles": "^4.5.0"
  "@turf/boolean-point-in-polygon": "^7.4.0"

  # Data fetching
  "@tanstack/react-query": ^5.104.2

  # UI
  lucide-react: ^1.56.0
  "@base-ui/react": "^1.9.0"
  class-variance-authority: "^0.7.1"
  cn: ^0.4.0
  tw-animate-css: "^1.4.0"
  cmdk: "^1.1.1"
  sonner: "^2.0.8"
  recharts: "^3.10.1"
  vaul: "^1.1.2"
  react-resizable-panels: "^4.14.5"
  input-otp: "^1.5.0"
  qrcode: "^1.5.4"
  "@types/qrcode": "^1.5.6"
  embla-carousel-react: "^8.6.0"

  # Studio demo dashboards (kanban/invoice drag-drop, logistics map)
  "@fullcalendar/react": "^7.1.2"
  "@types/geojson": "^7946.0.16"

  # Tables — admin-gms (data tables + virtualised lists)
  "@tanstack/react-table": "^9.3.1"

  # Animation — motion (successor to framer-motion); import from "motion/react"
  motion: ^14.2.0

  # Types
  "@types/node": ^26.6.5
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0


  # Validation — used across multiple web apps
  zod: ^4.6.7
  "@t3-oss/env-nextjs": "^0.13.11"

  # Themes
  next-themes: "^0.4.6"

  # State management — @barrelsgd/theme preferences store
  zustand: "^5.0.15"

  # Database (pg) — used in wxwatch and wxproducts
  pg: "^8.23.1"
  "@types/pg": "^8.23.1"

  # Repository tooling
  "@biomejs/biome": "^2.5.15"
  turbo: "^2.11.8"
  ultracite: "^8.0.1"
  husky: "^9.1.7"
  knip: "^6.41.0"
  lint-staged: ^17.6.0

  # Headless UI — used in gms and docs (migrate to Base UI eventually)
  "@headlessui/react": "^2.2.10"

  # MDX — content-collections stack (docs, signal)
  "@content-collections/core": "^0.15.3"
  "@content-collections/cli": "^0.1.9"
  "@content-collections/mdx": "^0.2.2"
  "@content-collections/next": ^0.2.11
  "@tailwindcss/typography": "^0.5.20"
  mdx-annotations: "^0.1.4"
  remark-gfm: "^4.0.1"

  # TypeScript safety utilities
  "@total-typescript/ts-reset": "^0.6.1"

  # Admin-gms map/date
  "react-day-picker": "^10.0.2"

  # Error tracking
  "@sentry/nextjs": ^11.7.0

  # Analytics
  "posthog-js": ^1.438.9
  "posthog-node": ^5.55.3

  # Testing
  vitest: ^5.0.4
  "@vitest/coverage-v8": ^5.0.4
  msw: "^2.15.0"
  "@testing-library/react": "^16.3.3"
  "@testing-library/user-event": "^14.6.8"
  "@testing-library/jest-dom": "^7.0.1"
  "@testing-library/dom": ^10.4.2
  jsdom: ^30.1.2
  "@playwright/test": "^1.64.0"


# Payload CMS's Postgres adapter depends on drizzle-kit; replace its esbuild
# binaries built with old Go.
overrides:
  "@esbuild-kit/core-utils@3.3.2>esbuild": "0.28.2"
  "drizzle-kit@0.31.7>esbuild": "0.28.2"
  # CVE-2026-19534 / CVE-2026-84961: payload@3.90.2 pins undici 7.29.0.
  # Remove once Payload ships a release depending on a fixed undici.
  "payload@3.90.2>undici": "7.29.1"
  # GHSA-cg2g-xh64-v4q7 (critical) / GHSA-mrv2-3pqr-j5jr (high): dompurify
  # <= 3.4.16 is affected; 3.4.17 is the first fixed release. monaco-editor
  # (a peer of @payloadcms/ui) and posthog-js pin or resolve affected copies,
  # and the CMS migrate image re-resolves them with `pnpm deploy --legacy`,
  # so the override is global. Remove once no dependant resolves an affected
  # release without it.
  dompurify: ">=3.4.17 <4"

# Accepted `pnpm audit --prod --audit-level high` findings, so only a NEW
# advisory fails the daily CVE watch (issue #563). Review by 2026-11-20 and
# remove an entry as soon as its package resolves a fixed version.
# toml 3.0.0 (fixed in 5.0.1): reached by docs, mbia and signal through
# @content-collections/mdx, which is content build tooling. Next standalone
# output leaves it out of the container images, which is why image scans pass.
# source-map-js 1.2.1 (fixed in 1.2.2): reached through @sentry/nextjs's webpack
# plugin, also build tooling.
auditConfig:
  ignoreGhsas:
    - GHSA-82x6-q7mm-w9cf # toml
    - GHSA-v5mp-jgw5-2x6j # toml
    - GHSA-4qx8-w7c3-pj3p # toml
    - GHSA-9j65-hcg3-gc64 # toml
    - GHSA-9qmh-m7c6-f92p # toml
    - GHSA-68fv-2mgg-jv7q # source-map-js

# Payload migration tooling expects the JavaScript compiler API. Keep the
# application build/type-check catalog on TypeScript 7.
catalogs:
  cms-migrations:
    typescript: 6.0.3
