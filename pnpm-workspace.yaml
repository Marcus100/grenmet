packages:
  # Apps
  - "apps/web/*"
  - "apps/api/honoapi"
  # Note: fastapi is Python, not managed by pnpm

  # Shared packages
  - "packages/*"

# pnpm 12 reads workspace settings here, including lifecycle-script permissions.
# These exact versions were selected and tested before the pnpm 12 migration.
# Preserve the default release-age policy for all other/future versions.
minimumReleaseAgeExclude:
  - "@gunshi/plugin-dryrun@0.37.2"
  - "@gunshi/plugin@0.37.2"
  - "dompurify@3.4.15"
  - "gunshi@0.37.2"
  - "react-resizable-panels@4.12.4"
  - "simple-icons@16.30.0"
  - "ultracite@7.11.0"
strictPeerDependencies: false
autoInstallPeers: true
publicHoistPattern:
  - tailwindcss
  - "@tailwindcss/*"
allowBuilds:
  "@sentry/cli": true
  esbuild: true
  msw: true
  core-js: false
  sharp: false
  unrs-resolver: false
allowedDeprecatedVersions:
  "@esbuild-kit/core-utils": "3.3.2"
  "@esbuild-kit/esm-loader": "2.6.5"

catalog:
  # GMS editorial CMS (keep Payload packages on the same exact version)
  payload: "3.88.0"
  "@payloadcms/next": "3.88.0"
  "@payloadcms/db-postgres": "3.88.0"
  "@payloadcms/ui": "3.88.0"
  graphql: "^16.8.1"
  react-markdown: "^10.1.0"

  # Core
  react: "^19.2.8"
  react-dom: "^19.2.8"
  next: "16.3.4"
  server-only: "0.0.1"
  typescript: "^7.0.2"

  tsx: "^4.23.13"

  # Styling
  tailwindcss: "^4.3.3"
  "@tailwindcss/postcss": "^4.3.3"

  # Data fetching
  "@tanstack/react-query": "^5.102.8"

  # UI
  lucide-react: "^1.41.0"
  geist: "^1.7.2"
  "@base-ui/react": "^1.8.0"
  class-variance-authority: "^0.7.1"
  cn: "^0.2.5"
  tw-animate-css: "^1.4.0"
  cmdk: "^1.1.1"
  sonner: "^2.0.8"
  recharts: "^3.10.1"
  vaul: "^1.1.2"
  react-resizable-panels: "^4.12.4"
  input-otp: "^1.5.0"
  embla-carousel-react: "^8.6.0"
  simple-icons: "^16.30.0"

  # Studio demo dashboards (kanban/invoice drag-drop, logistics map)
  "@dnd-kit/core": "^6.3.1"
  "@dnd-kit/modifiers": "^9.0.0"
  "@dnd-kit/sortable": "^10.0.0"
  d3-geo: "^3.1.1"
  topojson-client: "^3.1.0"
  react-hook-form: "^7.87.0"
  "@hookform/resolvers": "^5.9.1"
  "@fullcalendar/react": "^7.1.0"
  "@types/d3-geo": "^3.1.0"
  "@types/topojson-client": "^3.1.5"
  "@types/geojson": "^7946.0.16"

  # Tables — admin-gms (data tables + virtualised lists)
  "@tanstack/react-table": "^9.2.4"
  "@tanstack/react-virtual": "^3.13.17"

  # Animation — motion (successor to framer-motion); import from "motion/react"
  motion: "^13.2.0"

  # Types
  "@types/node": "^24.13.3"
  "@types/react": "^19.2.18"
  "@types/react-dom": "^19.2.7"

  # Database (Drizzle) — used in wxwatch and wxproducts
  drizzle-orm: "^0.45.2"
  drizzle-kit: "^0.31.10"

  # Validation — used across multiple web apps
  zod: "^4.5.4"
  "@t3-oss/env-nextjs": "^0.13.11"

  # Themes
  next-themes: "^0.4.6"

  # State management — @barrelsgd/theme preferences store
  zustand: "^5.0.15"

  # Database (pg) — used in wxwatch and wxproducts
  pg: "^8.23.0"
  "@types/pg": "^8.23.1"
  dotenv-cli: "^11.0.0"

  # Repository tooling
  husky: "^9.1.7"
  lint-staged: "^17.5.0"

  # Headless UI — used in gms and docs (migrate to Base UI eventually)
  "@headlessui/react": "^2.2.10"

  # MDX — content-collections stack (docs, signal) + @barrelsgd/mdx
  "@content-collections/core": "^0.15.2"
  "@content-collections/cli": "^0.1.9"
  "@content-collections/mdx": "^0.2.2"
  "@content-collections/next": "^0.2.8"
  "@tailwindcss/typography": "^0.5.20"
  mdx-annotations: "^0.1.4"
  remark-gfm: "^4.0.1"

  # TypeScript safety utilities
  "@total-typescript/ts-reset": "^0.6.1"

  # Admin-gms map/date
  "react-day-picker": "^10.0.1"
  "react-simple-maps": "^3.0.0"

  # Error tracking
  "@sentry/nextjs": "^10.73.0"

  # Analytics
  "posthog-js": "^1.427.2"
  "posthog-node": "^5.51.6"

  # Testing
  vitest: "^5.0.0"
  "@vitest/coverage-v8": "^5.0.0"
  msw: "^2.15.0"
  "@testing-library/react": "^16.3.3"
  "@testing-library/user-event": "^14.6.7"
  "@testing-library/jest-dom": "^7.0.1"
  "@testing-library/dom": "^10.4.1"
  jsdom: "^30.0.1"
  "@playwright/test": "^1.63.0"
  "@faker-js/faker": "^10.2.0"
