<!doctype html>
<html class="h-full antialiased" lang="en">
  <head>
    <meta charset="utf-8">
    <meta
      content="width=device-width, initial-scale=1, viewport-fit=cover"
      name="viewport"
    >
    <title>Printix Scanner</title>
    <meta content="Scan Printix event tickets at the gate." name="description">
    <meta content="Printix Scanner" name="application-name">
    <meta content="#0b0d0c" name="theme-color">
    <!-- A staff tool: nothing here is for search engines. -->
    <meta content="noindex, nofollow" name="robots">
    <meta content="yes" name="mobile-web-app-capable">
    <meta content="yes" name="apple-mobile-web-app-capable">
    <meta content="Printix" name="apple-mobile-web-app-title">
    <meta
      content="black-translucent"
      name="apple-mobile-web-app-status-bar-style"
    >
    <link href="/manifest.webmanifest" rel="manifest">
    <link
      href="/icons/icon-192.png"
      rel="icon"
      sizes="192x192"
      type="image/png"
    >
    <link
      href="/icons/apple-touch-icon.png"
      rel="apple-touch-icon"
      sizes="180x180"
    >
    <link
      as="font"
      crossorigin
      href="/fonts/inter-latin-wght.woff2"
      rel="preload"
      type="font/woff2"
    >
  </head>
  <body class="font-sans">
    <div id="root"></div>
    <script src="/src/main.tsx" type="module"></script>
  </body>
</html>
