[project]
name = "fast-back"
version = "0.1.0"
description = ""
requires-python = ">=3.14,<3.15"
dependencies = [
    # Upgrade the HTTP layer together; frozen lockfile records the tested pair.
    "fastapi[standard]>=0.162.0,<0.163.0",
    "starlette>=1.10.0,<1.11.0",
    "pydantic>=2.14.1,<3.0.0",
    "pydantic-settings>=2.16.1,<3.0.0",
    "resend>=2.0.0,<3.0.0",
    "jinja2>=3.1.4,<4.0.0",
    "alembic>=1.13.0,<2.0.0",
    "httpx>=0.27,<1.0.0",
    "psycopg[binary]>=3.3.6,<4.0.0",
    "asyncpg>=0.29.0,<1.0.0",
    "bcrypt>=4.2.0,<5.0.0",
    "sentry-sdk[fastapi]>=2.73.0,<3.0.0",
    "pyjwt>=2.9,<3.0.0",
    "scalar-fastapi>=1.4.4",
    "slowapi>=0.1.9",
    "python-json-logger>=2.0.0",
    "boto3>=1.43.36",
    "arq>=0.28.0",
    "redis>=5.3.1",
    "msgpack>=1.2.3",
    "setuptools>=78.1.1",
    "pyotp>=2.10.0",
    "shapely>=2.1.2",
    "feedparser>=6.0.12",
    "signxml>=5.0.1",
    "defusedxml>=0.7.1",
    "stripe>=16.0.0,<17.0.0",
    "weasyprint>=70",
    "copernicusmarine>=2.5.0",
    "cdsapi>=0.7.7",
    "pywebpush>=2.5.0",
    "ecmwf-opendata>=0.3.34",
    "eccodes>=2.49.0",
    "eccodeslib>=2.49.0.30",
]

[dependency-groups]
dev = [
    "pytest>=7.4.3",
    "pytest-asyncio>=1.4.1",
    "pytest-cov>=6.0.0",
    "pytest-xdist>=3.6.0",
    "mypy>=1.8.0",
    "ruff>=0.17.2",
    "pre-commit>=3.6.2",
    "coverage>=7.4.3",
    "fakeredis>=2.37.0",
    "types-defusedxml>=0.7.0.20260504",
    "schemathesis>=4",
    # Independent decoders used only to cross-check eregister.encode (SYNOP TAC, BUFR CSV).
    "pymetdecoder>=0.2.2",
    "csv2bufr>=0.8.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.mypy]
strict = true
python_version = "3.14"
exclude = ["venv", ".venv", "alembic"]

[[tool.mypy.overrides]]
# Third-party libraries that ship no type information (or, for gms_ingest, no
# py.typed marker). Importing them is fine; state it once instead of per import.
module = [
    "asyncpg.*",
    "boto3",
    "cdsapi.*",
    "eccodes.*",
    "ecmwf.*",
    "copernicusmarine.*",
    "pandas.*",
    "botocore.*",
    "feedparser",
    "gms_ingest.*",
    "lxml.*",
    "pymetdecoder.*",
    "csv2bufr.*",
    "py_vapid.*",
    "pywebpush.*",
    "shapely.*",
    "weasyprint.*",
]
ignore_missing_imports = true

[tool.ruff]
target-version = "py314"
exclude = ["alembic"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG001", # unused arguments in functions
    "T201",   # print statements are not allowed
    "ASYNC",  # flake8-async: blocking calls inside async def
    "S",      # flake8-bandit: common security anti-patterns
]
ignore = [
    "E501",  # line too long, handled by the formatter
    "B008",  # do not perform function calls in argument defaults
    "W191",  # indentation contains tabs
    "B904",  # Allow raising exceptions without from e, for HTTPException
    "S101",  # assert is used deliberately in a few guarded application spots
    "S104",  # binding 0.0.0.0 is intentional inside containers
    "S105",  # only false-positives here: token-type/error-message label constants
    "S311",  # non-crypto random is fine; crypto paths use `secrets`
    "UP042", # deliberately keep `str, Enum` over `StrEnum` — different str() semantics (see AGENTS.md → Enums)
]

[tool.ruff.lint.per-file-ignores]
# Scripts: dev/ops tooling — print output, re-exports, and a guarded
# rollback swallow are expected.
"scripts/*.py" = ["T201", "F401", "S110"]
# Model registries: these imports exist only to register tables on the shared
# SQLAlchemy metadata, so Ruff would otherwise flag every one as unused.
"src/database.py" = ["F401"]
"alembic/env.py" = ["F401"]
# Tests: hardcoded test secrets/URLs are expected.
"tests/*.py" = ["S105", "S106", "S107", "S108"]

[tool.ruff.lint.pyupgrade]
# Preserve types, even if a file imports `from __future__ import annotations`.
keep-runtime-typing = true

[tool.coverage.run]
source = ["src"]
branch = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# The Schemathesis fuzz suite (tests/test_api_fuzz.py) is slow, so local runs skip
# it. CI runs it in its own job with `-m fuzz`; a later -m on the command line
# replaces this one.
addopts = "--import-mode=importlib -m 'not fuzz'"
norecursedirs = ["scripts", ".git", ".tox", "dist", "build"]
asyncio_mode = "auto"
asyncio_default_test_loop_scope = "function"
asyncio_default_fixture_loop_scope = "function"
xfail_strict = true
markers = [
    "unit: no database required",
    "integration: requires Postgres",
    "fuzz: Schemathesis API fuzzing; skipped by default, CI runs it with -m fuzz",
]
filterwarnings = [
    "error::DeprecationWarning:src.*",
    "error::DeprecationWarning:tests.*",
    "ignore::DeprecationWarning:slowapi.*",
]

[tool.coverage.report]
# netcdf4 >= 1.7.5 ships Cython line-trace data for _netCDF4.pyx, which has no
# source on disk, so `coverage report` fails with "No source for code".
omit = ["*/netCDF4/*"]
show_missing = true
sort = "-Cover"

[tool.coverage.html]
show_contexts = true
