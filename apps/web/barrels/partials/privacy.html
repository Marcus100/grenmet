<!-- Shown only where optional analytics is configured: a popup on the
         first visit, then a small button to change the choice. -->
<button
  aria-label="Privacy settings"
  class="privacy-open"
  hidden
  id="analytics-open"
  type="button"
>
  Privacy
</button>
<section
  aria-labelledby="analytics-title"
  class="privacy-card"
  hidden
  id="analytics-settings"
  role="dialog"
>
  <h2 id="analytics-title">We use cookies.</h2>
  <details class="privacy-details">
    <summary>Read more</summary>
    <p>
      Optional analytics helps us improve this site. It starts only if you
      accept. You can change your choice using Privacy.
    </p>
    <p>
      Google Analytics counts visits without advertising. Your choice is saved
      on this site for six months.
    </p>
  </details>
  <p hidden id="analytics-description"></p>
  <div class="privacy-actions">
    <button id="analytics-accept" type="button">Accept</button>
    <button id="analytics-decline" type="button">Deny</button>
  </div>
</section>
