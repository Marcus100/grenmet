<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <title>Contact — Barrels Grenada</title>
    <meta
      content="Contact Barrels Grenada about a project or an existing service."
      name="description"
    >
    <meta content="dark" name="color-scheme">
    <link href="https://barrels.gd/contact/" rel="canonical">
    <meta content="Contact — Barrels Grenada" property="og:title">
    <meta content="https://barrels.gd/contact/" property="og:url">
    <meta content="website" property="og:type">
    <link href="/tokens.css" rel="stylesheet">
    <link href="/style.css" rel="stylesheet">
  </head>
  <body>
    <!-- @include site-header -->
    <main id="main">
      <!-- DRAFT COPY: the owner edits the wording. -->
      <section class="hero">
        <p class="eyebrow">Contact</p>
        <h1>Send us a message</h1>
        <p class="lead">
          Tell us about a project or an existing service. We reply to the email
          address you give, and we use your message only to answer it.
        </p>
      </section>

      <section aria-labelledby="form-title" class="section">
        <h2 id="form-title">Message</h2>
        <form
          aria-describedby="contact-note"
          class="form"
          id="contact-form"
          method="post"
          novalidate
        >
          <div aria-hidden="true" class="hp" inert>
            <label
              >Leave this field empty
              <input
                autocomplete="off"
                name="website"
                tabindex="-1"
                type="text"
              ></label
            >
          </div>
          <div class="field">
            <label for="contact-name">Name</label>
            <input
              autocomplete="name"
              data-validate
              id="contact-name"
              maxlength="120"
              minlength="2"
              name="name"
              required
              type="text"
            >
            <p class="error" hidden id="contact-name-error"></p>
          </div>
          <div class="field">
            <label for="contact-email">Email address</label>
            <input
              autocomplete="email"
              data-validate
              id="contact-email"
              maxlength="254"
              name="email"
              required
              type="email"
            >
            <p class="error" hidden id="contact-email-error"></p>
          </div>
          <div class="field">
            <label for="contact-subject">Subject</label>
            <input
              data-validate
              id="contact-subject"
              maxlength="200"
              name="subject"
              required
              type="text"
            >
            <p class="error" hidden id="contact-subject-error"></p>
          </div>
          <div class="field">
            <label for="contact-message">Message</label>
            <p class="hint" id="contact-message-hint">
              At least 10 characters. Up to 4000.
            </p>
            <textarea
              aria-describedby="contact-message-hint"
              data-validate
              id="contact-message"
              maxlength="4000"
              minlength="10"
              name="message"
              required
              rows="7"
            ></textarea>
            <p class="error" hidden id="contact-message-error"></p>
          </div>
          <p class="form-note" id="contact-note">
            Your message is sent only when you press the button.
          </p>
          <div class="form-actions">
            <button type="submit">Send message</button>
          </div>
          <p aria-live="polite" class="form-status" role="status"></p>
        </form>
        <noscript>
          <p class="form-note">
            Sending a message needs JavaScript. Nothing is sent without it.
          </p>
        </noscript>
      </section>
    </main>
    <!-- @include site-footer -->
    <!-- @include privacy -->
    <script src="/analytics.mjs" type="module"></script>
    <script src="/forms.mjs" type="module"></script>
  </body>
</html>
