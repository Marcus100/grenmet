[project]
name = "gnc-collector"
version = "0.1.0"
description = "Turns GeoNetCast Americas GOES-19 files into WxWatch archive images"
readme = "README.md"
requires-python = ">=3.14,<3.15"
# Every dependency is already locked for the workspace (geonetcast, notebooks,
# wxwatch); this package adds no new distributions to uv.lock.
dependencies = [
    "boto3>=1.43.42",
    "cartopy>=0.25.0",
    "matplotlib>=3.11.0",
    "netcdf4>=1.7.5",
    "numpy>=2.5.4",
    # cartopy needs scipy (or pykdtree) to warp the geostationary image.
    "scipy>=1.18.0",
]

[project.scripts]
gnc-collector = "gnc_collector.cli:main"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=8.4.0",
    "ruff>=0.17.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gnc_collector"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
python_version = "3.14"
# cartopy, netCDF4 and boto3 ship without type information.
ignore_missing_imports = true

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "UP"]
