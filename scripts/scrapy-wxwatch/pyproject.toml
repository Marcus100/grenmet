[project]
name = "wxwatch"
version = "0.1.0"
description = "Weather images downloader"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "botocore>=1.37.0",
    "scrapy>=2.13.4",
    "pillow>=8.0.0",
    "psycopg[binary]>=3.1.0",
    "python-dotenv>=1.2.1",
]

[dependency-groups]
dev = [
    "mypy>=1.17.0",
    "pytest>=8.4.0",
    "ruff>=0.12.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.mypy]
python_version = "3.13"
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
