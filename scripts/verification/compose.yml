services:
  backend-db:
    image: postgres:18
    environment:
      POSTGRES_USER: verification
      POSTGRES_PASSWORD: test-only-password
      POSTGRES_DB: postgres
    ports: ["127.0.0.1::5432"]
    tmpfs: [/var/lib/postgresql]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U verification -d postgres]
      interval: 2s
      timeout: 5s
      retries: 30
  storage-db:
    image: postgis/postgis:18-3.7@sha256:c5d1ba4292ff7b4471ff41cd515c677633797b72cdd2a7bb691cadaab91f1a1f
    environment:
      POSTGRES_USER: verification
      POSTGRES_PASSWORD: test-only-password
      POSTGRES_DB: postgres
    ports: ["127.0.0.1::5432"]
    tmpfs: [/var/lib/postgresql]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U verification -d postgres]
      interval: 2s
      timeout: 5s
      retries: 30
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1::6379"]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 5s
      retries: 30
