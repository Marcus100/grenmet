services:
  backend-db:
    image: postgres:17
    environment:
      POSTGRES_USER: verification
      POSTGRES_PASSWORD: test-only-password
      POSTGRES_DB: postgres
    ports: ["127.0.0.1::5432"]
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U verification -d postgres]
      interval: 2s
      timeout: 5s
      retries: 30
  storage-db:
    image: postgis/postgis:17-3.5@sha256:01a6a70e41e6c4467c8f55f6063555ed72db2d6662cd0d571040d42eadaeb6f6
    environment:
      POSTGRES_USER: verification
      POSTGRES_PASSWORD: test-only-password
      POSTGRES_DB: postgres
    ports: ["127.0.0.1::5432"]
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U verification -d postgres]
      interval: 2s
      timeout: 5s
      retries: 30
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1::6379"]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 5s
      retries: 30
