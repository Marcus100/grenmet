[project]
name = "grenmet-workspace"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = []

[tool.uv]
package = false
# One uv line everywhere (your machine, CI, Docker). The lockfile format follows
# the uv version, so a different uv rewrites uv.lock. The Dockerfiles pin
# 0.13.8 by digest; astral-sh/setup-uv reads this range in CI. Move to 0.14 in
# one change: bump the Docker pins and this range together, then re-lock.
required-version = ">=0.13.8,<0.14"
# GDAL 3.6.2 has no Python dependencies, but its legacy setup.py requires the
# native gdal-config binary even to read package metadata. Supplying that known
# metadata keeps workspace locking portable; installation still requires GDAL.
dependency-metadata = [
    { name = "gdal", version = "3.6.2", requires-dist = [] },
]

# GDAL's setup.py compiles the osgeo.gdal_array extension (gdal.ReadAsArray,
# gdal_array.OpenArray) only when NumPy is importable while it builds. uv
# builds in isolation, so supply the runtime's NumPy to that build.
[tool.uv.extra-build-dependencies]
gdal = [{ requirement = "numpy", match-runtime = true }]

[tool.uv.workspace]
members = [
    "apps/api/fastapi",
    "scripts/scrapy-wxwatch",
    "scripts/sutron-collector",
    "scripts/gnc-collector",
    "scripts/gms-ingest",
    "notebooks",
    "geonetcast",
]
