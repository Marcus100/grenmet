# Codex configuration for this repo (instruction budget and hooks).
#
# Mirrors .claude/settings.json's hooks so Claude Code and Codex enforce the
# same Never-tier rules (see AGENTS.md). Scripts are shared from
# .claude/hooks/ — do not fork them per tool.
#
# Reference: https://learn.chatgpt.com/docs/hooks
# Review changed hook definitions in /hooks; trust is tied to their hashes.
# These scripts are supplementary safeguards, not a substitute for sandbox
# permissions or approval policy. Keep one hook representation in this layer.

# Codex concatenates AGENTS.md from the repo root down to the working
# directory and stops at this byte budget (default 32 KiB). Root + FastAPI +
# a domain guide can exceed the default; scripts/guardrails keeps every chain
# under this value.
project_doc_max_bytes = 65536

[[hooks.PreToolUse]]
matcher = "^Bash$"
[[hooks.PreToolUse.hooks]]
type = "command"
command = 'hook_root=$(git rev-parse --show-toplevel) && node "$hook_root/.claude/hooks/block-dangerous-git.mjs"'
timeout = 30
[[hooks.PreToolUse.hooks]]
type = "command"
command = 'hook_root=$(git rev-parse --show-toplevel) && node "$hook_root/.claude/hooks/protect-files.mjs"'
timeout = 30
[[hooks.PreToolUse.hooks]]
type = "command"
command = 'hook_root=$(git rev-parse --show-toplevel) && node "$hook_root/.claude/hooks/audit-log.mjs"'
timeout = 30

[[hooks.PreToolUse]]
matcher = "^apply_patch$"
[[hooks.PreToolUse.hooks]]
type = "command"
command = 'hook_root=$(git rev-parse --show-toplevel) && node "$hook_root/.claude/hooks/protect-files.mjs"'
timeout = 30

# Formatting is explicit or staged at commit time. Never mutate all dirty files
# automatically on Stop: another client may own them. The Stop hook below only
# reads: it asks once for `pnpm verify:changed` when changes are unverified.

[[hooks.Stop]]
[[hooks.Stop.hooks]]
type = "command"
command = 'hook_root=$(git rev-parse --show-toplevel) && node "$hook_root/.claude/hooks/verify-before-stop.mjs"'
timeout = 30

[[hooks.SessionStart]]
matcher = "^(startup|resume|clear|compact|fork)$"
[[hooks.SessionStart.hooks]]
type = "command"
command = 'hook_root=$(git rev-parse --show-toplevel) && node "$hook_root/.claude/hooks/session-handoff.mjs"'
timeout = 10
